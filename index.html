  /* ---- Edit a category: its name and the picture on its home tile.
     The picture is shrunk on the phone to a small JPEG (about 50 KB) and
     saved with the rest of the songbook on this device, so it's there next
     time, and it goes into Backup like everything else. Nothing uploads
     anywhere. Built-in categories can take a new picture too; removing it
     puts the original art back. ---- */
  var editCat = null; // { id, isNew, pendingImage: undefined | null | dataURL }
  function editCategoryModalHtml() {
    return (
      '<div class="modal-backdrop" id="edit-category-modal" hidden>' +
        '<div class="modal-card edit-cat-card">' +
          '<h2 id="edit-cat-title">Edit category</h2>' +
          '<label class="field edit-cat-field"><span class="field-label">Name</span>' +
            '<input type="text" id="edit-cat-name" maxlength="40" /></label>' +
          '<div class="edit-cat-image">' +
            '<div class="home-tile edit-cat-preview" id="edit-cat-preview">' +
              '<span class="home-tile-label"><span class="home-tile-name" id="edit-cat-preview-name"></span></span>' +
            '</div>' +
            '<div class="edit-cat-image-actions">' +
              '<span class="btn btn-ghost file-pick">Choose picture' +
                '<input type="file" id="category-image-input" class="file-pick-input" ' +
                  'accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.heic,.heif" aria-label="Choose picture" /></span>' +
              '<button type="button" class="btn btn-ghost" id="edit-cat-clear" data-action="edit-cat-clear-image">Remove picture</button>' +
              '<p class="edit-cat-hint">Or copy a photo and paste it here.</p>' +
            '</div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" data-action="edit-cat-cancel" id="edit-cat-cancel">Cancel</button>' +
            '<button class="btn btn-primary" data-action="edit-cat-save">Save</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  // Tiles are portrait (3:4); keep the photo's own shape, cap the long side.
  var CAT_IMAGE_MAX = 640;
  function imageFileToTileDataUrl(file) {
    var url = URL.createObjectURL(file);
    return loadImageElement(url).then(function (img) {
      URL.revokeObjectURL(url);
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error('empty');
      var scale = Math.min(1, CAT_IMAGE_MAX / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.82);
    }, function (err) { URL.revokeObjectURL(url); throw err; });
  }
  function takeCategoryImage(file) {
    if (!editCat) return;
    if (!isImageFile(file)) { toast('That isn’t a picture. Use a JPG or PNG.'); return; }
    imageFileToTileDataUrl(file).then(function (dataUrl) {
      if (!editCat) return;
      editCat.pendingImage = dataUrl;
      paintEditCategoryPreview();
    }).catch(function () {
      toast('That picture couldn’t be opened. Try a JPG or PNG.');
    });
  }
  function editCategoryEffectiveImage() {
    if (!editCat) return null;
    if (editCat.pendingImage === null) {
      var builtIn = CATEGORY_ART[editCat.id];
      return builtIn ? { url: artUrl(builtIn.src), focus: builtIn.focus } : null;
    }
    if (editCat.pendingImage) return { url: editCat.pendingImage, focus: 'center' };
    return tileArtFor(editCat.id);
  }
  function paintEditCategoryPreview() {
    var box = byId('edit-cat-preview');
    if (!box || !editCat) return;
    var col = tileColorsFor(editCat.id);
    var art = editCategoryEffectiveImage();
    box.className = 'home-tile edit-cat-preview' + (art ? ' home-tile-art' : '');
    box.style.cssText = '--tile-a:' + col[0] + ';--tile-b:' + col[1] + ';--tile-glow:' + hexToRgba(col[0], 0.35) +
      (art ? ";--tile-art:url('" + art.url + "');--tile-focus:" + art.focus : '');
    var nameEl = byId('edit-cat-preview-name');
    var input = byId('edit-cat-name');
    if (nameEl) nameEl.textContent = (input && input.value.trim()) || categoryLabel(editCat.id) || '';
    // "Remove picture" only means something when a picture of their own is showing.
    var own = editCat.pendingImage ? true : (editCat.pendingImage === null ? false : !!(state.settings.categoryImages || {})[editCat.id]);
    var clearBtn = byId('edit-cat-clear');
    if (clearBtn) {
      clearBtn.hidden = !own;
      clearBtn.textContent = CATEGORY_ART[editCat.id] ? 'Use original art' : 'Remove picture';
    }
  }
  function openEditCategory(catId, isNew) {
    if (!isKnownCategory(catId)) return;
    editCat = { id: catId, isNew: !!isNew, pendingImage: undefined };
    var title = byId('edit-cat-title');
    if (title) title.textContent = isNew ? 'Add a picture' : 'Edit category';
    var cancel = byId('edit-cat-cancel');
    if (cancel) cancel.textContent = isNew ? 'Skip' : 'Cancel';
    var input = byId('edit-cat-name');
    if (input) {
      input.value = categoryLabel(catId) || '';
      input.oninput = paintEditCategoryPreview;
    }
    paintEditCategoryPreview();
    setModal('edit-category-modal', true);
  }
  function closeEditCategory() {
    editCat = null;
    setModal('edit-category-modal', false);
  }
  function saveEditCategory() {
    if (!editCat) return;
    var id = editCat.id;
    var input = byId('edit-cat-name');
    var name = input ? input.value.trim() : '';
    var before = JSON.stringify(state.settings);
    if (name && name !== categoryLabel(id)) {
      var custom = state.settings.customCategories || [];
      var mine = custom.filter(function (x) { return x.id === id; })[0];
      if (mine) { mine.label = name; mine.tabLabel = name; }
      else {
        state.settings.categoryNames = state.settings.categoryNames || {};
        var original = SONG_CATEGORIES.filter(function (x) { return x.id === id; })[0];
        if (original && (name === original.label || name === original.tabLabel)) delete state.settings.categoryNames[id];
        else state.settings.categoryNames[id] = name;
      }
    }
    if (editCat.pendingImage !== undefined) {
      state.settings.categoryImages = state.settings.categoryImages || {};
      if (editCat.pendingImage) state.settings.categoryImages[id] = editCat.pendingImage;
      else delete state.settings.categoryImages[id];
    }
    // Save right now (not debounced) so a full phone is caught here, with
    // the picture undone, instead of silently losing it later.
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      state.settings = JSON.parse(before);
      toast('Not enough space on this device for that picture. Try a smaller one.');
      return;
    }
    closeEditCategory();
    toast('Saved.');
    render();
  }

  /* ---- Delete a category (built-in or custom). Only the category goes:
     its songs stay in the library and fall back to Uncategorized. ---- */
  function deleteCategoryConfirmModalHtml() {
    return (
      '<div class="modal-backdrop" id="delete-category-confirm-modal" hidden>' +
        '<div class="modal-card">' +
          '<h2>Delete this category?</h2>' +
          '<p id="delete-category-confirm-text">The songs in it won&rsquo;t be deleted.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" data-action="cancel-delete-category">Cancel</button>' +
            '<button class="btn btn-danger" data-action="confirm-delete-category">Delete</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  var pendingDeleteCategoryId = null;
  function requestDeleteCategory(catId) {
    if (!isKnownCategory(catId)) return;
    pendingDeleteCategoryId = catId;
    var count = state.songs.filter(function (s) { return s.category === catId; }).length;
    var textEl = byId('delete-category-confirm-text');
    if (textEl) {
      textEl.textContent = 'Delete "' + categoryLabel(catId) + '"? ' +
        (count ? 'The ' + count + (count === 1 ? ' song' : ' songs') + ' in it won’t be deleted — they move to Uncategorized.' : 'It has no songs in it.');
    }
    var modal = byId('delete-category-confirm-modal');
    if (modal) modal.hidden = false;
  }
  function cancelDeleteCategory() {
    pendingDeleteCategoryId = null;
    var modal = byId('delete-category-confirm-modal');
    if (modal) modal.hidden = true;
  }
  function confirmDeleteCategory() {
    var catId = pendingDeleteCategoryId;
    var label = categoryLabel(catId);
    cancelDeleteCategory();
    if (!catId || !label) return;
    var moved = 0;
    state.songs.forEach(function (s) {
      if (s.category === catId) { s.category = null; s.updatedAt = Date.now(); moved++; }
    });
    var custom = state.settings.customCategories || [];
    if (custom.some(function (c) { return c.id === catId; })) {
      state.settings.customCategories = custom.filter(function (c) { return c.id !== catId; });
    }
    if (SONG_CATEGORIES.some(function (c) { return c.id === catId; })) {
      var hidden = state.settings.hiddenCategories || [];
      if (hidden.indexOf(catId) === -1) state.settings.hiddenCategories = hidden.concat([catId]);
    }
    if (state.settings.categoryColors) delete state.settings.categoryColors[catId];
    if (state.settings.categoryImages) delete state.settings.categoryImages[catId];
    if (state.settings.categoryNames) delete state.settings.categoryNames[catId];
    state.settings.libraryFilter = 'all';
    persist();
    toast('Deleted "' + label + '".' + (moved ? ' ' + moved + (moved === 1 ? ' song' : ' songs') + ' moved to Uncategorized.' : ''));
    // That category's screen no longer exists — back to the home tiles.
    goHome(true);
  }

  /* ============================================================
     RENDER: SONG LISTS
     A "song list" is a named group of songs — a setlist, a gig, whatever —
     kept separate from category: a song can sit in any number of song
     lists regardless of which single category it's filed under.
     ============================================================ */
  function renderSongLists() {
    var lists = state.songLists.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; });

    var listHtml;
    if (lists.length === 0) {
      listHtml =
        '<div class="empty-state">' +
          '<div class="empty-mark" aria-hidden="true">' + listSvg(64) + '</div>' +
          '<h2>No song lists yet</h2>' +
          '<p>Group songs into a setlist or a gig &mdash; separate from category, and a song can be in more than one.</p>' +
          '<button class="btn btn-primary btn-lg" data-action="new-songlist">' + plusSvg() + ' New song list</button>' +
        '</div>';
    } else {
      listHtml = '<div class="song-grid">' + lists.map(function (l) {
        var count = l.songIds.length;
        return (
          '<div class="song-card" data-action="open-songlist" data-id="' + l.id + '">' +
            '<div class="song-card-top">' +
              '<h3>' + escapeHtml(l.name || 'Untitled list') + '</h3>' +
              '<div class="song-card-menu">' +
                '<button class="icon-btn icon-btn-danger" data-action="request-delete-songlist" data-id="' + l.id + '" aria-label="Delete ' + escapeHtml(l.name) + '" title="Delete">' + trashSvg(14) + '</button>' +
              '</div>' +
            '</div>' +
            '<p class="song-card-preview">' + count + (count === 1 ? ' song' : ' songs') + '</p>' +
          '</div>'
        );
      }).join('') + '</div>';
    }

    root.innerHTML =
      '<div class="screen screen-library">' +
        '<header class="topbar">' +
          '<button class="icon-btn" data-action="songlists-back" aria-label="Back to library">' + backSvg() + '</button>' +
          '<h1>Song Lists</h1>' +
          '<span class="icon-btn" style="visibility:hidden" aria-hidden="true"></span>' +
        '</header>' +
        '<main class="library-main">' +
          (lists.length > 0 ? '<div class="library-heading"><h1>Your song lists</h1><button class="btn btn-primary" data-action="new-songlist">' + plusSvg() + ' New list</button></div>' : '') +
          listHtml +
        '</main>' +
        deleteListConfirmModalHtml() +
        namePromptModalHtml() +
      '</div>';
  }

  function deleteListConfirmModalHtml() {
    return (
      '<div class="modal-backdrop" id="delete-list-confirm-modal" hidden>' +
        '<div class="modal-card">' +
          '<h2>Delete this song list?</h2>' +
          '<p id="delete-list-confirm-text">This can&rsquo;t be undone. The songs themselves won&rsquo;t be deleted.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-ghost" data-action="cancel-delete-songlist">Cancel</button>' +
            '<button class="btn btn-danger" data-action="confirm-delete-songlist">Delete</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  var pendingDeleteListId = null;
  function requestDeleteSongList(id) {
    var l = findSongList(id);
    if (!l) return;
    pendingDeleteListId = id;
    var textEl = byId('delete-list-confirm-text');
    if (textEl) textEl.textContent = 'Delete "' + l.name + '"? This can’t be undone. The songs themselves won’t be deleted.';
    var modal = byId('delete-list-confirm-modal');
    if (modal) modal.hidden = false;
  }
  function cancelDeleteSongList() {
    pendingDeleteListId = null;
    var modal = byId('delete-list-confirm-modal');
    if (modal) modal.hidden = true;
  }
  function confirmDeleteSongList() {
    var id = pendingDeleteListId;
    pendingDeleteListId = null;
    var modal = byId('delete-list-confirm-modal');
    if (modal) modal.hidden = true;
    if (!id) return;
    state.songLists = state.songLists.filter(function (x) { return x.id !== id; });
    persist();
    toast('Deleted.');
    // Deleted from inside the list itself: that screen no longer exists,
    // so land back on the song lists overview.
    if (view.name === 'songlist') goSongLists(true);
    else renderSongLists();
  }

  /* ---- Song list detail: the songs in one list, plus an add-songs picker ---- */
  function renderSongListDetail() {
    var list = findSongList(view.listId);
    if (!list) { goSongLists(true); return; }
    var songs = list.songIds.map(findSong).filter(function (s) { return !!s; });

    var listHtml;
    if (songs.length === 0) {
      listHtml =
        '<div class="empty-state">' +
          '<div class="empty-mark" aria-hidden="true">' + listSvg(64) + '</div>' +
          '<h2>No songs in this list yet</h2>' +
          '<p>Add any songs from your library to this list.</p>' +
          '<button class="btn btn-primary btn-lg" data-action="open-songlist-picker">' + plusSvg() + ' Add songs</button>' +
        '</div>';
    } else {
      listHtml = '<div class="song-grid">' + songs.map(function (s) {
        var catLabel = s.category ? categoryLabel(s.category) : null;
        return (
          '<div class="song-card" data-action="open-song" data-id="' + s.id + '">' +
            '<div class="song-card-top">' +
              '<h3>' + escapeHtml(s.title || 'Untitled') + '</h3>' +
              '<div class="song-card-menu">' +
                '<button class="icon-btn" data-action="move-song" data-id="' + s.id + '" aria-label="Move ' + escapeHtml(s.title) + ' to a category" title="Move to category">' + folderSvg(14) + '</button>' +
                '<button class="icon-btn icon-btn-danger" data-action="remove-song-from-list" data-id="' + s.id + '" aria-label="Remove ' + escapeHtml(s.title) + ' from this list" title="Remove from list">' + xSvg(14) + '</button>' +
              '</div>' +
            '</div>' +
            (s.artist ? '<p class="song-card-artist">' + escapeHtml(s.artist) + '</p>' : '') +
            (catLabel ? '<div class="chip-row"><span class="chip chip-muted">' + escapeHtml(catLabel) + '</span></div>' : '') +
          '</div>'
        );
      }).join('') + '</div>';
    }

    root.innerHTML =
      '<div class="screen screen-library">' +
        '<header class="topbar">' +
          '<button class="icon-btn" data-action="songlist-back" aria-label="Back to song lists">' + backSvg() + '</button>' +
          '<h1>' + escapeHtml(list.name || 'Untitled list') + '</h1>' +
          '<div class="topbar-actions">' +
            '<button class="icon-btn" data-action="rename-songlist" data-id="' + list.id + '" aria-label="Rename this list" title="Rename">' + pencilSvg() + '</button>' +
            '<button class="icon-btn icon-btn-danger" data-action="request-delete-songlist" data-id="' + list.id + '" aria-label="Delete this list" title="Delete list">' + trashSvg() + '</button>' +
          '</div>' +
        '</header>' +
        '<main class="library-main">' +
          (songs.length > 0 ? '<div class="library-heading"><h1>' + songs.length + (songs.length === 1 ? ' song' : ' songs') + '</h1><button class="btn btn-primary" data-action="open-songlist-picker">' + plusSvg() + ' Add songs</button></div>' : '') +
          listHtml +
        '</main>' +
        songlistPickerModalHtml(list) +
        deleteListConfirmModalHtml() +
        moveCategoryModalHtml() +
        namePromptModalHtml() +
      '</div>';
  }

  function songlistPickRowsHtml(list) {
    var allSongs = state.songs.slice().sort(function (a, b) { return (a.title || '').localeCompare(b.title || ''); });
    if (allSongs.length === 0) return '<p>No songs in your library yet.</p>';
    return allSongs.map(function (s) {
      var included = list.songIds.indexOf(s.id) !== -1;
      return '<button type="button" class="move-cat-btn' + (included ? ' move-cat-btn-active' : '') +
        '" data-action="toggle-songlist-song" data-listid="' + list.id + '" data-songid="' + s.id + '">' +
        '<span>' + escapeHtml(s.title || 'Untitled') + '</span>' +
        (included ? checkSvg() : '') +
      '</button>';
    }).join('');
  }
  function songlistPickerModalHtml(list) {
    return (
      '<div class="modal-backdrop" id="songlist-picker-modal" hidden>' +
        '<div class="modal-card">' +
          '<h2>Add songs</h2>' +
          '<div class="move-cat-list songlist-pick-list" id="songlist-pick-list">' + songlistPickRowsHtml(list) + '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-primary" data-action="close-songlist-picker">Done</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  function openSonglistPicker() {
    var modal = byId('songlist-picker-modal');
    if (modal) modal.hidden = false;
  }
  function closeSonglistPicker() {
    var modal = byId('songlist-picker-modal');
    if (modal) modal.hidden = true;
    renderSongListDetail();
  }
  function toggleSonglistSong(listId, songId) {
    var list = findSongList(listId);
    if (!list) return;
    var idx = list.songIds.indexOf(songId);
    if (idx === -1) list.songIds.push(songId); else list.songIds.splice(idx, 1);
    list.updatedAt = Date.now();
    persist();
    var container = byId('songlist-pick-list');
    if (container) container.innerHTML = songlistPickRowsHtml(list);
  }
  function removeSongFromList(songId) {
    var list = findSongList(view.listId);
    if (!list) return;
    var idx = list.songIds.indexOf(songId);
    if (idx !== -1) {
      list.songIds.splice(idx, 1);
      list.updatedAt = Date.now();
      persist();
    }
    renderSongListDetail();
  }

  /* ============================================================
     RENDER: EDITOR (add / edit song)
     ============================================================ */
  var editorDraft = null; // { id, title, key, bpm, lyrics, image }

  function openEditorDraft(songId) {
    if (songId) {
      var s = findSong(songId);
      editorDraft = s ? JSON.parse(JSON.stringify(s)) : blankDraft();
    } else {
      editorDraft = blankDraft();
    }
  }
  function blankDraft() {
    return { id: null, title: '', artist: '', key: '', bpm: '', category: null, lyrics: '', image: null };
  }

  function renderEditor() {
    if (!editorDraft) openEditorDraft(view.songId);
    var d = editorDraft;
    var isEdit = !!d.id;

    root.innerHTML =
      '<div class="screen screen-editor">' +
        '<header class="topbar topbar-editor">' +
          '<button class="icon-btn" data-action="editor-cancel" aria-label="Back">' + backSvg() + '</button>' +
          '<h1>' + (isEdit ? 'Edit song' : 'Add song') + '</h1>' +
          '<div class="topbar-actions">' +
            (isEdit ? '<button class="icon-btn icon-btn-danger" data-action="request-delete-song" data-id="' + d.id + '" aria-label="Delete song" title="Delete">' + trashSvg() + '</button>' : '') +
            '<button class="btn btn-primary" data-action="editor-save">Save</button>' +
          '</div>' +
        '</header>' +
        '<main class="editor-main">' +
          '<label class="field">' +
            '<span class="field-label">Title</span>' +
            '<input type="text" id="f-title" placeholder="Song title" value="' + escapeHtml(d.title) + '" />' +
          '</label>' +
          '<label class="field">' +
            '<span class="field-label">Artist <span class="field-optional">(optional)</span></span>' +
            '<input type="text" id="f-artist" placeholder="e.g. Colin Hay" value="' + escapeHtml(d.artist || '') + '" />' +
          '</label>' +
          '<div class="field-row">' +
            '<label class="field">' +
              '<span class="field-label">Key <span class="field-optional">(optional)</span></span>' +
              '<input type="text" id="f-key" placeholder="e.g. G, E minor" value="' + escapeHtml(d.key) + '" />' +
            '</label>' +
            '<label class="field">' +
              '<span class="field-label">Tempo <span class="field-optional">(optional)</span></span>' +
              '<input type="text" id="f-bpm" placeholder="e.g. 96" value="' + escapeHtml(d.bpm) + '" />' +
            '</label>' +
          '</div>' +
          '<label class="field">' +
            '<span class="field-label">Category</span>' +
            '<select id="f-category">' +
              '<option value=""' + (!d.category ? ' selected' : '') + '>Uncategorized</option>' +
              allCategories().map(function (c) {
                return '<option value="' + c.id + '"' + (d.category === c.id ? ' selected' : '') + '>' + escapeHtml(c.label) + '</option>';
              }).join('') +
            '</select>' +
          '</label>' +

          // Upload text file / Add photo were removed: on Daniel's phone the
          // native picker opens but the webview never gets a completed
          // selection back from it (same platform-block family as the
          // earlier microphone and clipboard-read limits), so the buttons
          // just teased a feature that couldn't finish. Native long-press
          // paste directly into the lyrics box still works fine.
          // The photo preview stays so a song saved with an image from
          // before this removal can still be viewed and removed.
          (d.image ? (
            '<div class="photo-preview">' +
              '<img src="' + d.image + '" alt="Reference photo of lyrics" />' +
              '<button class="btn btn-ghost btn-sm" data-action="remove-photo">Remove photo</button>' +
            '</div>'
          ) : '') +

          // Import lyrics straight from a PDF, Word doc, text file, or a
          // photo of a chord sheet — extracted text always lands in the
          // review box first, so nothing overwrites the lyrics field
          // until the person taps "Use this text".
          '<div class="import-row">' +
            '<button class="btn btn-ghost" type="button" data-action="toggle-import-menu" id="import-open-btn">Import lyrics</button>' +
            '<div id="import-menu" class="import-menu" hidden>' +
              '<label for="import-file-input">Import file</label>' +
              '<label for="import-image-input">Import image</label>' +
              '<p class="import-hint">PDF, Word (.docx), a text file, or a photo of a chord sheet. You&rsquo;ll review the text before it goes in. You can also copy a photo and paste it on this screen.</p>' +
              '<div class="import-drop" id="import-drop">Or drop a PDF / photo here</div>' +
            '</div>' +
          '</div>' +

          '<label class="field">' +
            '<span class="field-label">Lyrics</span>' +
            '<textarea id="f-lyrics" rows="14" placeholder="Type or paste lyrics here. Leave a blank line between sections. Chords in [brackets] are fine, e.g. [G] Some [C] line here.">' + escapeHtml(d.lyrics) + '</textarea>' +
          '</label>' +
        '</main>' +
        (isEdit ? deleteConfirmModalHtml() : '') +
      '</div>';

    // Wire up field listeners (kept in sync with draft object as the user types)
    byId('f-title').addEventListener('input', function (e) { editorDraft.title = e.target.value; });
    byId('f-artist').addEventListener('input', function (e) { editorDraft.artist = e.target.value; });
    byId('f-key').addEventListener('input', function (e) { editorDraft.key = e.target.value; });
    byId('f-bpm').addEventListener('input', function (e) { editorDraft.bpm = e.target.value; });
    byId('f-category').addEventListener('change', function (e) { editorDraft.category = e.target.value || null; });
    byId('f-lyrics').addEventListener('input', function (e) { editorDraft.lyrics = e.target.value; });
    wireImportDrop();
  }

  function byId(id) { return document.getElementById(id); }


  function saveEditor(fromImport) {
    var d = editorDraft;
    if (!d.title || !d.title.trim()) {
      toast('Give the song a title first.');
      byId('f-title').focus();
      return;
    }
    var now = Date.now();
    var chordTag = autoTagChordLines(d.lyrics);
    var chordSplit = splitInlineChordLines(chordTag.text);
    var lyricsToSave = chordSplit.text;
    if (d.id) {
      var existing = findSong(d.id);
      if (existing) {
        existing.title = d.title.trim();
        existing.artist = (d.artist || '').trim();
        existing.key = d.key.trim();
        existing.bpm = d.bpm.trim();
        existing.category = d.category || null;
        existing.lyrics = lyricsToSave;
        existing.image = d.image;
        existing.updatedAt = now;
      }
    } else {
      state.songs.push({
        id: uid(),
        title: d.title.trim(),
        artist: (d.artist || '').trim(),
        key: d.key.trim(),
        bpm: d.bpm.trim(),
        category: d.category || null,
        lyrics: lyricsToSave,
        image: d.image,
        createdAt: now,
        updatedAt: now
      });
    }
    persist();
    editorDraft = null;
    var noteParts = [];
    if (chordTag.taggedCount > 0) {
      noteParts.push(chordTag.taggedCount + ' chord line' + (chordTag.taggedCount === 1 ? '' : 's') + ' tagged');
    }
    if (chordSplit.splitCount > 0) {
      noteParts.push(chordSplit.splitCount + ' line' + (chordSplit.splitCount === 1 ? '' : 's') + ' split for the chord layout');
    }
    toast(noteParts.length > 0
      ? ('Saved — ' + noteParts.join(', ') + '.')
      : 'Saved to your songbook.');
    // Multi-file import: after each file's reviewed text gets saved as its
    // own song, move straight on to the next queued file instead of
    // dropping back to the library — so picking several files at once
    // reviews and saves them one after another.
    if (fromImport && importQueue.length) {
      var nextFile = importQueue.shift();
      ensureDraftForImport();
      runImport(nextFile);
    } else {
      goLibrary();
    }
  }

  // window.confirm() is a native blocking dialog, and dialogs like this are
  // unreliable inside this app's sandboxed hosting (same family as the
  // blocked microphone/clipboard/file-picker access documented elsewhere in
  // this file) — the delete button looked "dead" because the confirm never
  // actually showed, so it silently returned false every time. This uses
  // the app's own modal instead, which isn't subject to that restriction.
  var pendingDeleteId = null;
  function requestDeleteSong(id) {
    var s = findSong(id);
    if (!s) return;
    pendingDeleteId = id;
    var textEl = byId('delete-confirm-text');
    if (textEl) textEl.textContent = 'Delete "' + s.title + '"? This can’t be undone.';
    var modal = byId('delete-confirm-modal');
    if (modal) modal.hidden = false;
  }
  function cancelDeleteSong() {
    pendingDeleteId = null;
    var modal = byId('delete-confirm-modal');
    if (modal) modal.hidden = true;
  }
  function confirmDeleteSong() {
    var id = pendingDeleteId;
    pendingDeleteId = null;
    var modal = byId('delete-confirm-modal');
    if (modal) modal.hidden = true;
    if (!id) return;
    state.songs = state.songs.filter(function (x) { return x.id !== id; });
    // Song lists reference songs by id — drop the deleted id out of every
    // list too, rather than leaving a dangling reference a list would
    // silently skip forever.
    state.songLists.forEach(function (l) {
      var idx = l.songIds.indexOf(id);
      if (idx !== -1) { l.songIds.splice(idx, 1); l.updatedAt = Date.now(); }
    });
    persist();
    toast('Deleted.');
    // Deleting from inside the editor or the player leaves that screen
    // pointing at a song that no longer exists — bounce back to the
    // library instead of re-rendering a stale/broken view of it.
    if (view.name === 'editor' || view.name === 'player') {
      stopPlayerLoop();
      editorDraft = null;
      goLibrary();
    } else {
      render();
    }
  }

  var pendingMoveId = null;
  function requestMoveSong(id) {
    var s = findSong(id);
    if (!s) return;
    pendingMoveId = id;
    var textEl = byId('move-category-text');
    if (textEl) textEl.textContent = 'Move "' + s.title + '" to:';
    var listEl = byId('move-category-list');
    if (listEl) {
      var options = [{ id: '', label: 'Uncategorized' }].concat(allCategories());
      var current = s.category || '';
      listEl.innerHTML = options.map(function (opt) {
        var active = opt.id === current;
        return '<button type="button" class="move-cat-btn' + (active ? ' move-cat-btn-active' : '') +
          '" data-action="pick-move-category" data-cat="' + opt.id + '">' +
          '<span>' + escapeHtml(opt.label) + '</span>' +
          (active ? checkSvg() : '') +
        '</button>';
      }).join('');
    }
    var modal = byId('move-category-modal');
    if (modal) modal.hidden = false;
  }
  function cancelMoveSong() {
    pendingMoveId = null;
    var modal = byId('move-category-modal');
    if (modal) modal.hidden = true;
  }
  function pickMoveCategory(catId) {
    var id = pendingMoveId;
    if (!id) return;
    var s = findSong(id);
    if (!s) { cancelMoveSong(); return; }
    s.category = catId || null;
    s.updatedAt = Date.now();
    persist();
    cancelMoveSong();
    toast('Moved to ' + (catId ? categoryLabel(catId) : 'Uncategorized') + '.');
    render();
  }

  /* ---- Song/category color picker: tags a song (or every song in a
     category at once) with one of the 52 named art palettes, shown as a
     colored edge on its library card. Picking a swatch only stages it —
     nothing is applied until "Set color", so the category path can show
     its override warning before anything actually changes. ---- */
  var colorPickerContext = null;   // { type: 'song', songId } | { type: 'category', categoryId }
  var colorPickerPendingId = null; // staged palette id, or null for "No color"

  function currentColorIdForContext() {
    if (!colorPickerContext) return null;
    if (colorPickerContext.type === 'song') {
      var s = findSong(colorPickerContext.songId);
      return s ? (s.colorId || null) : null;
    }
    return (state.settings.categoryColors || {})[colorPickerContext.categoryId] || null;
  }

  function colorSwatchGridHtml(selectedId) {
    var noneActive = !selectedId;
    var html = '<button type="button" class="color-swatch color-swatch-none' + (noneActive ? ' color-swatch-selected' : '') +
      '" data-action="pick-color-swatch" data-color="" aria-label="No color" title="No color">' +
      (noneActive ? checkSvg() : 'None') +
    '</button>';
    html += ART_PALETTES.map(function (p) {
      var active = p.id === selectedId;
      return '<button type="button" class="color-swatch' + (active ? ' color-swatch-selected' : '') +
        '" data-action="pick-color-swatch" data-color="' + p.id + '" aria-label="' + escapeHtml(p.label) +
        '" title="' + escapeHtml(p.label) + '" style="background:linear-gradient(135deg,' + p.dark + ' 50%,' + p.accent + ' 50%)">' +
        (active ? checkSvg() : '') +
      '</button>';
    }).join('');
    return html;
  }

  function renderColorPickerModal() {
    if (!colorPickerContext) return;
    var titleEl = byId('color-picker-title');
    var warnEl = byId('color-picker-warning');
    var gridEl = byId('color-picker-grid');
    if (colorPickerContext.type === 'song') {
      var s = findSong(colorPickerContext.songId);
      if (titleEl) titleEl.textContent = 'Song color';
      if (warnEl) warnEl.hidden = true;
    } else {
      var label = categoryLabel(colorPickerContext.categoryId) ||
        (colorPickerContext.categoryId === 'uncategorized' ? 'Uncategorized' : 'this category');
      if (titleEl) titleEl.textContent = 'Color code "' + label + '"';
      if (warnEl) {
        warnEl.hidden = false;
        warnEl.textContent = 'This sets every song in "' + label + '" to this color, overriding any individual colors already set on them.';
      }
    }
    if (gridEl) gridEl.innerHTML = colorSwatchGridHtml(colorPickerPendingId);
  }

  function openColorPicker(context) {
    colorPickerContext = context;
    colorPickerPendingId = currentColorIdForContext();
    renderColorPickerModal();
    var modal = byId('color-picker-modal');
    if (modal) modal.hidden = false;
  }
  function stagePendingColor(colorId) {
    colorPickerPendingId = colorId || null;
    renderColorPickerModal();
  }
  function cancelColorPicker() {
    colorPickerContext = null;
    colorPickerPendingId = null;
    var modal = byId('color-picker-modal');
    if (modal) modal.hidden = true;
  }
  function confirmColorPicker() {
    if (!colorPickerContext) return;
    if (colorPickerContext.type === 'song') {
      var s = findSong(colorPickerContext.songId);
      if (s) {
        s.colorId = colorPickerPendingId;
        s.updatedAt = Date.now();
        persist();

  /* ============================================================
     IMPORT: file / photo / PDF / Word import into the editor.

     pdf.js reads text PDFs, falling back to Tesseract OCR when a PDF has
     no selectable text (a scanned chord sheet, say); a built-in unzipper
     reads .docx (old binary .doc is rejected — ask for .docx or PDF
     instead); Tesseract also OCRs a photo directly. pdf.js and Tesseract
     are published as same-origin files in vendor/ and loaded on first use,
     so the base app stays lean and nothing depends on a CDN. Whatever
     comes out always lands in a review box first — nothing is saved
     until "Use this text" is tapped, since OCR and PDF-layout guessing
     are never perfect.

     A JSON library backup/restore was ported alongside this at the same
     time, sitting as its own row on the library screen — Daniel didn't
     ask for it and didn't want it cluttering the library, so it (and the
     download-capability plumbing it alone needed) was removed again.
     ============================================================ */
  var importQueue = [];
  var ignorePopUntil = 0;
  function armFilePickerGuard() {
    ignorePopUntil = Date.now() + 20000;
  }
  // Android's native file-picker sheet fires a focus on the input the
  // instant it opens — arm the popstate guard right there rather than
  // waiting for a change event, since the guard needs to already be up
  // before the picker's own back/popstate can fire.
  document.addEventListener('focus', function (e) {
    if (e.target && (e.target.id === 'import-file-input' || e.target.id === 'import-image-input')) {

    }
  }, true);

  // Chains autoTagChordLines + splitInlineChordLines — the same
  // normalization saveEditor() already runs on a manual save — so text
  // pulled from a PDF, Word doc, text file, or photo lands in the same
  // [Chord]-tagged, SPS-ready shape as anything typed or pasted by hand.
  function prepareLyricsForLayout(text) {
    var tagged = autoTagChordLines(text);
    return splitInlineChordLines(tagged.text).text;
  }

  // Why import used to fail: the published app runs in a sandbox that lets
  // a page load a <script> from cdnjs/jsdelivr but silently blocks every
  // download that script then makes on its own (fetch/XHR) and any
  // cross-origin worker. Tesseract (photo + scanned-PDF reading) needs to
  // download its engine and English data at runtime and run in a worker,
  // so it could never start; pdf.js's cross-origin worker was blocked the
  // same way. Everything import needs now ships as files published right
  // next to the app (vendor/…), loaded same-origin — no internet needed.
  // Word (.docx) is read by a small built-in unzipper instead of mammoth.
  function vendorUrl(name) {
    try { return new URL('vendor-' + name, document.baseURI).href; }
    catch (e) { return 'vendor-' + name; }
  }
  // Daniel's artwork (category tiles, splash video) published as files in
  // art/ next to the app.
  function artUrl(name) {
    try { return new URL('art-' + name, document.baseURI).href; }
    catch (e) { return 'art-' + name; }
  }
  var IMPORT_PDF_JS = vendorUrl('pdf.js');
  var IMPORT_PDF_WORKER = vendorUrl('pdf.worker.js');
  // Only used if the bundled copy can't be reached (e.g. the HTML opened
  // on its own, outside the published app).
  var IMPORT_PDF_JS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var IMPORT_PDF_WORKER_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var IMPORT_OCR_WORKER = vendorUrl('ocr-worker.js');
  var importGen = 0;
  var importOcrWorker = null;
  var importOcrJobs = {};
  var importOcrSeq = 0;
  var importPdfReady = null;

  function loadScriptOnce(src) {
    return new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-import-src="' + src + '"]');
      if (existing) {
        if (existing.getAttribute('data-loaded') === '1') resolve();
        else existing.addEventListener('load', function () { resolve(); });
        existing.addEventListener('error', function () { reject(new Error('Could not load ' + src)); });
        return;
      }
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.setAttribute('data-import-src', src);
      s.onload = function () { s.setAttribute('data-loaded', '1'); resolve(); };
      s.onerror = function () { reject(new Error('Could not load helper. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }

  function ensurePdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!importPdfReady) {
      importPdfReady = loadScriptOnce(IMPORT_PDF_JS).then(function () {
        if (!window.pdfjsLib) throw new Error('PDF reader did not start.');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = IMPORT_PDF_WORKER;
        return window.pdfjsLib;
      }).catch(function () {
        return loadScriptOnce(IMPORT_PDF_JS_CDN).then(function () {
          if (!window.pdfjsLib) throw new Error('PDF reader did not start.');
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = IMPORT_PDF_WORKER_CDN;
          return window.pdfjsLib;
        });
      }).catch(function (err) {
        importPdfReady = null;
        throw new Error('The PDF reader could not load. ' + ((err && err.message) || ''));
      });
    }
    return importPdfReady;
  }

  /* ---- OCR: one long-lived same-origin worker (vendor/ocr-worker.js) ---- */
  function getOcrWorker() {
    if (importOcrWorker) return importOcrWorker;
    var w = new Worker(IMPORT_OCR_WORKER);
    w.onmessage = function (e) {
      var msg = e.data || {};
      var job = importOcrJobs[msg.id];
      if (!job) return;
      if (msg.type === 'status') job.onStatus(msg.status);
      else if (msg.type === 'progress') job.onProgress(msg.progress);
      else if (msg.type === 'done') { delete importOcrJobs[msg.id]; job.resolve(msg.text || ''); }
      else if (msg.type === 'error') { delete importOcrJobs[msg.id]; job.reject(new Error(msg.message || 'The image reader stopped.')); }
    };
    w.onerror = function (e) {
      // A worker that fails to even load reports here, not via a message.
      var reason = (e && e.message) ? e.message : 'The image reader could not start.';
      Object.keys(importOcrJobs).forEach(function (id) { importOcrJobs[id].reject(new Error(reason)); });
      importOcrJobs = {};
      try { w.terminate(); } catch (err) {}
      if (importOcrWorker === w) importOcrWorker = null;
      if (e && e.preventDefault) e.preventDefault();
    };
    importOcrWorker = w;
    return w;
  }

  // Any photo (JPG, PNG, WebP, HEIC where the phone can decode it) is drawn
  // upright onto a canvas, scaled to a sensible reading size, turned grey,
  // and handed to the reader as a PNG. Normalizing here means format quirks
  // and 12-megapixel phone photos never reach the OCR engine.
  var OCR_MAX_SIDE = 2200;
  function loadImageElement(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('That photo could not be opened. Try a JPG or PNG.')); };
      img.src = src;
    });
  }
  function imageSourceToPngBytes(src) {
    var objectUrl = null;
    var url = src;
    if (typeof src !== 'string') { objectUrl = URL.createObjectURL(src); url = objectUrl; }
    return loadImageElement(url).then(function (img) {
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error('That photo came through empty.');
      var scale = Math.min(1, OCR_MAX_SIDE / Math.max(w, h));
      // Small screenshots read better slightly enlarged.
      if (Math.max(w, h) < 1000) scale = Math.min(2, 1000 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      try {
        var px = ctx.getImageData(0, 0, cw, ch);
        var d = px.data;
        for (var i = 0; i < d.length; i += 4) {
          var g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
          d[i] = d[i + 1] = d[i + 2] = g;
        }
        ctx.putImageData(px, 0, 0);
      } catch (e) { /* greyscale is optional */ }
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error('Could not prepare that photo.')); return; }
          blob.arrayBuffer().then(resolve, reject);
        }, 'image/png');
      });
    }).then(function (buf) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      return buf;
    }, function (err) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      throw err;
    });
  }

  /* ---- Word (.docx) reader: a .docx is a zip; the lyrics live in
     word/document.xml. Unzipped with the browser's own DecompressionStream,
     paragraphs/tabs/line breaks kept, no library needed. ---- */
  function readZipEntry(buf, wantedName) {
    var dv = new DataView(buf);
    var u8 = new Uint8Array(buf);
    var eocd = -1;
    for (var i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return Promise.reject(new Error('That Word file looks damaged. Re-save it as .docx or PDF.'));
    var count = dv.getUint16(eocd + 10, true);
    var p = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder('utf-8');
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var localOff = dv.getUint32(p + 42, true);
      var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      if (name === wantedName) {
        var lNameLen = dv.getUint16(localOff + 26, true);
        var lExtraLen = dv.getUint16(localOff + 28, true);
        var start = localOff + 30 + lNameLen + lExtraLen;
        var data = u8.subarray(start, start + csize);
        if (method === 0) return Promise.resolve(dec.decode(data));
        if (method !== 8) return Promise.reject(new Error('That Word file uses an unusual compression. Re-save it as .docx or PDF.'));
        if (typeof DecompressionStream === 'undefined') {
          return Promise.reject(new Error('This phone\u2019s browser can\u2019t open Word files. Save it as PDF and import that.'));
        }
        var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Response(stream).arrayBuffer().then(function (out) { return dec.decode(out); });
      }
      p += 46 + nameLen + extraLen + commentLen;
    }
    return Promise.reject(new Error('No document text found in that Word file.'));
  }
  function docxXmlToText(xml) {
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var body = doc.getElementsByTagNameNS('*', 'body')[0] || doc.documentElement;
    var lines = [];
    function walkRun(node, acc) {
      for (var c = node.firstChild; c; c = c.nextSibling) {
        if (c.nodeType !== 1) continue;
        var ln = c.localName;
        if (ln === 't') acc.push(c.textContent);
        else if (ln === 'tab') acc.push('    ');
        else if (ln === 'br' || ln === 'cr') acc.push('\n');
        else if (ln === 'p') { /* nested paragraph (text box) */ lines.push(paraText(c)); }
        else if (ln === 'delText' || ln === 'instrText') { /* deleted / field code — skip */ }
        else walkRun(c, acc);
      }
    }
    function paraText(p) {
      var acc = [];
      walkRun(p, acc);
      return acc.join('');
    }
    (function walk(node) {
      for (var c = node.firstChild; c; c = c.nextSibling) {
        if (c.nodeType !== 1) continue;
        if (c.localName === 'p') lines.push(paraText(c));
        else walk(c);
      }
    })(body);
    return lines.join('\n').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }

  // Plain-text .rtf → readable text (paragraphs, tabs, basic escapes).
  var RTF_SKIP_GROUPS = {
    fonttbl: 1, colortbl: 1, stylesheet: 1, info: 1, pict: 1, listtable: 1,
    listoverridetable: 1, rsidtbl: 1, generator: 1, xmlnstbl: 1, themedata: 1,
    colorschememapping: 1, latentstyles: 1, datastore: 1, header: 1, footer: 1,
    headerl: 1, headerr: 1, footerl: 1, footerr: 1, object: 1, field: 0
  };
  function rtfToText(rtf) {
    if (!/^\s*\{\\rtf/.test(rtf)) return rtf;
    var out = '';
    var stack = [];
    var skip = false;
    var i = 0;
    var n = rtf.length;
    while (i < n) {
      var ch = rtf.charAt(i);
      if (ch === '{') { stack.push(skip); i++; continue; }
      if (ch === '}') { skip = stack.length ? stack.pop() : false; i++; continue; }
      if (ch === '\\') {
        var nx = rtf.charAt(i + 1);
        if (nx === '\\' || nx === '{' || nx === '}') { if (!skip) out += nx; i += 2; continue; }
        if (nx === "'") { if (!skip) out += String.fromCharCode(parseInt(rtf.substr(i + 2, 2), 16) || 32); i += 4; continue; }
        if (nx === '*') { skip = true; i += 2; continue; }
        if (nx === '~') { if (!skip) out += ' '; i += 2; continue; }
        var m = /^\\([a-zA-Z]+)(-?\d+)? ?/.exec(rtf.slice(i, i + 48));
        if (m) {
          var word = m[1];
          i += m[0].length;
          if (RTF_SKIP_GROUPS[word]) { skip = true; continue; }
          if (skip) continue;
          if (word === 'par' || word === 'line' || word === 'sect' || word === 'row') out += '\n';
          else if (word === 'tab' || word === 'cell') out += '    ';
          else if (word === 'emdash') out += '—';
          else if (word === 'endash') out += '–';
          else if (word === 'lquote' || word === 'rquote') out += '’';
          else if (word === 'ldblquote' || word === 'rdblquote') out += '"';
          else if (word === 'u' && m[2]) {
            var code = parseInt(m[2], 10);
            if (code < 0) code += 65536;
            out += String.fromCharCode(code);
            var fb = rtf.charAt(i);
            if (fb && fb !== '\\' && fb !== '{' && fb !== '}') i++; // skip ANSI fallback char
          }
          continue;
        }
        i += 2;
        continue;
      }
      if (ch === '\r' || ch === '\n') { i++; continue; }
      if (!skip) out += ch;
      i++;
    }
    return out.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function setImportProgress(pct) {
    var bar = byId('import-review-progress');
    var fill = byId('import-review-progress-fill');
    if (!bar || !fill) return;
    if (pct == null) { bar.hidden = true; return; }
    bar.hidden = false;
    fill.style.width = Math.max(0, Math.min(100, pct)) + '%';

    var actions = byId('import-review-actions');

    if (actions) actions.hidden = true;
    if (busyCancel) busyCancel.hidden = false;

    setImportStatus('Reading your file…');
    if (modal) modal.hidden = false;
  }

    var ta = byId('import-review-text');
    var actions = byId('import-review-actions');
    var busyCancel = byId('import-review-busy-cancel');
    if (ta) {
      ta.hidden = false;
      ta.value = text || '';
    }

    if (busyCancel) busyCancel.hidden = true;

    if (modal) modal.hidden = true;

  function closeImportMenu() {

    if (menu) menu.hidden = true;
  }

    var menu = byId('import-menu');
    if (!menu) return;
    menu.hidden = !menu.hidden;
  }

  function isPdfFile(file) {
    return file && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''));
  }
  function isImageFile(file) {
    return file && (/^image\//.test(file.type || '') || /\.(png|jpe?g|gif|webp|heic|heif|bmp)$/i.test(file.name || ''));
  }
  function isDocxFile(file) {
    return file && (
      file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
      /\.docx$/i.test(file.name || '')
    );
  }
  function isOldDocFile(file) {
    return file && (file.type === 'application/msword' || /\.doc$/i.test(file.name || '')) && !isDocxFile(file);
  }
  function isTextFile(file) {
    return file && (/^text\//.test(file.type || '') || /\.(txt|rtf|md|chordpro|cho|crd)$/i.test(file.name || ''));
  }

  function extractDocxText(file) {
    setImportStatus('Opening Word document…');
    setImportProgress(30);
    return file.arrayBuffer().then(function (buf) {
      return readZipEntry(buf, 'word/document.xml');
    }).then(function (xml) {
      setImportProgress(80);
      return docxXmlToText(xml);
    });
  }

  function extractPlainText(file) {
    setImportStatus('Reading text…');
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(rtfToText(String(reader.result || ''))); };
      reader.onerror = function () { reject(new Error('Could not read that file.')); };
      reader.readAsText(file);
    });
  }

  function pdfItemsToText(items) {
    var lines = [];
    var line = '';
    var lastY = null;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var str = item.str || '';
      var y = item.transform ? item.transform[5] : 0;
      if (lastY != null && Math.abs(y - lastY) > 3.5) {
        lines.push(line.replace(/[ \t]+$/g, ''));
        line = '';
      }
      line += str;
      if (item.hasEOL) {
        lines.push(line.replace(/[ \t]+$/g, ''));
        line = '';
        lastY = null;
      } else {
        lastY = y;
      }
    }
    if (line) lines.push(line.replace(/[ \t]+$/g, ''));
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function extractPdfText(file, gen) {
    return file.arrayBuffer().then(function (buf) {
      return ensurePdfJs().then(function (pdfjsLib) {
        return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      });
    }).then(function (pdf) {
      var maxPages = Math.min(pdf.numPages, 12);
      var pageTexts = [];
      var i = 1;
      function nextPage() {
        if (gen !== importGen) return Promise.reject(new Error('cancelled'));
        if (i > maxPages) {
          return Promise.resolve({ pdf: pdf, text: pageTexts.join('\n\n').trim(), pages: maxPages });
        }
        setImportStatus('Reading PDF page ' + i + ' of ' + maxPages + '…');
        setImportProgress(10 + (i / maxPages) * 40);
        var pageNo = i++;
        return pdf.getPage(pageNo).then(function (page) {
          return page.getTextContent().then(function (tc) {
            pageTexts.push(pdfItemsToText(tc.items || []));
            return nextPage();
          });
        });
      }
      return nextPage();
    });
  }

  function renderPdfPageToDataUrl(page, scale) {
    var viewport = page.getViewport({ scale: scale || 1.6 });
    var canvas = document.createElement('canvas');
    canvas.width = Math.min(1600, viewport.width);
    canvas.height = Math.min(2200, viewport.height);
    var ctx = canvas.getContext('2d');
    var drawVp = page.getViewport({ scale: canvas.width / page.getViewport({ scale: 1 }).width });
    canvas.height = drawVp.height;
    return page.render({ canvasContext: ctx, viewport: drawVp }).promise.then(function () {
      return canvas.toDataURL('image/png');
    });
  }

  // OCR reads a lone chord letter loosely — "c" or "Cc" for C, "em" for
  // Em — and one bad token stops autoTagChordLines from treating the whole
  // line as chords. Repair only lines where EVERY token becomes a valid
  // chord after the fix-up, so ordinary lyric lines are never touched.
  function fixOcrChordToken(t) {
    var s = String(t).replace(/^[|(\[]+|[|.,:;)\]]+$/g, '');
    if (/^([A-Ga-g])\1$/i.test(s)) return s.charAt(0).toUpperCase();
    if (/^[a-g](?:#|b)?(?:maj|min|sus|add|dim|aug|m|M)?\d{0,2}(?:\/[A-Ga-g](?:#|b)?)?$/.test(s)) {
      s = s.charAt(0).toUpperCase() + s.slice(1);
      s = s.replace(/\/([a-g])/, function (m, c) { return '/' + c.toUpperCase(); });
    }
    return s;
  }
  function normalizeOcrChordLines(text) {
    return String(text || '').split('\n').map(function (line) {
      var tokens = line.trim().split(/\s+/).filter(Boolean);
      if (!tokens.length || tokens.length > 12) return line;
      var fixed = tokens.map(fixOcrChordToken);
      if (!fixed.every(function (t) { return CHORD_TOKEN_RE.test(t); })) return line;
      // A single token only counts if OCR already read it as a real chord
      // (so a lone lyric word like "a" never becomes the chord "A").
      var validBefore = tokens.filter(function (t) { return CHORD_TOKEN_RE.test(t); }).length;
      if (tokens.length === 1 && validBefore === 0) return line;
      var k = 0;
      return line.replace(/\S+/g, function (tok) {
        var f = fixed[k++];
        return tok.length > f.length ? f + new Array(tok.length - f.length + 1).join(' ') : f;
      });
    }).join('\n');
  }

  // src: a File/Blob (photo) or a data: URL (a rendered PDF page).
  // progressBase/progressSpan place this job's progress on the overall bar.
  function ocrSource(src, gen, progressBase, progressSpan) {
    var base = progressBase == null ? 30 : progressBase;
    var span = progressSpan == null ? 65 : progressSpan;
    setImportStatus('Preparing the photo…');
    return imageSourceToPngBytes(src).then(function (bytes) {
      if (gen !== importGen) throw new Error('cancelled');
      var worker;
      try { worker = getOcrWorker(); }
      catch (e) { throw new Error('The image reader could not start. ' + ((e && e.message) || '')); }
      return new Promise(function (resolve, reject) {
        var id = 'ocr' + (++importOcrSeq);
        importOcrJobs[id] = {
          resolve: resolve,
          reject: reject,
          onStatus: function (s) { if (gen === importGen) setImportStatus(s); },
          onProgress: function (p) {
            if (gen !== importGen) return;
            setImportProgress(base + p * span);
            setImportStatus('Reading the page… ' + Math.round(p * 100) + '%');
          }
        };
        worker.postMessage({ id: id, bytes: bytes }, [bytes]);
      });
    }).then(normalizeOcrChordLines);
  }

  function ocrPdfPages(pdf, pageCount, gen) {
    var n = Math.min(pageCount, 6);
    var out = [];
    var i = 1;
    function next() {
      if (gen !== importGen) return Promise.reject(new Error('cancelled'));
      if (i > n) return Promise.resolve(out.join('\n\n').trim());
      var pageNo = i++;
      setImportStatus('Scanning page ' + pageNo + ' of ' + n + '…');
      setImportProgress(50 + ((pageNo - 1) / n) * 45);
      return pdf.getPage(pageNo).then(function (page) {
        return renderPdfPageToDataUrl(page, 1.6);
      }).then(function (url) {
        return ocrSource(url, gen, 50 + ((pageNo - 1) / n) * 45, 45 / n);
      }).then(function (text) {
        out.push(text);
        return next();
      });
    }
    return next();
  }

  function recycleFileInput(el) {
    if (!el || !el.parentNode) return;
    var neu = el.cloneNode(true);
    neu.value = '';
    el.parentNode.replaceChild(neu, el);
  }

  function ensureDraftForImport() {
    if (editorDraft) return;
    openEditorDraft(null);
    goEditor(null);
  }

  function pickImportFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []).filter(Boolean);
    if (!files.length) return;
    armFilePickerGuard();
    ensureDraftForImport();
    var first = files.shift();
    importQueue = importQueue.concat(files);
    runImport(first);
  }

  function runImport(file) {
    if (!file) return;
    armFilePickerGuard();
    var gen = ++importGen;
    closeImportMenu();
    openImportReviewBusy();

    var work;
    if (isPdfFile(file)) {
      setImportStatus('Opening PDF…');
      work = extractPdfText(file, gen).then(function (result) {
        if (gen !== importGen) return;
        var text = result.text || '';
        if (text.replace(/\s+/g, '').length >= 8) return text;
        setImportStatus('No selectable text — scanning the pages…');
        return ocrPdfPages(result.pdf, result.pages, gen);
      });
    } else if (isDocxFile(file)) {
      work = extractDocxText(file);
    } else if (isOldDocFile(file)) {
      work = Promise.reject(new Error('That .doc is too old. Save it as .docx or PDF and import that.'));
    } else if (isTextFile(file)) {
      work = extractPlainText(file);
    } else if (isImageFile(file)) {
      setImportStatus('Reading the photo…');
      setImportProgress(20);
      work = ocrSource(file, gen);
    } else {
      work = Promise.reject(new Error('Use a PDF, Word (.docx), text file, or a photo.'));
    }

    work.then(function (text) {
      if (gen !== importGen) return;
      var cleaned = String(text || '').replace(/\u0000/g, '').trim();
      if (!cleaned) {
        showImportReviewText('', 'Nothing readable came through. Try a clearer photo, or paste the lyrics instead.');
        return;
      }
      showImportReviewText(cleaned, 'Check line breaks and chords, then tap Use this text.');
    }).catch(function (err) {
      if (gen !== importGen) return;
      if (err && err.message === 'cancelled') return;
      showImportReviewText('', (err && err.message) ? err.message : 'Could not read that file.');
    });
  }

  function applyImportedText() {
    if (!editorDraft) {
      closeImportReview();
      return;
    }
    var ta = byId('import-review-text');
    var text = ta ? ta.value : '';
    var prepared = prepareLyricsForLayout(text);
    if (!String(prepared || '').trim()) {
      toast('No lyrics in that file. Paste them in, or try a PDF / .docx.');
      return;
    }
    var lyricsForSong = prepared;
    if (!String(editorDraft.title || '').trim()) {
      var lines = String(prepared).split(/\r?\n/);
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        if (isChordOnlyLine(line)) continue;
        editorDraft.title = line.replace(/^\[|\]$/g, '').slice(0, 80);
        // The title line doubling as the first line of the lyrics body
        // just repeats the song name right back at the top of the lyrics
        // — drop that one line from what actually gets saved as lyrics.
        lines.splice(i, 1);
        lyricsForSong = lines.join('\n').replace(/^\n+/, '');
        break;
      }
    }
    editorDraft.lyrics = lyricsForSong;
    if (!String(editorDraft.title || '').trim()) editorDraft.title = 'Imported song';
    closeImportReview();
    saveEditor(true);
  }

  function wireImportDrop() {
    var drop = byId('import-drop');
    if (!drop || drop.getAttribute('data-wired') === '1') return;
    drop.setAttribute('data-wired', '1');
    drop.addEventListener('dragover', function (e) {
      e.preventDefault();
      drop.classList.add('is-over');
    });
    drop.addEventListener('dragleave', function () { drop.classList.remove('is-over'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      drop.classList.remove('is-over');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) runImport(f);

        for (var k = 0; k < cdi.items.length; k++) {
          if (cdi.items[k].kind === 'file') { pic = cdi.items[k].getAsFile(); if (pic) break; }
        }
      }
      if (pic && isImageFile(pic)) { e.preventDefault(); takeCategoryImage(pic); }

    var cd = e.clipboardData;

    var files = [];

      for (var i = 0; i < cd.items.length; i++) {

          if (f) files.push(f);
