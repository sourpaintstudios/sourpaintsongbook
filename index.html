  /* ---- Vertical fader (right-hand rail, big thumb-friendly drag target) ---- */
  function setupFader(initialPct) {
    var track = byId('fader-track');
    var fill = byId('fader-fill');
    var thumb = byId('fader-thumb');
    if (!track) return;

    var bpmInput = byId('bpm-input');
    function paint(pct) {
      pct = Math.max(0, Math.min(100, pct));
      fill.style.height = pct + '%';
      thumb.style.bottom = pct + '%';
      track.setAttribute('aria-valuenow', String(Math.round(pct)));
      // Don't stomp on the number while the person is mid-keystroke typing
      // a new BPM into it — applyBpmInput() (wired in setupBpmInput) is
      // what commits that edit and calls back into this same paint path.
      if (bpmInput && document.activeElement !== bpmInput) {
        bpmInput.value = String(Math.round(speedToBpm(faderPctToSpeed(pct))));
      }
    }
    paint(initialPct);

    function pctFromClientY(clientY) {
      var rect = track.getBoundingClientRect();
      var rel = (rect.bottom - clientY) / rect.height; // bottom = 0%, top = 100%
      return Math.max(0, Math.min(100, rel * 100));
    }

    function setFromClientY(clientY) {
      var pct = pctFromClientY(clientY);
      paint(pct);
      playerAnimState.speed = faderPctToSpeed(pct);
      state.settings.lastSpeed = playerAnimState.speed;
      persist();
    }

    var dragging = false;
    track.addEventListener('pointerdown', function (e) {
      dragging = true;
      track.setPointerCapture(e.pointerId);
      setFromClientY(e.clientY);
    });
    track.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setFromClientY(e.clientY);
    });
    track.addEventListener('pointerup', function () { dragging = false; });
    track.addEventListener('pointercancel', function () { dragging = false; });

    track.addEventListener('keydown', function (e) {
      var cur = Number(track.getAttribute('aria-valuenow')) || 0;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { cur = Math.min(100, cur + 4); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { cur = Math.max(0, cur - 4); }
      else return;
      e.preventDefault();
      paint(cur);
      playerAnimState.speed = faderPctToSpeed(cur);
      state.settings.lastSpeed = playerAnimState.speed;
      persist();
    });
  }

  function syncFaderVisual() {
    var track = byId('fader-track');
    if (!track) return;
    var pct = speedToFaderPct(playerAnimState.speed);
    var fill = byId('fader-fill');
    var thumb = byId('fader-thumb');
    var bpmInput = byId('bpm-input');
    if (fill) fill.style.height = pct + '%';
    if (thumb) thumb.style.bottom = pct + '%';
    if (bpmInput && document.activeElement !== bpmInput) {
      bpmInput.value = String(Math.round(speedToBpm(playerAnimState.speed)));
    }
    track.setAttribute('aria-valuenow', String(Math.round(pct)));
  }

  // Type a BPM straight into the box above the fader — commits on Enter or
  // on leaving the field, same as any other form field, and snaps the fader
  // to that position. An empty or garbage entry just redraws whatever the
  // fader is already at, rather than erroring or zeroing the speed out.
  function setupBpmInput() {
    var input = byId('bpm-input');
    if (!input) return;
    function applyBpmInput() {
      var raw = input.value.trim();
      if (!raw) { syncFaderVisual(); return; }
      var bpm = Math.round(Number(raw));
      if (!isFinite(bpm) || bpm <= 0) { syncFaderVisual(); return; }
      bpm = Math.max(20, Math.min(300, bpm));
      playerAnimState.speed = bpmToSpeed(bpm);
      state.settings.lastSpeed = playerAnimState.speed;
      persist();
      syncFaderVisual();
    }
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      applyBpmInput();
      input.blur();
    });
    input.addEventListener('blur', applyBpmInput);
    // Tapping in selects the current number so typing a new one replaces it
    // outright, instead of the person having to manually clear it first.
    input.addEventListener('focus', function () { input.select(); });
  }

  /* A song given a color (the palette button on its card) wears that
     palette in the player too, after the Grok build: the header, fader and
     controls take its colors, and the lyrics use its dark/light pair —
     until a reading color is picked in the player, which then wins for
     the rest of that visit. Tap/hold keep their own state colors. */
  var readingOverride = false;
  function songSkinPalette() {
    if (view.name !== 'player') return null;
    var s = findSong(view.songId);
    return s && s.colorId ? getArtPalette(s.colorId) : null;
  }
  function applySongSkin() {
    var screen = document.querySelector('.screen-player');
    if (!screen) return;
    var keys = ['--bg', '--bg-elevated', '--text', '--text-dim', '--green', '--green-bright', '--line', '--on-accent'];
    var p = songSkinPalette();
    if (!p) {
      keys.forEach(function (k) { screen.style.removeProperty(k); });
      screen.classList.remove('has-song-skin');
      return;
    }
    var n = parseInt(p.accent.replace('#', ''), 16);
    var lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    screen.classList.add('has-song-skin');
    screen.style.setProperty('--bg', p.dark);
    screen.style.setProperty('--bg-elevated', p.dark);
    screen.style.setProperty('--text', p.light);
    screen.style.setProperty('--text-dim', hexToRgba(p.light, 0.66));
    screen.style.setProperty('--green', p.accent);
    screen.style.setProperty('--green-bright', p.accent);
    screen.style.setProperty('--line', hexToRgba(p.accent, 0.35));
    screen.style.setProperty('--on-accent', lum > 0.55 ? '#12120f' : '#ffffff');
  }
  function applyReadingMode() {
    var viewport = byId('lyrics-viewport');
    if (!viewport) return;
    var mode = getReadingMode(state.settings.readingMode);
    var skin = songSkinPalette();
    if (skin && !readingOverride) mode = { bg: skin.dark, fg: skin.light, accent: skin.accent };
    viewport.style.background = mode.bg;
    viewport.style.color = mode.fg;
    var chordEls = viewport.querySelectorAll('.chord');
    for (var i = 0; i < chordEls.length; i++) chordEls[i].style.color = mode.accent;
  }

  // Text size for the lyrics reading pane — a persisted setting, adjustable
  // with A-/A+ and by pinching the lyrics.
  var LYRICS_FONT_MIN = 14;
  var LYRICS_FONT_MAX = 48;
  var PINCH_FONT_MIN = 12;
  var PINCH_FONT_MAX = 80;

  /* Three lyric-size presets, after Daniel's Grok build: Compact and Fit
     both measure the widest lyric/chord line and size the text so that
     line just fits the screen — nothing wraps — Compact scaled down
     further to pack noticeably more of the song in per screen; Large is
     the plain reading size (the original manual A-/A+ behavior, wraps
     normally). While Compact or Fit is active the player also strips
     down to Back / A- / size / presets / A+ (the "is-stage" class), so
     the lyrics get the room; Large keeps the full toolbar. A-/A+ (and
     pinching) nudge whichever preset is active without switching presets
     — each preset remembers its own nudge. Recomputed on resize/rotation
     and when a song opens. */
  var SIZE_MODES = ['compact', 'fit', 'large'];
  var FIT_REF_SIZE = 20;
  var FIT_PRESETS = {
    compact: { scale: 0.68, min: 10, max: 50 },
    fit: { scale: 1, min: 14, max: 72 }
  };
  function widestLyricLineAt(body, size) {
    body.style.fontSize = size + 'px';
    body.classList.add('is-measuring');
    var nodes = body.querySelectorAll('.lyric-line, .lyric-cue-row');
    var widest = 0;
    for (var i = 0; i < nodes.length; i++) {
      var w = nodes[i].getBoundingClientRect().width;
      if (w > widest) widest = w;
    }
    body.classList.remove('is-measuring');
    return widest;
  }
  function fitTextSizeForLines(scale, clampMin, clampMax) {
    var body = byId('lyrics-body');
    var viewport = byId('lyrics-viewport');
    if (!body || !viewport) return null;
    var cs = window.getComputedStyle(body);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var boxW = Math.min(viewport.clientWidth, parseFloat(cs.maxWidth) || viewport.clientWidth);
    var available = boxW - padX - 4;
    if (available < 60) return null;
    var widest = widestLyricLineAt(body, FIT_REF_SIZE);
    if (!widest) return clampMax;
    var size = Math.floor(FIT_REF_SIZE * available / widest * (scale || 1));
    return Math.max(clampMin, Math.min(clampMax, size));
  }
  // Keep the reader at the same place in the song when the text resizes.
  function withScrollKept(fn) {
    var viewport = byId('lyrics-viewport');
    var ratio = 0;
    if (viewport && viewport.scrollHeight > viewport.clientHeight) {
      ratio = viewport.scrollTop / (viewport.scrollHeight - viewport.clientHeight);
    }
    fn();
    if (viewport && ratio) {
      viewport.scrollTop = ratio * Math.max(0, viewport.scrollHeight - viewport.clientHeight);
    }
  }
  function sizeMode() { return state.settings.sizeMode || 'fit'; }
  var fitBaseSize = null;
  function currentLyricsSize() {
    var mode = sizeMode();
    if (mode === 'large') return state.settings.lyricsFontSize || 21;
    var preset = FIT_PRESETS[mode] || FIT_PRESETS.fit;
    var base = fitBaseSize || preset.min;
    var nudge = (state.settings.sizeNudges && state.settings.sizeNudges[mode]) || 0;
    return Math.max(PINCH_FONT_MIN, Math.min(PINCH_FONT_MAX, base + nudge));
  }
  function applyFontSize() {
    var body = byId('lyrics-body');
    if (!body) return;
    var mode = sizeMode();
    withScrollKept(function () {
      if (mode !== 'large') {
        var preset = FIT_PRESETS[mode] || FIT_PRESETS.fit;
        fitBaseSize = fitTextSizeForLines(preset.scale, preset.min, preset.max) || fitBaseSize || preset.min;
      }
      body.style.fontSize = currentLyricsSize() + 'px';
    });
    paintFontSizeReadout();
  }
  function setLyricsSize(size) {
    size = Math.round(size);
    var mode = sizeMode();
    if (mode === 'large') {
      state.settings.lyricsFontSize = Math.max(PINCH_FONT_MIN, Math.min(PINCH_FONT_MAX, size));
    } else {
      var preset = FIT_PRESETS[mode] || FIT_PRESETS.fit;
      var base = fitBaseSize || preset.min;
      size = Math.max(PINCH_FONT_MIN, Math.min(PINCH_FONT_MAX, size));
      if (!state.settings.sizeNudges) state.settings.sizeNudges = {};
      state.settings.sizeNudges[mode] = size - base;
    }
    var body = byId('lyrics-body');
    if (body) withScrollKept(function () { body.style.fontSize = currentLyricsSize() + 'px'; });
    paintFontSizeReadout();
  }
  function adjustFontSize(delta) {
    var next = currentLyricsSize() + delta;
    if (sizeMode() === 'large') next = Math.max(LYRICS_FONT_MIN, Math.min(LYRICS_FONT_MAX, next));
    setLyricsSize(next);
    persist();
  }
  function setSizeMode(mode) {
    if (SIZE_MODES.indexOf(mode) === -1 || mode === sizeMode()) return;
    state.settings.sizeMode = mode;
    persist();
    applyFontSize();
    paintSizeModeButtons();
  }
  function paintSizeModeButtons() {
    var mode = sizeMode();
    var btns = document.querySelectorAll('.size-mode-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('size-mode-btn-active', btns[i].getAttribute('data-mode') === mode);
    }
    var screen = document.querySelector('.screen-player');
    if (screen) {
      screen.classList.toggle('is-stage', mode !== 'large');
      screen.classList.toggle('is-size-compact', mode === 'compact');
    }
  }
  function paintFontSizeReadout() {
    var el = byId('font-size-readout');
    if (el) el.textContent = String(currentLyricsSize());
  }
  var fitResizeTimer = null;
  window.addEventListener('resize', function () {
    if (sizeMode() === 'large' || !byId('lyrics-body')) return;
    clearTimeout(fitResizeTimer);
    fitResizeTimer = setTimeout(applyFontSize, 120);
  });

  /* Pinch to zoom (from the Grok build): two fingers on the lyrics resize
     the text live. Works in fit mode too (as a nudge on the fitted size).
     The browser's own page zoom is suppressed only on the lyrics. */
  var lyricPinch = null;
  function touchGap(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy) || 1;
  }
  document.addEventListener('touchstart', function (e) {
    var viewport = byId('lyrics-viewport');
    if (!viewport || !e.touches || e.touches.length !== 2 || !viewport.contains(e.target)) return;
    lyricPinch = { gap: touchGap(e.touches), size: currentLyricsSize() };
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!lyricPinch || !e.touches || e.touches.length !== 2) return;
    e.preventDefault();
    setLyricsSize(lyricPinch.size * (touchGap(e.touches) / lyricPinch.gap));
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (lyricPinch && (!e.touches || e.touches.length < 2)) { lyricPinch = null; persist(); }
  }, { passive: true });
  document.addEventListener('touchcancel', function () { if (lyricPinch) { lyricPinch = null; persist(); } }, { passive: true });

  // Re-renders just the lyrics body in place (layout mode changes the
  // markup structure itself, not just a style), then reapplies the
  // reading-color and font-size settings on top of the fresh markup.
  function refreshLyricsBody() {
    var s = findSong(view.songId);
    var bodyEl = byId('lyrics-body');
    if (!s || !bodyEl) return;
    bodyEl.innerHTML = renderLyricsBody(s.lyrics);
    applyReadingMode();
    applyFontSize();
  }
  function paintChordLayoutButton() {
    var left = state.settings.chordLayout === 'left';
    var label = left ? 'Switch to standard chord layout' : 'Switch to Sour Paint Studios left-chord layout';
    var btn = byId('chord-layout-btn');
    if (btn) {
      btn.textContent = left ? 'SPS Layout' : 'Standard';
      btn.setAttribute('title', label);
      btn.setAttribute('aria-label', label);
    }
    var topBtn = byId('chord-layout-btn-top');
    if (topBtn) {
      topBtn.textContent = left ? 'SPS' : 'STD';
      topBtn.setAttribute('title', label);
      topBtn.setAttribute('aria-label', label);
      topBtn.classList.toggle('btn-layout-top-active', left);
    }
  }

  // Quick one-tap invert for the reading pane only — separate from the
  // 5-swatch picker, for a plain "flip it light or dark" control.
  function isLightReadingMode(mode) {
    var hex = mode.bg.replace('#', '');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5;
  }
  function toggleReadingInvert() {
    readingOverride = true;
    var goLight = !isLightReadingMode(getReadingMode(state.settings.readingMode));
    state.settings.readingMode = goLight ? 'stage-light' : 'stage-dark';
    persist();
    applyReadingMode();
    paintInvertButton();
  }
  function paintInvertButton() {
    var btn = byId('invert-btn');
    if (!btn) return;
    var light = isLightReadingMode(getReadingMode(state.settings.readingMode));
    btn.innerHTML = light ? moonSvg() : sunSvg();
    var label = light ? 'Switch to dark reading' : 'Switch to light reading';
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
  }

  function speedToFaderPct(speed) {
    var r = Math.max(0.5, Math.min(80, speed));
    var pct = Math.pow((r - 0.5) / 79.5, 0.625);
    return Math.max(0, Math.min(100, pct * 100));
  }
  function faderPctToSpeed(pct) {
    var r = pct / 100;
    return 0.5 + Math.pow(r, 1.6) * 79.5;
  }

  // BPM <-> speed: the exact same relationship handleTap() already uses to
  // turn tapped intervals into a scroll speed (newSpeed = 16 / secondsPerBeat,
  // i.e. speed = 16 * bpm / 60), so typing a number into the BPM box lands on
  // the same fader position tapping that tempo would. Clamped to the same
  // 0.5-80 speed range the rest of the player already enforces.
  function bpmToSpeed(bpm) {
    var speed = (16 * bpm) / 60;
    return Math.max(0.5, Math.min(80, speed));
  }
  function speedToBpm(speed) {
    return (speed * 60) / 16;
  }

  function renderLyricsBody(lyrics) {
    var text = String(lyrics || '').trim();
    if (!text) {
      return '<p class="lyrics-empty">No lyrics saved for this song yet. Tap the pencil above to add them.</p>';
    }
    var leftLayout = state.settings.chordLayout === 'left';
    var blocks = text.split(/\n\s*\n/);
    return blocks.map(function (block) {
      var rawLines = block.split(/\r?\n/);
      var html = '';
      for (var i = 0; i < rawLines.length; i++) {
        var line = rawLines[i];
        var next = rawLines[i + 1];
        // Sour Paint Studios layout: a line that's nothing but chord tag(s)
        // — a cue, not something to sing — sits to the left of the lyric
        // line it leads into, instead of stacked above it. Only kicks in
        // when there's an actual lyric line right after it to pair with;
        // anything else (a lone chord line at a block's end, back-to-back
        // chord lines, etc.) falls back to the normal stacked rendering,
        // so nothing is ever dropped or misread.
        if (leftLayout && isChordOnlyLine(line) && next != null && next.trim() !== '' && !isChordOnlyLine(next)) {
          html += '<div class="lyric-cue-row">' +
            '<span class="lyric-cue-chord">' + formatChordLine(line) + '</span>' +
            '<span class="lyric-cue-line">' + formatChordLine(next) + '</span>' +
          '</div>';
          i++; // consumed the paired lyric line too
        } else {
          html += '<span class="lyric-line">' + formatChordLine(line) + '</span>';
        }
      }
      return '<div class="lyric-section">' + html + '</div>';
    }).join('');
  }

  // A "chord-only" line: strip every [Chord] tag out of it and nothing but
  // whitespace is left, and there was at least one tag to strip (an empty
  // blank line is not a chord line).
  function isChordOnlyLine(line) {
    var str = String(line || '');
    if (!/\[([^\[\]]{1,80})\]/.test(str)) return false;
    return str.replace(/\[([^\[\]]{1,80})\]/g, '').trim() === '';
  }

  function formatChordLine(line) {
    var escaped = escapeHtml(line);
    // Wrap bracketed chords like [G] or [C9] in a styled tag for legibility.
    return escaped.replace(/\[([^\[\]]{1,80})\]/g, '<span class="chord">$1</span>');
  }

  // Pasted chord sheets (from tab sites, PDFs, etc.) almost never carry this
  // app's own [G]-bracket syntax — they just print the chord names on their
  // own line, plain. On save, any line made up ENTIRELY of chord-shaped
  // tokens (and nothing else — no lyric words) gets each token wrapped in
  // brackets automatically, so it's recognized as a chord line by both the
  // green chord styling and the Sour Paint Studios left-of-line layout.
  // Deliberately narrow: every single token on the line must look like a
  // chord (root note A-G, optional # or b, optional quality/number, optional
  // /bass-note) or the line is left completely untouched — no guessing at
  // mixed lines, and a line that already has [brackets] in it is skipped so
  // this never double-tags anything. Chords get typed with all sorts of
  // separators between them depending on where the person pasted from or
  // how they typed it by hand — a space ("G F# B C9"), a backslash
  // ("C\B\B"), a comma, or a pipe. All of those split apart here; only
  // whitespace-only splitting risks a false positive on real lyrics (a
  // comma/backslash/pipe essentially never appears inside a plain lyric
  // line, so splitting on them is safe even before the per-token chord
  // check below runs).
  // (CHORD_TOKEN_RE / CHORD_LINE_SPLIT_RE are declared up near STORE_KEY,
  // not here — migrateChordFormatting() below runs at load time, before
  // this point in the file has executed, so these constants must already
  // be assigned by then. A `var` declared here would still be hoisted, but
  // its assignment would not have run yet and it would read as undefined.)
  // A token with no separator between two or more glued-together chords
  // ("GDEm" -> ["G","D","Em"], "CAmFG" -> ["C","Am","F","G"]), after
  // Daniel's Grok build. Only splits when the WHOLE token decomposes this
  // way with no gap and no leftover — greedily matching chord-shaped
  // substrings left to right — so a single real chord (already caught by
  // CHORD_TOKEN_RE) or a token that doesn't cleanly decompose is returned
  // unchanged as a one-item array, never wrongly slicing apart a real word.
  function splitGluedChords(token) {
    if (CHORD_TOKEN_RE.test(token)) return [token];
    var re = /[A-G](?:#|b)?(?:maj|min|dim|aug|sus|add|m|M)?(?:\d{1,2})?(?:sus\d?|add\d+|maj\d+|min\d+|m\d+|dim\d+)?(?:(?:#|b)\d{1,2})?(?:\/[A-G](?:#|b)?)?/gi;
    var hits = [];
    var m;
    var last = 0;
    while ((m = re.exec(token))) {
      if (m.index !== last) return [token];
      hits.push(m[0]);
      last = m.index + m[0].length;
    }
    if (hits.length > 1 && last === token.length) return hits;
    return [token];
  }

  function autoTagChordLines(text) {
    var lines = String(text || '').split(/\r?\n/);
    var taggedCount = 0;
    var out = lines.map(function (line) {
      if (line.indexOf('[') !== -1 || line.indexOf(']') !== -1) return line;
      var trimmed = line.trim();
      if (!trimmed) return line;
      var rawTokens = trimmed.split(CHORD_LINE_SPLIT_RE).filter(function (t) { return t !== ''; });
      if (rawTokens.length === 0 || rawTokens.length > 12) return line;
      var tokens = [];
      for (var i = 0; i < rawTokens.length; i++) {
        var glued = splitGluedChords(rawTokens[i]);
        for (var g = 0; g < glued.length; g++) tokens.push(glued[g]);
      }
      if (tokens.length > 12) return line;
      var allChords = tokens.every(function (t) { return CHORD_TOKEN_RE.test(t); });
      if (!allChords) return line;
      taggedCount++;
      var leadingWs = line.match(/^\s*/)[0];
      return leadingWs + tokens.map(function (t) { return '[' + t + ']'; }).join(' ');
    });
    return { text: out.join('\n'), taggedCount: taggedCount };
  }

  // A line with the chord written plain, no brackets, ahead of the lyric
  // text on the same line ("G       Momma was a banjo"), after Daniel's
  // Grok build — recognized by scanning tokens from the front for as long
  // as they look like chords, then treating everything after as the lyric.
  // Only fires when there's at least one leading chord token AND lyric text
  // left over (an all-chords line is autoTagChordLines's job, not this).
  // A single bare "A" ahead of text reads as the article far more often
  // than as a chord ("A time to remember"), so that one case is excluded;
  // two-or-more leading chord tokens, or a single token with a quality or
  // number ("Am", "G7"), are a strong enough signal to treat as a chord.
  function looksLikeChordToken(token) {
    if (CHORD_TOKEN_RE.test(token)) return true;
    return splitGluedChords(token).length > 1;
  }

  function splitLeadingPlainChords(line) {
    if (line.indexOf('[') !== -1) return null;
    var tokens = line.trim().split(/\s+/);
    if (tokens.length < 2) return null;
    var n = 0;
    while (n < tokens.length && looksLikeChordToken(tokens[n])) n++;
    if (n === 0 || n === tokens.length) return null;
    if (n === 1 && /^a$/i.test(tokens[0])) return null;
    var lyric = tokens.slice(n).join(' ');
    if (!lyric) return null;
    var chords = [];
    for (var i = 0; i < n; i++) {
      var glued = splitGluedChords(tokens[i]);
      for (var g = 0; g < glued.length; g++) chords.push(glued[g]);
    }
    return { chords: chords, lyric: lyric };
  }

  // Most pasted lyric sheets put the chord and its lyric on the SAME line
  // ("[G] I can't begin to sleep"), which reads fine in the standard layout
  // but is invisible to the Sour Paint Studios left-of-line layout — that
  // layout only moves a line that's chord tag(s) and NOTHING else (see
  // isChordOnlyLine above). On save, any line that has both a chord tag AND
  // leftover lyric text gets split into two lines: the chord tag(s) alone,
  // then the lyric text alone right after — so SPS/STD works no matter how
  // the chords were pasted in, without the person retyping anything.
  // Deliberately scoped to lines that already carry a [bracketed] tag (typed
  // by hand, pasted from somewhere that already uses this app's syntax, or
  // just produced by autoTagChordLines above) — a bare, unbracketed line
  // ("G I can't begin to sleep") is never touched, because "G", "Am", "A",
  // "Do" etc. are also real English words and guessing there risks mangling
  // actual lyrics.
  // (CHORD_TAG_SPLIT_RE is declared up near STORE_KEY — see the note above
  // autoTagChordLines for why.)
  function splitInlineChordLines(text) {
    var lines = String(text || '').split(/\r?\n/);
    var out = [];
    var splitCount = 0;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      CHORD_TAG_SPLIT_RE.lastIndex = 0;
      var tags = line.match(CHORD_TAG_SPLIT_RE);
      if (!tags) {
        // No [bracket] tag at all — try a bracket-less leading chord line
        // ("G       Momma was a banjo"), after Daniel's Grok build. Scoped
        // to lines autoTagChordLines already passed over (mixed chord and
        // lyric content, not an all-chords line).
        var plain = splitLeadingPlainChords(line);
        if (plain) {
          var leadingWsPlain = line.match(/^\s*/)[0];
          out.push(leadingWsPlain + plain.chords.map(function (t) { return '[' + t + ']'; }).join(' '));
          out.push(plain.lyric);
          splitCount++;
        } else {
          out.push(line);
        }
        continue;
      }
      var remainder = line.replace(CHORD_TAG_SPLIT_RE, ' ').replace(/\s+/g, ' ').trim();
      if (!remainder) { out.push(line); continue; } // already chord-only, leave as-is
      var leadingWs = line.match(/^\s*/)[0];
      out.push(leadingWs + tags.join(' '));
      out.push(remainder);
      splitCount++;
    }
    return { text: out.join('\n'), splitCount: splitCount };
  }

  // One-time library-wide pass, run at load for any device whose stored
  // songs predate this chord-format cleanup (or predate a later widening of
  // it) — the save-time version above only touches a song when it's next
  // opened and saved in the editor, so a song someone pasted in months ago
  // and never re-saved would otherwise sit with unrecognized chord lines
  // forever, SPS silently doing nothing for it. Bumping
  // CHORD_FORMAT_VERSION re-runs this for everyone on their next load,
  // the same mechanism SEED_SONGS versioning already uses.
  // (CHORD_FORMAT_VERSION is declared up near STORE_KEY — see the note
  // above autoTagChordLines for why.)
  function migrateChordFormatting(st) {
    if (!st.settings) st.settings = {};
    var stored = st.settings.chordFormatVersion;

  // Hold-to-ramp: press and hold to accelerate scroll speed from a slow
  // crawl; release to lock in that speed and start scrolling. The same
  // button then reads "stop" (tap to stop the scroll), then "reset" (tap
  // to zero the speed and return to the ready/hold state).

    var btn = byId('hold-btn');
    var fasterBtn = byId('faster-btn');
    var slowerBtn = byId('slower-btn');
    var resetBtn = byId('reset-btn');
    var topBtn = byId('top-btn');
    if (!btn) return;
    playerAnimState.holdStage = 'ready';
    paintHoldButton();

    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (playerAnimState.holdStage === 'ready') startHoldRamp(1);
      else if (playerAnimState.holdStage === 'scrolling') stopHoldScroll();
      else if (playerAnimState.holdStage === 'stopped') startHoldRamp(1);

    btn.addEventListener('pointerup', function (e) {
      e.preventDefault();
      if (playerAnimState.holdRAF) finishHoldRamp();
    });
    btn.addEventListener('pointerleave', function (e) {
      if (playerAnimState.holdRAF) finishHoldRamp();
    });

    if (fasterBtn) {
      fasterBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (playerAnimState.holdStage === 'stopped') startHoldRamp(1);
      });
      fasterBtn.addEventListener('pointerup', function (e) {
        e.preventDefault();
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
      fasterBtn.addEventListener('pointerleave', function () {
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
    }
    if (slowerBtn) {
      slowerBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (playerAnimState.holdStage === 'stopped') startHoldRamp(-1);
      });
      slowerBtn.addEventListener('pointerup', function (e) {
        e.preventDefault();
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
      slowerBtn.addEventListener('pointerleave', function () {
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
    }
    if (resetBtn) {
      resetBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        resetHoldSpeed();
      });
    }
    if (topBtn) {
      topBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        scrollLyricsToTop();
      });
    }

  // the song. It doesn't touch the tap-tempo timer or the scroll speed —
  // Reset already owns that — so the person can jump back to the top and
  // still tap start again at whatever speed they'd already dialed in.
  function scrollLyricsToTop() {
    var viewport = byId('lyrics-viewport');
    if (viewport) viewport.scrollTop = 0;
  }

    // (not just feel via the fader) exactly how fast/slow it's going
    // before they let go and lock it in.
    if (!playerAnimState.isPlaying) togglePlay(true);
    function step(ts) {
      if (playerAnimState.holdStartTime == null) playerAnimState.holdStartTime = ts;
      var elapsed = (ts - playerAnimState.holdStartTime) / 1000;
      var newSpeed = playerAnimState.holdStartSpeed + direction * HOLD_RAMP_RATE * elapsed;
      playerAnimState.speed = Math.max(HOLD_MIN_SPEED, Math.min(HOLD_MAX_SPEED, newSpeed));

      syncFaderVisual();

    // restarts the tempo-capture sequence (below), scrolling keeps going the
    // whole time. Stopping is the HOLD/STOP button's job, not tap's; tap
    // silently doubling as stop (based on a 3s gap guess) was unreliable and
    // read as the control being broken.
    //
    // Generous window: pausing briefly between taps (e.g. a rest in the song)
    // no longer wipes progress the way the old build did — only a long pause resets it.
    if (taps.length === 0 || gap > 3000) {

      setTapStatus('waiting');
      clearTimeout(playerAnimState.tapTimeout);
      playerAnimState.tapTimeout = setTimeout(function () {

    // just applied to however many taps we actually have (2 through 7 gaps).

    for (var j = 0; j < gaps.length; j++) avgGap += gaps[j] * weights[j];

    newSpeed = Math.max(0.5, Math.min(80, newSpeed));
    playerAnimState.speed = newSpeed;
    state.settings.lastSpeed = newSpeed;

    clearTimeout(playerAnimState.tapTimeout);

    // convenience as before, but only fires once (checked via isPlaying).
    if (!playerAnimState.isPlaying) {

      playerAnimState.holdStage = 'scrolling';

        peaks.push(bestTau);
      } else if (nsdf[tau] > best) {
        best = nsdf[tau]; bestTau = tau;
      }
    }
    if (inPos && bestTau > 0 && bestTau < maxLag - 1) peaks.push(bestTau);
    var highest = 0, i;
    for (i = 0; i < peaks.length; i++) {
      if (peaks[i] >= minLag && nsdf[peaks[i]] > highest) highest = nsdf[peaks[i]];
    }
    if (highest <= 0) return null;
    var chosen = -1;
    for (i = 0; i < peaks.length; i++) {
      if (peaks[i] >= minLag && nsdf[peaks[i]] >= 0.9 * highest) { chosen = peaks[i]; break; }
    }
    if (chosen < 1) return null;
    var a = nsdf[chosen - 1], b = nsdf[chosen], c = nsdf[chosen + 1];
    var denom = a - 2 * b + c;
    var shift = denom !== 0 ? 0.5 * (a - c) / denom : 0;
    if (shift > 1 || shift < -1) shift = 0;
    return { freq: sr / (chosen + shift), clarity: b - 0.25 * (a - c) * shift };
  }
  /* TUNER-DSP-END */

  var tuner = null; // live session state while the overlay is open

  function tunerGaugeSvg() {
    var cx = 150, cy = 158, r = 128, ticks = '';
    for (var c = -50; c <= 50; c += 5) {
      var ang = c * 1.2 * Math.PI / 180;
      var major = c % 10 === 0;
      var len = c === 0 ? 24 : (major ? 15 : 8);
      var x1 = cx + Math.sin(ang) * r, y1 = cy - Math.cos(ang) * r;
      var x2 = cx + Math.sin(ang) * (r - len), y2 = cy - Math.cos(ang) * (r - len);
      ticks += '<line class="tuner-tick' + (major ? ' tuner-tick-major' : '') + (c === 0 ? ' tuner-tick-zero' : '') +
        '" x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
    }
    var zr = r + 10, za = TUNER_IN_TUNE_CENTS * 1.2 * Math.PI / 180;
    var zone = '<path class="tuner-zone" d="M' + (cx - Math.sin(za) * zr).toFixed(1) + ' ' + (cy - Math.cos(za) * zr).toFixed(1) +
      ' A' + zr + ' ' + zr + ' 0 0 1 ' + (cx + Math.sin(za) * zr).toFixed(1) + ' ' + (cy - Math.cos(za) * zr).toFixed(1) + '"/>';
    return '<svg class="tuner-gauge" viewBox="0 0 300 172" aria-hidden="true">' +
      zone + ticks +
      '<text class="tuner-flat-sharp" x="24" y="126" text-anchor="middle">&#9837;</text>' +
      '<text class="tuner-flat-sharp" x="276" y="126" text-anchor="middle">&#9839;</text>' +
      '<g class="tuner-needle" id="tuner-needle">' +
        '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - r + 4) + '"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="8"/>' +
      '</g>' +
    '</svg>';
  }

  function tunerHtml() {
    return (
      '<div class="tuner-top">' +
        '<button class="btn btn-back" type="button" data-action="close-tuner" aria-label="Close tuner">' + backSvg() + ' <span>Done</span></button>' +
        '<h1 class="tuner-title">Tuner</h1>' +
        '<div class="tuner-a4" role="group" aria-label="Reference pitch">' +

          '<span class="tuner-a4-val" id="tuner-a4-val"></span>' +
          '<button type="button" class="tuner-a4-btn" data-action="tuner-a4" data-dir="1" aria-label="Raise the reference pitch">+</button>' +
        '</div>' +

      '<div class="tuner-tunings" id="tuner-tunings"></div>' +
      '<div class="tuner-main">' +
        tunerGaugeSvg() +
        '<div class="tuner-readout">' +
          '<div class="tuner-note" aria-live="polite"><span id="tuner-note">&ndash;</span><sub id="tuner-octave"></sub></div>' +
          '<div class="tuner-sub" id="tuner-sub"></div>' +
          '<div class="tuner-status" id="tuner-status"></div>' +

  function paintTunerChrome() {
    var t = tunerTuning();
    var chips = byId('tuner-tunings');
    if (chips) {
      chips.innerHTML = TUNINGS.map(function (tu) {
        return '<button type="button" class="tuner-chip' + (tu.id === t.id ? ' tuner-chip-active' : '') +
          '" data-action="tuner-set-tuning" data-tuning="' + tu.id + '">' + escapeHtml(tu.label) + '</button>';
      }).join('');
    }
    var a4 = byId('tuner-a4-val');
    if (a4) a4.textContent = 'A ' + tunerA4();
    var strings = byId('tuner-strings');
    if (strings) {
      if (!t.strings) {
        strings.hidden = true;
        strings.innerHTML = '';
      } else {
        strings.hidden = false;
        strings.innerHTML = t.strings.map(function (m, i) {
          var name = tunerNoteName(m, t.flats);
          var label = i === t.strings.length - 1 ? name.charAt(0).toLowerCase() + name.slice(1) : name;
          var tuned = tuner && tuner.tunedStrings[i];
          return '<button type="button" class="tuner-string' + (tuned ? ' tuner-string-tuned' : '') +
            '" data-action="tuner-play-string" data-idx="' + i + '" aria-label="Play ' + name + tunerOctave(m) + '">' +
            '<span class="tuner-string-name">' + label + '</span>' +
            '<span class="tuner-string-oct">' + tunerOctave(m) + '</span>' +
            '<span class="tuner-string-check">' + checkSvg() + '</span>' +
          '</button>';
        }).join('');
      }
    }
    var hint = byId('tuner-hint');
    if (hint) hint.textContent = t.strings ?
      'Tap a string to hear its note.' :
      'Shows the nearest note for anything you play or sing.';
  }

  function setTunerState(st) {
    var el = byId('tuner-overlay');
    if (el && el.getAttribute('data-state') !== st) el.setAttribute('data-state', st);
  }

  function setTunerNeedle(cents) {
    var needle = byId('tuner-needle');
    if (needle) needle.style.transform = 'rotate(' + (Math.max(-50, Math.min(50, cents)) * 1.2).toFixed(2) + 'deg)';
  }

  function showTunerIdle() {
    if (!tuner) return;
    tuner.shownCents = 0;
    tuner.inTuneSince = 0;
    setTunerState('idle');
    setTunerNeedle(0);
    var note = byId('tuner-note'), oct = byId('tuner-octave'), sub = byId('tuner-sub'), status = byId('tuner-status');
    if (note) note.innerHTML = '&ndash;';
    if (oct) oct.textContent = '';
    if (sub) sub.textContent = tuner.running ? (tunerTuning().strings ? 'Play a string' : 'Play a note') : '';
    if (status) status.textContent = '';
    var btns = document.querySelectorAll('.tuner-string');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('tuner-string-active');
  }

  function showTunerPitch(midi) {
    var t = tunerTuning();
    var target, idx = -1;
    if (t.strings) {
      var bestD = Infinity;
      for (var i = 0; i < t.strings.length; i++) {
        var d = Math.abs(midi - t.strings[i]);
        if (d < bestD) { bestD = d; idx = i; }
      }
      target = t.strings[idx];
    } else {
      target = Math.round(midi);
    }
    var cents = (midi - target) * 100;
    var abs = Math.abs(cents);
    tuner.shownCents += (Math.max(-55, Math.min(55, cents)) - tuner.shownCents) * 0.45;
    setTunerNeedle(tuner.shownCents);
    var st = abs <= TUNER_IN_TUNE_CENTS ? 'intune' : (abs <= TUNER_CLOSE_CENTS ? 'close' : 'far');
    setTunerState(st);

    var note = byId('tuner-note'), oct = byId('tuner-octave'), sub = byId('tuner-sub'), status = byId('tuner-status');
    if (note) note.textContent = tunerNoteName(target, t.flats);
    if (oct) oct.textContent = String(tunerOctave(target));
    var centsText = Math.round(abs) === 0 ? '0¢' : (cents > 0 ? '+' : '−') + Math.round(abs) + '¢';
    var hz = tunerMidiToFreq(midi).toFixed(1) + ' Hz';
    if (sub) {
      sub.textContent = (t.strings && abs > 50) ?
        ('Hearing ' + tunerNoteName(midi, t.flats) + tunerOctave(midi) + ' · ' + hz) :
        (centsText + ' · ' + hz);
    }
    if (status) {
      status.textContent = st === 'intune' ? 'In tune' :
        (cents < 0 ? (abs > 50 ? 'Way low — tune up' : 'Low — tune up') :
                     (abs > 50 ? 'Way high — tune down' : 'High — tune down'));
    }

    if (t.strings) {
      var btns = document.querySelectorAll('.tuner-string');
      for (var b = 0; b < btns.length; b++) btns[b].classList.toggle('tuner-string-active', b === idx);
      // A string counts as tuned once it has held in tune for a moment.
      var now = Date.now();
      if (st === 'intune') {
        if (tuner.inTuneIdx !== idx || !tuner.inTuneSince) { tuner.inTuneIdx = idx; tuner.inTuneSince = now; }
        else if (now - tuner.inTuneSince > 600 && !tuner.tunedStrings[idx]) {
          tuner.tunedStrings[idx] = true;
          if (btns[idx]) btns[idx].classList.add('tuner-string-tuned');
        }
      } else {
        tuner.inTuneSince = 0;
      }
    }
  }

  function paintTunerLevel(rms) {
    var fill = byId('tuner-level-fill');
    if (fill) fill.style.width = Math.min(100, Math.sqrt(rms / 0.2) * 100).toFixed(0) + '%';
  }

  function tunerTick(ts) {
    if (!tuner || !tuner.running) return;
    tuner.raf = requestAnimationFrame(tunerTick);
    if (ts - tuner.lastProc < 30) return;
    tuner.lastProc = ts;
    var buf = tuner.buf;
    tuner.analyser.getFloatTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    var rms = Math.sqrt(sum / buf.length);
    paintTunerLevel(rms);
    var now = Date.now();
    var freq = 0;
    if (now >= tuner.toneUntil && rms > 0.004) {
      var p = detectPitchMPM(buf, tuner.W, tuner.ctx.sampleRate, tuner.minLag, tuner.maxLag);
      if (p && p.clarity >= 0.88 && p.freq >= 60 && p.freq <= 1400) freq = p.freq;
    }
    if (freq) {
      var midi = tunerFreqToMidi(freq);
      var h = tuner.hist;
      // A jump of more than ~half a semitone is a new note: start over
      // rather than averaging two different notes together.
      if (h.length && Math.abs(midi - tunerMedian(h)) > 0.6) h.length = 0;
      h.push(midi);
      if (h.length > 7) h.shift();
      tuner.lastHeard = now;
      if (h.length >= 2) showTunerPitch(tunerMedian(h));
    } else if (tuner.lastHeard && now - tuner.lastHeard > 1500) {
      tuner.lastHeard = 0;
      tuner.hist.length = 0;
      showTunerIdle();
    }
  }

  function tunerMicMessage(text) {
    var box = byId('tuner-mic'), msg = byId('tuner-mic-msg');
    if (msg) msg.textContent = text || '';
    if (box) box.hidden = !text;
  }

  function startTunerMic() {
    if (!tuner || tuner.running || tuner.starting) return;
    var framed = false;
    try { framed = window.self !== window.top; } catch (e) { framed = true; }
    var blockedHere = 'The tuner needs the microphone, which this viewer blocks. Open the Songbook at sour-paint-songbook.vercel.app to tune.';
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      tunerMicMessage(framed ? blockedHere : 'This browser can’t use the microphone on this page.');
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { tunerMicMessage('This browser can’t run the tuner.'); return; }
    // Created inside the tap that opened the tuner — phones only allow
    // audio to start from a tap.
    if (!tuner.ctx || tuner.ctx.state === 'closed') tuner.ctx = new Ctx();
    var ctx = tuner.ctx;
    if (ctx.state === 'suspended') { var rp = ctx.resume(); if (rp && rp.catch) rp.catch(function () {}); }
    tunerMicMessage('');
    tuner.starting = true;
    var sub = byId('tuner-sub');
    if (sub) sub.textContent = 'Starting the microphone…';
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      video: false
    }).then(function (stream) {
      if (!tuner || tuner.ctx !== ctx) { stream.getTracks().forEach(function (tr) { tr.stop(); }); return; }
      tuner.starting = false;
      tuner.stream = stream;
      if (ctx.state === 'suspended') { var rp2 = ctx.resume(); if (rp2 && rp2.catch) rp2.catch(function () {}); }
      var src = ctx.createMediaStreamSource(stream);
      // Trim rumble below the low strings and hiss above the useful range.
      var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 50;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      var an = ctx.createAnalyser();
      var W = 2048;
      while (W < ctx.sampleRate * 0.04) W *= 2;
      an.fftSize = W;
      an.smoothingTimeConstant = 0;
      src.connect(hp); hp.connect(lp); lp.connect(an);
      tuner.source = src;
      tuner.analyser = an;
      tuner.W = W;
      tuner.buf = new Float32Array(W);
      tuner.minLag = Math.floor(ctx.sampleRate / 1400);
      tuner.maxLag = Math.min(W - 2, Math.ceil(ctx.sampleRate / 58));
      tuner.running = true;
      tuner.hist = [];
      showTunerIdle();
      requestTunerWakeLock();
      tuner.raf = requestAnimationFrame(tunerTick);
    }).catch(function (err) {
      if (!tuner) return;
      tuner.starting = false;
      if (sub) sub.textContent = '';
      var name = err && err.name;
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        tunerMicMessage(framed ? blockedHere :
          'Microphone access is off for this site. Turn it on in your browser’s site settings (tap the icon left of the web address → Permissions → Microphone → Allow), then tap Start tuner.');
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        tunerMicMessage('No microphone was found on this device.');
      } else if (name === 'NotReadableError') {
        tunerMicMessage('Another app is using the microphone. Close it, then tap Start tuner.');
      } else {
        tunerMicMessage('The microphone couldn’t start' + (err && err.message ? ': ' + err.message : '.'));
      }
    });
  }

  function requestTunerWakeLock() {
    if (!tuner || !navigator.wakeLock || !navigator.wakeLock.request) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      if (tuner && tuner.running) tuner.wakeLock = lock;
      else lock.release();
    }).catch(function () {});
  }

  function stopTunerMic() {
    if (!tuner) return;
    tuner.running = false;
    tuner.starting = false;
    if (tuner.raf) cancelAnimationFrame(tuner.raf);
    tuner.raf = null;
    if (tuner.source) { try { tuner.source.disconnect(); } catch (e) {} tuner.source = null; }
    if (tuner.stream) { tuner.stream.getTracks().forEach(function (tr) { tr.stop(); }); tuner.stream = null; }
    tuner.analyser = null;
    if (tuner.wakeLock) { try { tuner.wakeLock.release(); } catch (e) {} tuner.wakeLock = null; }
    paintTunerLevel(0);
  }

  function openTuner() {
    if (tuner) return;
    // Scrolling lyrics behind the tuner would just run off the page.
    if (view.name === 'player' && playerAnimState.isPlaying) stopHoldScroll();
    tuner = {
      ctx: null, stream: null, source: null, analyser: null, buf: null, W: 0, minLag: 0, maxLag: 0,
      raf: null, lastProc: 0, hist: [], shownCents: 0, lastHeard: 0, wakeLock: null,
      toneUntil: 0, inTuneSince: 0, inTuneIdx: -1, tunedStrings: {}, running: false, starting: false
    };
    var el = document.createElement('div');
    el.id = 'tuner-overlay';
    el.className = 'tuner-overlay';
    el.setAttribute('data-state', 'idle');
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', 'Tuner');
    el.innerHTML = tunerHtml();
    document.body.appendChild(el);
    paintTunerChrome();
    showTunerIdle();
    // Device back closes the tuner first (see the popstate handler).
    try { history.pushState({ view: view.name, tuner: true }, ''); } catch (e) {}
    startTunerMic();
  }

  function closeTuner() {
    if (!tuner) return;
    stopTunerMic();
    if (tuner.ctx) { try { var cp = tuner.ctx.close(); if (cp && cp.catch) cp.catch(function () {}); } catch (e) {} }
    tuner = null;
    var el = byId('tuner-overlay');
    if (el) el.remove();
  }

  function setTunerTuning(id) {
    if (!tuner) return;
    state.settings.tunerTuning = id;
    persist();
    tuner.tunedStrings = {};
    tuner.hist = [];
    paintTunerChrome();
    showTunerIdle();
  }

  function nudgeTunerA4(dir) {
    if (!tuner || !dir) return;
    state.settings.tunerA4 = Math.max(430, Math.min(450, tunerA4() + dir));
    persist();
    tuner.tunedStrings = {};
    tuner.hist = [];
    paintTunerChrome();
    showTunerIdle();
  }

  // A short plucked-sounding reference note for one string. The mic
  // reading is ignored while it plays so the tuner doesn't tune to itself.
  function playTunerString(idx) {
    if (!tuner) return;
    var t = tunerTuning();
    if (!t.strings || !(idx >= 0 && idx < t.strings.length)) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!tuner.ctx || tuner.ctx.state === 'closed') tuner.ctx = new Ctx();
    var ctx = tuner.ctx;
    if (ctx.state === 'suspended') { var rp = ctx.resume(); if (rp && rp.catch) rp.catch(function () {}); }
    var f = tunerMidiToFreq(t.strings[idx]);
    var start = ctx.currentTime + 0.02, dur = 2.4;
    var out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, start);
    out.gain.exponentialRampToValueAtTime(0.35, start + 0.012);
    out.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    out.connect(ctx.destination);
    [[1, 'triangle', 1], [2, 'sine', 0.35], [3, 'sine', 0.12]].forEach(function (part) {
      var o = ctx.createOscillator();
      o.type = part[1];
      o.frequency.value = f * part[0];
      var g = ctx.createGain();
      g.gain.value = part[2];
      o.connect(g); g.connect(out);
      o.start(start);
      o.stop(start + dur + 0.05);
    });
    tuner.toneUntil = Date.now() + dur * 1000 + 200;
    tuner.hist = [];
    var btns = document.querySelectorAll('.tuner-string');
    if (btns[idx]) {
      var btn = btns[idx];
      btn.classList.add('tuner-string-playing');
      setTimeout(function () { btn.classList.remove('tuner-string-playing'); }, 600);
    }
  }

  // Leaving the app (screen off, switching apps) releases the mic; the
  // tuner waits for a tap to pick back up.
  document.addEventListener('visibilitychange', function () {
    if (!tuner || !document.hidden || !(tuner.running || tuner.starting)) return;
    stopTunerMic();
    showTunerIdle();
    tunerMicMessage('Tuner paused while the app was in the background.');
  });
  document.addEventListener('keydown', function (e) {
    if (tuner && e.key === 'Escape') closeTuner();
  });

  /* ============================================================
     MAIN RENDER DISPATCH
     ============================================================ */
  function render() {
    applyTheme();
    if (view.name === 'editor') renderEditor();
    else if (view.name === 'player') renderPlayer();
    else if (view.name === 'songlists') renderSongLists();
    else if (view.name === 'songlist') renderSongListDetail();
    else if (view.name === 'library') renderLibrary();
    else renderHome();
  }

  /* ---------- Global click delegation ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (action === 'new-song') {
      openEditorDraft(null);
      // Adding a song from inside a category files it there by default.
      if (view.name === 'library' && isKnownCategory(state.settings.libraryFilter)) {
        editorDraft.category = state.settings.libraryFilter;
      }
      goEditor(null);
    }
    else if (action === 'open-category') { goCategory(el.getAttribute('data-filter')); }
    else if (action === 'open-more-menu') { setModal('more-menu-modal', true); }
    else if (action === 'close-more-menu') { setModal('more-menu-modal', false); }
    else if (action === 'more-backup') { setModal('more-menu-modal', false); backupLibrary(); }
    else if (action === 'more-restore') { setModal('more-menu-modal', false); setModal('restore-modal', true); }
    else if (action === 'more-arrange') { setModal('more-menu-modal', false); arrangeMode = true; renderHome(); }
    else if (action === 'arrange-move') { moveCategoryInOrder(el.getAttribute('data-filter'), Number(el.getAttribute('data-dir')) || 0); }
    else if (action === 'arrange-done') { arrangeMode = false; renderHome(); toast('Order saved.'); }
    else if (action === 'restore-cancel') { setModal('restore-modal', false); }
    else if (action === 'restore-confirm') {
      var rt = byId('restore-text');
      if (!rt || !rt.value.trim()) { toast('Choose a backup file or paste backup text first.'); }
      else restoreFromText(rt.value);
    }
    else if (action === 'backup-text-close') { setModal('backup-text-modal', false); }
    else if (action === 'backup-text-copy') { copyBackupText(); }
    else if (action === 'go-home') { goHome(); }
    else if (action === 'open-song') { goPlayer(id); }
    else if (action === 'edit-song') { openEditorDraft(id); goEditor(id); }
    else if (action === 'request-delete-song') { requestDeleteSong(id); }
    else if (action === 'set-library-filter') { goCategory(el.getAttribute('data-filter')); }
    else if (action === 'cancel-delete-song') { cancelDeleteSong(); }
    else if (action === 'confirm-delete-song') { confirmDeleteSong(); }
    else if (action === 'move-song') { requestMoveSong(id); }
    else if (action === 'cancel-move-song') { cancelMoveSong(); }
    else if (action === 'pick-move-category') { pickMoveCategory(el.getAttribute('data-cat')); }
    else if (action === 'new-category') { openNamePrompt('new-category', 'Add category', ''); }
    else if (action === 'open-color-picker') { openColorPicker({ type: 'song', songId: id }); }
    else if (action === 'open-category-color-picker') { openColorPicker({ type: 'category', categoryId: el.getAttribute('data-catid') }); }
    else if (action === 'pick-color-swatch') { stagePendingColor(el.getAttribute('data-color')); }
    else if (action === 'cancel-color-picker') { cancelColorPicker(); }
    else if (action === 'confirm-color-picker') { confirmColorPicker(); }
    else if (action === 'cancel-name-prompt') { cancelNamePrompt(); }
    else if (action === 'confirm-name-prompt') { confirmNamePrompt(); }
    else if (action === 'open-songlists') { goSongLists(); }
    else if (action === 'songlists-back') { goHome(); }
    else if (action === 'new-songlist') { openNamePrompt('new-songlist', 'New song list', ''); }
    else if (action === 'open-songlist') { goSongList(id); }
    else if (action === 'request-delete-songlist') { requestDeleteSongList(id); }
    else if (action === 'edit-category') { openEditCategory(el.getAttribute('data-catid'), false); }
    else if (action === 'edit-cat-save') { saveEditCategory(); }
    else if (action === 'edit-cat-cancel') { closeEditCategory(); }
    else if (action === 'edit-cat-clear-image') { if (editCat) { editCat.pendingImage = null; paintEditCategoryPreview(); } }
    else if (action === 'request-delete-category') { requestDeleteCategory(el.getAttribute('data-catid')); }
    else if (action === 'cancel-delete-category') { cancelDeleteCategory(); }
    else if (action === 'confirm-delete-category') { confirmDeleteCategory(); }
    else if (action === 'cancel-delete-songlist') { cancelDeleteSongList(); }
    else if (action === 'confirm-delete-songlist') { confirmDeleteSongList(); }
    else if (action === 'songlist-back') { goSongLists(); }
    else if (action === 'rename-songlist') {
      var lToRename = findSongList(id);
      if (lToRename) openNamePrompt({ rename: lToRename.id }, 'Rename list', lToRename.name);
    }
    else if (action === 'open-songlist-picker') { openSonglistPicker(); }
    else if (action === 'close-songlist-picker') { closeSonglistPicker(); }
    else if (action === 'toggle-songlist-song') { toggleSonglistSong(el.getAttribute('data-listid'), el.getAttribute('data-songid')); }
    else if (action === 'remove-song-from-list') { removeSongFromList(id); }
    else if (action === 'editor-cancel') { editorDraft = null; goLibrary(); }
    else if (action === 'editor-save') { saveEditor(); }
    else if (action === 'player-back') { stopPlayerLoop(); goLibrary(); }
    else if (action === 'remove-photo') { editorDraft.image = null; renderEditor(); }
    else if (action === 'toggle-import-menu') { toggleImportMenu(); }
    else if (action === 'import-review-cancel') { closeImportReview(); }
    else if (action === 'import-review-use') { applyImportedText(); }
    else if (action === 'shop-prompt') {
      var shopModal = byId('shop-modal');
      if (shopModal) shopModal.hidden = false;
    }
    else if (action === 'shop-prompt-close') {
      var shopModal2 = byId('shop-modal');
      if (shopModal2) shopModal2.hidden = true;
    }
    else if (action === 'open-art-wheel') { openArtWheel(); }
    else if (action === 'art-wheel-close') { closeArtWheel(); }
    else if (action === 'art-wheel-prev') { flipArtWheel(-1); }
    else if (action === 'art-wheel-next') { flipArtWheel(1); }
    else if (action === 'art-wheel-lock') { lockArtPalette(); }
    else if (action === 'art-wheel-clear') { clearArtPalette(); }
    else if (action === 'open-tuner') { openTuner(); }
    else if (action === 'close-tuner') { closeTuner(); }
    else if (action === 'tuner-start') { startTunerMic(); }
    else if (action === 'tuner-set-tuning') { setTunerTuning(el.getAttribute('data-tuning')); }
    else if (action === 'tuner-a4') { nudgeTunerA4(Number(el.getAttribute('data-dir')) || 0); }
    else if (action === 'tuner-play-string') { playTunerString(Number(el.getAttribute('data-idx'))); }
    else if (action === 'toggle-reading-picker') {
      var picker = byId('reading-picker');
      if (picker) picker.hidden = !picker.hidden;
    }
    else if (action === 'toggle-reading-invert') {
      toggleReadingInvert();
    }
    else if (action === 'dec-font-size') { adjustFontSize(-2); }
    else if (action === 'inc-font-size') { adjustFontSize(2); }
    else if (action === 'set-size-mode') { setSizeMode(el.getAttribute('data-mode')); }
    else if (action === 'toggle-glass-mode') { toggleGlassMode(); }
    else if (action === 'toggle-chord-layout') {
      state.settings.chordLayout = (state.settings.chordLayout === 'left') ? 'standard' : 'left';
      persist();
      refreshLyricsBody();
      paintChordLayoutButton();
    }
    else if (action === 'set-reading-mode') {
      var modeId = el.getAttribute('data-mode');
      readingOverride = true;
      state.settings.readingMode = modeId;
      persist();
      applyReadingMode();
      paintInvertButton();
      var pk = byId('reading-picker');
      if (pk) pk.hidden = true;
    }
  });

  /* ---------- Splash, then boot ---------- */
  function boot() {
    applyTheme();
    render();
  }

  /* Video intro (from Daniel's Grok build): the paint-splash logo video
     plays muted (phones only allow sound after a tap), with "Tap for
     sound" to restart it with audio and "Tap to skip" anywhere else. If
     the video can't play within a couple of seconds, the still title card
     shows briefly instead, so the app never hangs on a black screen. */
  var APP_VERSION_LABEL = 'Version 52';
  function runIntro() {
    var splash = document.getElementById('splash');
    if (!splash) return;
    var done = false;
    var fallbackTimer = null;
    var safetyTimer = null;
    function dismiss() {
      if (done) return;
      done = true;
      clearTimeout(fallbackTimer);
      clearTimeout(safetyTimer);
      var v = splash.querySelector('video');
      if (v) { try { v.pause(); } catch (e) {} }
      splash.classList.add('splash-out');
      setTimeout(function () { if (splash.parentNode) splash.remove(); }, 550);
    }
    var still = splash.querySelector('img');
    var stillSrc = still ? still.getAttribute('src') : '';
    splash.classList.add('splash-video');
    splash.innerHTML =
      '<div class="splash-stage">' +
        '<video class="splash-vid" poster="' + artUrl('splash-poster.jpg') + '" muted autoplay playsinline webkit-playsinline preload="auto">' +
          '<source src="' + artUrl('splash-intro.mp4') + '" type="video/mp4" />' +
          '<source src="' + artUrl('splash-intro.webm') + '" type="video/webm" />' +
        '</video>' +
        (stillSrc ? '<img class="splash-still" src="' + stillSrc + '" alt="Sour Paint Studios" hidden />' : '') +
      '</div>' +
      '<button type="button" class="splash-skip">Tap to skip</button>' +
      '<button type="button" class="splash-sound">Tap for sound</button>' +
      '<div class="splash-version">' + APP_VERSION_LABEL + '</div>';
    var vid = splash.querySelector('video');
    var soundBtn = splash.querySelector('.splash-sound');
    function showStill() {
      if (done) return;
      var img = splash.querySelector('.splash-still');
      if (vid) vid.hidden = true;
      if (soundBtn) soundBtn.hidden = true;
      if (img) img.hidden = false;
      setTimeout(dismiss, 1600);
    }
    splash.addEventListener('click', function (e) {
      if (e.target.closest('.splash-sound')) {
        e.stopPropagation();
        if (!vid) return;
        vid.muted = false;
        vid.volume = 1;
        try { vid.currentTime = 0; } catch (err) {}
        var p = vid.play();
        if (p && p.catch) p.catch(function () {});
        soundBtn.hidden = true;
        return;
      }
      dismiss();
    });
    if (!vid) { showStill(); return; }
    vid.addEventListener('playing', function () { clearTimeout(fallbackTimer); });
    vid.addEventListener('ended', dismiss);
    vid.addEventListener('error', showStill);
    // With <source> children, a failed load reports on the last source.
    var sources = vid.querySelectorAll('source');
    if (sources.length) sources[sources.length - 1].addEventListener('error', showStill);
    fallbackTimer = setTimeout(function () {
      if (vid.paused || vid.readyState < 2) showStill();
    }, 2500);
    safetyTimer = setTimeout(dismiss, 16000);
    var p0 = vid.play();
    if (p0 && p0.catch) p0.catch(function () { /* autoplay refused — fallback timer covers it */ });
  }
  runIntro();
  boot();
  getDownloads();

})();



</script>
