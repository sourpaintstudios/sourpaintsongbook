<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sour Paint Studios — Songbook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
<style>
/* ============================================================
   Sour Paint Studios — Songbook
   Design tokens
   ============================================================ */
:root {
  --green: #6FB92C;
  --green-bright: #93D83E;
  --yellow: #F0DE00;
  --ink: #121210;
  --ink-soft: #1c1c19;
  --paper: #F7F4EC;
  --paper-soft: #FFFFFF;
  --line-dark: rgba(255,255,255,0.10);
  --line-light: rgba(0,0,0,0.10);

  --bg: var(--paper);
  --bg-elevated: var(--paper-soft);
  --text: var(--ink);
  --text-dim: rgba(18,18,16,0.62);
  --line: var(--line-light);
  --danger: #D9432E;

  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(18,18,16,0.10);
}

:root[data-theme="dark"] {
  --bg: var(--ink);
  --bg-elevated: var(--ink-soft);
  --text: #F3F1E8;
  --text-dim: rgba(243,241,232,0.62);
  --line: var(--line-dark);
  --shadow: 0 10px 30px rgba(0,0,0,0.45);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--ink);
    --bg-elevated: var(--ink-soft);
    --text: #F3F1E8;
    --text-dim: rgba(243,241,232,0.62);
    --line: var(--line-dark);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Sour Body', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  /* Text on-screen here isn't meant to be selected — a stray long-press on
     a title was triggering the phone/browser's native selection UI (and,
     inside the Claude app's artifact viewer, its comment-on-selection
     prompt), which then sat on top of the app with no way through it.
     Inputs and the lyrics textarea opt back in below since those are
     meant to be typed/edited/selected normally. */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
input, textarea {
  user-select: text; -webkit-user-select: text; -webkit-touch-callout: default;
}
h1, h2, h3 { font-family: 'Sour Display', 'Sour Body', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; margin: 0; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

/* Progressive-enhancement font loading: the stack above already reads well
   with system fonts alone, since this app needs to work without wifi on stage. */
@font-face {
  font-family: 'Sour Display';
  src: local('Space Grotesk'), url('https://fonts.gstatic.com/s/spacegrotesk/v16/V8mQoQDjQSkFtoMM3T6r8E7mPbF4C_qbHwYRlw.woff2') format('woff2');
  font-weight: 500 700;
  font-display: swap;
}
@font-face {
  font-family: 'Sour Body';
  src: local('Inter');
  font-display: swap;
}

.hidden { display: none !important; }

/* ---------- Splash ---------- */
#splash {
  position: fixed; inset: 0; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 18px;
  background: var(--ink);
  transition: opacity 0.5s ease;
}
#splash.splash-out { opacity: 0; pointer-events: none; }
#splash img {
  width: 168px; height: 168px; object-fit: contain;
  animation: splash-in 0.9s cubic-bezier(.2,.9,.25,1) both;
}
#splash .splash-caption {
  color: rgba(243,241,232,0.55);
  font-size: 13px;
  letter-spacing: 0.02em;
  animation: splash-fade 0.9s ease 0.2s both;
}
@keyframes splash-in {
  0% { opacity: 0; transform: scale(0.82) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes splash-fade {
  0% { opacity: 0; } 100% { opacity: 1; }
}

/* ---------- Layout shells ---------- */
#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { min-height: 100dvh; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
}
/* Player topbar: title/back on its own row, all the icon controls on a
   second row below — keeps every button fully visible and tappable no
   matter how narrow the phone or how long the song title, instead of
   cramming everything into one row where the last button (or the title)
   gets squeezed off-screen. */
.topbar-player {
  flex-direction: column; align-items: stretch;
  gap: 10px; padding-left: 12px; padding-right: 12px;
}
.topbar-player-row1 { display: flex; align-items: center; gap: 10px; }
.topbar-player-row2 { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.topbar h1 { font-size: 17px; font-weight: 700; }
.topbar-editor h1, .topbar-player .player-title h1 { font-size: 16px; }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-line1 { font-size: 11px; font-weight: 600; color: var(--green); letter-spacing: 0.01em; }
.brand-line2 { font-family: 'Sour Display','Sour Body',sans-serif; font-size: 18px; font-weight: 700; }

.brand-mark-btn {
  border: none; background: transparent; padding: 0; cursor: pointer;
  display: flex; align-items: center; flex-shrink: 0;
  border-radius: 999px;
}
.brand-mark-btn:active { transform: scale(0.94); }
.brand-mark-sm { width: 40px; height: 40px; object-fit: contain; }

.btn-art-mode {
  width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px;
  border: 1.5px solid var(--green-bright); background: var(--bg-elevated);
  color: var(--green-bright); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 3px rgba(147,216,62,0.16);
}
.btn-art-mode:active { transform: scale(0.94); }

.topbar-actions { display: flex; gap: 8px; }

.player-title { flex: 1; min-width: 0; text-align: center; }

.btn-back {
  background: var(--green); color: #0d1a02;
  height: 40px; padding: 0 16px;
  border-radius: 999px; border: none;
  font-weight: 800; font-size: 13.5px;
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.btn-back:active { transform: scale(0.96); }
.player-title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Buttons ---------- */
.icon-btn {
  width: 40px; height: 40px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg-elevated); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn-danger:hover, .icon-btn-danger:active { color: var(--danger); }

.btn {
  border: none; border-radius: 999px; cursor: pointer;
  font-weight: 700; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px;
  transition: transform 0.08s ease;
}
.btn:active { transform: scale(0.97); }
/* No text-selection / long-press callout on any control button anywhere in
   the app — holding to ramp tempo was accidentally triggering the phone's
   native copy/select popup. */
button {
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
.btn-hold, .btn-ramp { touch-action: none; }
.btn-primary { background: var(--green); color: #0d1a02; }
.btn-lg { padding: 14px 24px; font-size: 15px; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.btn-ghost {
  background: var(--bg-elevated); color: var(--text);
  border: 1px solid var(--line);
}
/* ---------- Library ---------- */
.library-main { flex: 1; padding: 18px 16px 40px; max-width: 760px; width: 100%; margin: 0 auto; }
.library-heading {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.library-heading h1 { font-size: 22px; }

.song-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 560px) { .song-grid { grid-template-columns: 1fr 1fr; } }

.song-card {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  text-align: left;
}
.song-card:active { transform: scale(0.99); }
.song-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.song-card-top h3 { font-size: 17px; font-weight: 700; line-height: 1.3; }
.song-card-artist { margin: 2px 0 0; font-size: 13px; color: var(--text-dim); }
.song-card-menu { display: flex; gap: 6px; flex-shrink: 0; }
.song-card-menu .icon-btn { width: 32px; height: 32px; }
.song-card-preview {
  margin: 10px 0 0; font-size: 13.5px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip-row-tight { justify-content: center; margin-top: 4px; }
.chip {
  font-size: 11.5px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(111,185,44,0.16); color: var(--green);
}

.empty-state {
  text-align: center; padding: 60px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.empty-mark { color: var(--green); margin-bottom: 6px; }
.empty-state h2 { font-size: 20px; }
.empty-state p { color: var(--text-dim); max-width: 360px; font-size: 14.5px; line-height: 1.55; margin: 4px 0 18px; }

/* ---------- Editor ---------- */
.editor-main { flex: 1; padding: 20px 16px 60px; max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--text-dim); }
.field-optional { font-weight: 400; }
input[type="text"], textarea {
  background: var(--bg-elevated); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 13px; font-size: 15px; font-family: inherit;
  resize: vertical;
}
textarea { line-height: 1.6; min-height: 220px; }
input:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; }

.photo-preview { display: flex; align-items: center; gap: 12px; }
.photo-preview img { width: 84px; height: 84px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); }

/* ---------- Reading-mode picker ---------- */
.reading-picker[hidden] { display: none; }
.reading-picker:not([hidden]) {
  position: sticky; top: 128px; z-index: 21;
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.swatch {
  width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--line);
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-weight: 700; font-size: 13px;
  cursor: pointer;
}
.swatch:active { transform: scale(0.94); }
.btn-fontsize {
  width: 44px; height: 44px; border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-elevated); color: var(--text);
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-weight: 800; font-size: 15px;
  cursor: pointer; flex-shrink: 0;
}
.btn-fontsize:active { transform: scale(0.94); }
.btn-layout {
  height: 44px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-elevated); color: var(--text);
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-weight: 800; font-size: 12.5px; letter-spacing: 0.01em;
  cursor: pointer; flex-shrink: 0;
}
.btn-layout:active { transform: scale(0.96); }

/* Compact on-the-fly chord-layout toggle, sitting right in the player
   topbar next to the reading-colors/invert/edit icons, so switching
   between Standard and SPS Layout never requires opening the reading
   picker or going into edit mode. */
.btn-layout-top {
  height: 40px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-elevated); color: var(--text);
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-weight: 800; font-size: 11.5px; letter-spacing: 0.01em;
  cursor: pointer; flex-shrink: 0;
}
.btn-layout-top:active { transform: scale(0.94); }
.btn-layout-top-active {
  border-color: var(--green-bright); color: var(--green-bright);
  box-shadow: 0 0 0 2px rgba(147,216,62,0.16);
}

/* ---------- Player ---------- */
.screen-player { height: 100dvh; overflow: hidden; }
.player-body { flex: 1; display: flex; min-height: 0; }

.lyrics-viewport {
  flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: auto;
}
.lyrics-body {
  max-width: 640px; margin: 0 auto;
  padding: 24px 16px 60px;
  font-size: 21px; line-height: 1.75; font-weight: 500;
}

/* Right-hand vertical fader rail — sized for a right thumb to ride up and
   down mid-performance without hunting for a small horizontal slider. */
.fader-rail {
  width: 60px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 12px 0 8px;
  border-left: 1px solid var(--line);
}
.fader-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.05em;
  color: var(--text-dim); flex-shrink: 0;
}
.fader-track {
  position: relative;
  width: 34px; flex: 1;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  touch-action: none;
  cursor: pointer;
}
.fader-fill {
  position: absolute; left: 0; right: 0; bottom: 0;
  border-radius: 999px;
  background: linear-gradient(to top, var(--green), var(--green-bright));
  height: 30%;
  pointer-events: none;
}
.fader-thumb {
  position: absolute; left: 50%; bottom: 30%;
  width: 44px; height: 26px;
  transform: translate(-50%, 50%);
  border-radius: 8px;
  background: var(--paper);
  border: 2px solid var(--ink);
  box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  pointer-events: none;
}
/* Speed readout: its own line above the fader track, not squeezed into
   the small thumb, so the number is actually legible at a glance. */
.fader-readout {
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-size: 20px; font-weight: 800; color: var(--green-bright);
  line-height: 1; text-align: center; min-width: 100%;
  flex-shrink: 0; user-select: none;
}
:root[data-theme="dark"] .fader-thumb { background: #F3F1E8; border-color: #F3F1E8; }
.fader-track:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.lyric-section { margin-bottom: 28px; }
.lyric-line { display: block; }
.lyric-line:empty { display: block; height: 0.6em; }
.chord {
  color: var(--green); font-weight: 700;
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-size: 0.72em;
  vertical-align: 0.15em;
  margin-right: 0.05em;
}
.lyrics-empty { color: var(--text-dim); font-size: 16px; padding-top: 20px; }

/* Sour Paint Studios chord layout: a chord-cue line sits to the left of
   the lyric line it leads into, instead of stacked above it. */
.lyric-cue-row {
  display: flex; align-items: baseline; gap: 16px;
}
.lyric-cue-chord {
  flex: 0 0 auto; min-width: 48px; max-width: 38%;
  text-align: left;
}
.lyric-cue-chord .chord {
  font-size: 0.85em; vertical-align: baseline; margin-right: 0.15em;
}
.lyric-cue-line { flex: 1 1 auto; min-width: 0; }

.player-controls {
  position: sticky; bottom: 0; z-index: 20;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px;
}
.control-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  max-width: 640px; margin: 0 auto; width: 100%;
}
.ramp-row[hidden] { display: none; }
.ramp-row:not([hidden]) {
  display: grid; grid-template-columns: 1fr 0.7fr 1fr; gap: 6px;
  max-width: 640px; margin: 0 auto; width: 100%;
}
.btn-ramp {
  height: 48px; border-radius: 999px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 800; font-size: 12px; letter-spacing: 0.01em;
  background: var(--bg-elevated); color: var(--text); border: 1.5px solid var(--line);
  transition: transform 0.08s ease;
}
.btn-ramp svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn-ramp:active { transform: scale(0.96); }
.btn-faster { border-color: var(--green-bright); color: var(--green-bright); }
.btn-slower { border-color: var(--yellow); color: var(--yellow); }
/* Faster/Slower only do anything while actually held down — a quick tap
   just re-locks the current speed and looks like nothing happened. Spell
   that out right on the button instead of relying on people to guess it,
   the same way the main hold-to-ramp button already does. */
.ramp-label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.ramp-word { font-size: 12px; font-weight: 800; }
.ramp-hint {
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; opacity: 0.72;
}
.btn-tap {
  height: 52px; border-radius: 999px; border: 1.5px solid var(--green-bright); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 800; letter-spacing: 0.01em;
  transition: background-color 0.15s ease, transform 0.08s ease, color 0.15s ease;
  background: var(--green-bright); color: #0d1a02;
  font-size: 13px;
  box-shadow: 0 0 0 2px rgba(212,255,63,0.18);
}
.btn-tap:active { transform: scale(0.97); }
.btn-tap .tap-icon svg { width: 18px; height: 18px; }
.btn-tap[data-status="waiting"] { background: var(--yellow); color: #221f00; border-color: var(--yellow); }
.btn-tap[data-status="success"] { background: var(--green-bright); color: #0d1a02; border-color: var(--green-bright); }

/* Hold-to-ramp button — same footprint as tap, its own color per stage.
   Also the sole play/pause indicator now (no separate Play button). */
.btn-hold {
  height: 52px; border-radius: 999px; border: 1.5px solid transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 800; font-size: 13px; letter-spacing: 0.01em;
  transition: background-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
}
.btn-hold .hold-icon svg { width: 18px; height: 18px; }
.btn-hold:active { transform: scale(0.97); }
.hold-label { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.hold-hint {
  font-size: 9px; font-weight: 700; letter-spacing: 0.03em;
  text-transform: uppercase; opacity: 0.75;
}
.hold-hint[hidden] { display: none; }
.btn-hold[data-status="ready"] {
  background: var(--yellow); color: #221f00; border-color: var(--yellow);
  box-shadow: 0 0 0 2px rgba(255,214,10,0.18);
}
.btn-hold[data-status="scrolling"] { background: var(--ink); color: var(--paper); border-color: var(--line); }
.btn-hold[data-status="stopped"] { background: var(--bg-elevated); color: var(--text); border-color: var(--line); }

/* ---------- Modals ---------- */
.modal-backdrop[hidden] { display: none; }
.modal-backdrop:not([hidden]) {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 560px) {
  .modal-backdrop:not([hidden]) { align-items: center; }
}
.modal-card {
  width: 100%; max-width: 420px;
  background: var(--bg); color: var(--text);
  border-radius: 22px 22px 0 0;
  padding: 28px 24px 32px;
  text-align: center;
  box-shadow: var(--shadow);
}
@media (min-width: 560px) {
  .modal-card { border-radius: 22px; margin: 0 16px; }
}
.modal-logo { width: 56px; height: 56px; object-fit: contain; margin: 0 auto 12px; }
.modal-card h2 { font-family: 'Sour Display','Sour Body',sans-serif; font-size: 20px; margin: 0 0 8px; }
.modal-card p { font-size: 14px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.5; }
.modal-url { color: var(--green-bright); font-weight: 700; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none; }

/* Art-mode flip-through picker */
.art-wheel-card { padding-top: 24px; }
.art-wheel-sub { margin-bottom: 18px !important; }
.art-wheel-flipzone {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 20px;
}
.art-wheel-arrow {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 999px;
  background: var(--bg-elevated); border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.art-wheel-arrow:active { transform: scale(0.92); }
.art-wheel-card-frame { flex: 1 1 auto; perspective: 900px; }
.art-wheel-flipcard {
  height: 118px; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  background: var(--bg-elevated); border: 1.5px solid var(--line);
  transition: transform 140ms ease;
  transform: rotateY(0deg);
}
.art-wheel-flipcard.is-flipping { transform: rotateY(90deg); }
.art-wheel-swatches { display: flex; gap: 6px; }
.art-wheel-swatches span {
  width: 22px; height: 22px; border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.12);
}
.art-wheel-swatch-default {
  width: 22px; height: 22px; border-radius: 7px;
  background: repeating-linear-gradient(45deg, var(--line), var(--line) 3px, transparent 3px, transparent 6px);
}
.art-wheel-flipcard span#art-wheel-name {
  font-family: 'Sour Display','Sour Body',sans-serif;
  font-size: 18px; font-weight: 800; color: var(--green-bright);
  letter-spacing: 0.01em;
}
.art-wheel-actions { flex-wrap: wrap; }
.art-wheel-close { margin-top: 10px; width: 100%; height: 44px; border-radius: 999px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
  background: var(--ink); color: var(--paper);
  padding: 11px 18px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 1000; max-width: 88vw; text-align: center;
  box-shadow: var(--shadow);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Accessibility ---------- */
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ---------- Small screens ---------- */
@media (max-width: 380px) {
  .lyrics-body { font-size: 19px; padding-left: 16px; padding-right: 16px; }
  .field-row { grid-template-columns: 1fr; }
}

</style>

  /* ---------- Storage ---------- */
  var STORE_KEY = 'spss_songbook_v1';

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.songs)) return defaultState();
      var merged = Object.assign(defaultState(), parsed);
      // Deep-merge settings specifically, so a library saved before a new
      // setting existed (like readingMode) still gets that field's default
      // instead of losing it to a shallow overwrite.
      merged.settings = Object.assign(defaultState().settings, parsed.settings || {});
      return merged;
    } catch (e) {
      console.warn('Songbook: could not read saved library, starting fresh.', e);
      return defaultState();
    }
  }

  function getArtPalette(id) {
    for (var i = 0; i < ART_PALETTES.length; i++) if (ART_PALETTES[i].id === id) return ART_PALETTES[i];
    return null;
  }
  // Flip-through picker for art mode — the person pages through each look
  // by hand with a card-flip animation and previews it live; nothing is
  // committed to the saved theme until "Lock it in". Close reverts any
  // uncommitted preview back to whatever was actually saved.
  var artWheelIndex = -1;      // -1 = "Default" card, else index into ART_PALETTES
  var artWheelSavedIndex = -1; // index the modal opened with, for Close to revert to
  var artWheelFlipping = false;

  function indexForPaletteId(id) {
    if (!id) return -1;
    for (var i = 0; i < ART_PALETTES.length; i++) if (ART_PALETTES[i].id === id) return i;
    return -1;
  }

  function openArtWheel() {
    artWheelIndex = indexForPaletteId(state.settings.artPalette);
    artWheelSavedIndex = artWheelIndex;
    paintArtWheelCard(false);
    var modal = byId('art-wheel-modal');
    if (modal) modal.hidden = false;
  }

  function flipArtWheel(direction) {
    if (artWheelFlipping) return;
    var n = ART_PALETTES.length;
    if (artWheelIndex === -1) {
      artWheelIndex = direction > 0 ? 0 : n - 1;
    } else {
      artWheelIndex = (artWheelIndex + direction + n) % n;
    }
    paintArtWheelCard(true);
  }

  function paintArtWheelCard(animate) {
    var card = byId('art-wheel-flipcard');
    var nameEl = byId('art-wheel-name');
    var swatchesEl = byId('art-wheel-swatches');
    var p = artWheelIndex === -1 ? null : ART_PALETTES[artWheelIndex];

    function paint() {
      if (nameEl) nameEl.textContent = p ? p.label : 'Default';
      if (swatchesEl) {
        swatchesEl.innerHTML = p ?
          ('<span style="background:' + p.dark + '"></span>' +
           '<span style="background:' + p.accent + '"></span>' +
           '<span style="background:' + p.light + '"></span>') :
          '<span class="art-wheel-swatch-default"></span>';
      }
      previewArtPalette(p ? p.id : null);
    }

    if (!animate || !card) { paint(); return; }
    artWheelFlipping = true;
    card.classList.add('is-flipping');
    setTimeout(function () {
      paint();
      setTimeout(function () {
        card.classList.remove('is-flipping');
        artWheelFlipping = false;
      }, 140);
    }, 140);
  }

  function previewArtPalette(id) {
    applyArtPalette(id);
  }

  function lockArtPalette() {
    var p = artWheelIndex === -1 ? null : ART_PALETTES[artWheelIndex];
    state.settings.artPalette = p ? p.id : null;
    persist();
    artWheelSavedIndex = artWheelIndex;
    var modal = byId('art-wheel-modal');
    if (modal) modal.hidden = true;
    toast(p ? ('Look set to ' + p.label + '.') : 'Back to the default look.');
  }

  function clearArtPalette() {
    artWheelIndex = -1;
    state.settings.artPalette = null;
    persist();
    artWheelSavedIndex = -1;
    paintArtWheelCard(false);
    var modal = byId('art-wheel-modal');
    if (modal) modal.hidden = true;
    toast('Back to the default look.');
  }

  function closeArtWheel() {
    // Cancel: snap the live preview back to whatever was actually saved.
    artWheelIndex = artWheelSavedIndex;
    var p = artWheelIndex === -1 ? null : ART_PALETTES[artWheelIndex];
    applyArtPalette(p ? p.id : null);
    var modal = byId('art-wheel-modal');
    if (modal) modal.hidden = true;
  }

  function applyArtPalette(id) {
    var root = document.documentElement;
    if (!id) { root.style.removeProperty('--bg'); root.style.removeProperty('--bg-elevated');
      root.style.removeProperty('--text'); root.style.removeProperty('--text-dim');
      root.style.removeProperty('--green-bright'); root.style.removeProperty('--line');
      return; }
    var p = getArtPalette(id);
    if (!p) return;
    root.style.setProperty('--bg', p.dark);
    root.style.setProperty('--bg-elevated', p.dark);
    root.style.setProperty('--text', p.light);
    root.style.setProperty('--text-dim', p.light + 'a0');
    root.style.setProperty('--green-bright', p.accent);
    root.style.setProperty('--line', p.accent + '55');
  }

        e.preventDefault();
        stopPlayerLoop();
        goLibrary();
      });
    }
  }

  /* ---- Vertical fader (right-hand rail, big thumb-friendly drag target) ---- */
  function setupFader(initialPct) {
    var track = byId('fader-track');
    var fill = byId('fader-fill');
    var thumb = byId('fader-thumb');
    if (!track) return;

    var valueEl = byId('fader-value');
    function paint(pct) {
      pct = Math.max(0, Math.min(100, pct));
      fill.style.height = pct + '%';
      thumb.style.bottom = pct + '%';
      track.setAttribute('aria-valuenow', String(Math.round(pct)));
      if (valueEl) valueEl.textContent = String(Math.round(pct));
    }
    paint(initialPct);

    function pctFromClientY(clientY) {
      var rect = track.getBoundingClientRect();
      var rel = (rect.bottom - clientY) / rect.height; // bottom = 0%, top = 100%
      return Math.max(0, Math.min(100, rel * 100));
    }

    function setFromClientY(clientY) {
      var pct = pctFromClientY(clientY);
      paint(pct);
      playerAnimState.speed = faderPctToSpeed(pct);
      state.settings.lastSpeed = playerAnimState.speed;
      persist();
    }

    var dragging = false;
    track.addEventListener('pointerdown', function (e) {
      dragging = true;
      track.setPointerCapture(e.pointerId);
      setFromClientY(e.clientY);
    });
    track.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setFromClientY(e.clientY);
    });
    track.addEventListener('pointerup', function () { dragging = false; });
    track.addEventListener('pointercancel', function () { dragging = false; });

    track.addEventListener('keydown', function (e) {
      var cur = Number(track.getAttribute('aria-valuenow')) || 0;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { cur = Math.min(100, cur + 4); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { cur = Math.max(0, cur - 4); }
      else return;
      e.preventDefault();
      paint(cur);
      playerAnimState.speed = faderPctToSpeed(cur);
      state.settings.lastSpeed = playerAnimState.speed;
      persist();
    });
  }

  function syncFaderVisual() {
    var track = byId('fader-track');
    if (!track) return;
    var pct = speedToFaderPct(playerAnimState.speed);
    var fill = byId('fader-fill');
    var thumb = byId('fader-thumb');
    var valueEl = byId('fader-value');
    if (fill) fill.style.height = pct + '%';
    if (thumb) thumb.style.bottom = pct + '%';
    if (valueEl) valueEl.textContent = String(Math.round(pct));
    track.setAttribute('aria-valuenow', String(Math.round(pct)));
  }

  function applyReadingMode() {
    var viewport = byId('lyrics-viewport');
    if (!viewport) return;
    var mode = getReadingMode(state.settings.readingMode);
    viewport.style.background = mode.bg;
    viewport.style.color = mode.fg;
    var chordEls = viewport.querySelectorAll('.chord');
    for (var i = 0; i < chordEls.length; i++) chordEls[i].style.color = mode.accent;
  }

  // Text size for the lyrics reading pane — a persisted setting, adjustable
  // from the reading-colors picker with plain A-/A+ buttons.
  var LYRICS_FONT_MIN = 14;
  var LYRICS_FONT_MAX = 34;
  function applyFontSize() {
    var body = byId('lyrics-body');
    if (!body) return;
    var size = state.settings.lyricsFontSize || 21;
    body.style.fontSize = size + 'px';
  }
  function adjustFontSize(delta) {
    var size = state.settings.lyricsFontSize || 21;
    size = Math.max(LYRICS_FONT_MIN, Math.min(LYRICS_FONT_MAX, size + delta));
    state.settings.lyricsFontSize = size;
    persist();
    applyFontSize();
  }

  // Re-renders just the lyrics body in place (layout mode changes the
  // markup structure itself, not just a style), then reapplies the
  // reading-color and font-size settings on top of the fresh markup.
  function refreshLyricsBody() {
    var s = findSong(view.songId);
    var bodyEl = byId('lyrics-body');
    if (!s || !bodyEl) return;
    bodyEl.innerHTML = renderLyricsBody(s.lyrics);
    applyReadingMode();
    applyFontSize();
  }
  function paintChordLayoutButton() {
    var left = state.settings.chordLayout === 'left';
    var label = left ? 'Switch to standard chord layout' : 'Switch to Sour Paint Studios left-chord layout';
    var btn = byId('chord-layout-btn');
    if (btn) {
      btn.textContent = left ? 'SPS Layout' : 'Standard';
      btn.setAttribute('title', label);
      btn.setAttribute('aria-label', label);
    }
    var topBtn = byId('chord-layout-btn-top');
    if (topBtn) {
      topBtn.textContent = left ? 'SPS' : 'STD';
      topBtn.setAttribute('title', label);
      topBtn.setAttribute('aria-label', label);
      topBtn.classList.toggle('btn-layout-top-active', left);
    }
  }

  // Quick one-tap invert for the reading pane only — separate from the
  // 5-swatch picker, for a plain "flip it light or dark" control.
  function isLightReadingMode(mode) {
    var hex = mode.bg.replace('#', '');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5;
  }
  function toggleReadingInvert() {
    var goLight = !isLightReadingMode(getReadingMode(state.settings.readingMode));
    state.settings.readingMode = goLight ? 'stage-light' : 'stage-dark';
    persist();
    applyReadingMode();
    paintInvertButton();
  }
  function paintInvertButton() {
    var btn = byId('invert-btn');
    if (!btn) return;
    var light = isLightReadingMode(getReadingMode(state.settings.readingMode));
    btn.innerHTML = light ? moonSvg() : sunSvg();
    var label = light ? 'Switch to dark reading' : 'Switch to light reading';
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
  }

  function speedToFaderPct(speed) {
    var r = Math.max(0.5, Math.min(80, speed));
    var pct = Math.pow((r - 0.5) / 79.5, 0.625);
    return Math.max(0, Math.min(100, pct * 100));
  }
  function faderPctToSpeed(pct) {
    var r = pct / 100;
    return 0.5 + Math.pow(r, 1.6) * 79.5;
  }

  function renderLyricsBody(lyrics) {
    var text = String(lyrics || '').trim();
    if (!text) {
      return '<p class="lyrics-empty">No lyrics saved for this song yet. Tap the pencil above to add them.</p>';
    }
    var leftLayout = state.settings.chordLayout === 'left';
    var blocks = text.split(/\n\s*\n/);
    return blocks.map(function (block) {
      var rawLines = block.split(/\r?\n/);
      var html = '';
      for (var i = 0; i < rawLines.length; i++) {
        var line = rawLines[i];
        var next = rawLines[i + 1];
        // Sour Paint Studios layout: a line that's nothing but chord tag(s)
        // — a cue, not something to sing — sits to the left of the lyric
        // line it leads into, instead of stacked above it. Only kicks in
        // when there's an actual lyric line right after it to pair with;
        // anything else (a lone chord line at a block's end, back-to-back
        // chord lines, etc.) falls back to the normal stacked rendering,
        // so nothing is ever dropped or misread.
        if (leftLayout && isChordOnlyLine(line) && next != null && next.trim() !== '' && !isChordOnlyLine(next)) {
          html += '<div class="lyric-cue-row">' +
            '<span class="lyric-cue-chord">' + formatChordLine(line) + '</span>' +
            '<span class="lyric-cue-line">' + formatChordLine(next) + '</span>' +
          '</div>';
          i++; // consumed the paired lyric line too
        } else {
          html += '<span class="lyric-line">' + formatChordLine(line) + '</span>';
        }
      }
      return '<div class="lyric-section">' + html + '</div>';
    }).join('');
  }

  // A "chord-only" line: strip every [Chord] tag out of it and nothing but
  // whitespace is left, and there was at least one tag to strip (an empty
  // blank line is not a chord line).
  function isChordOnlyLine(line) {
    var str = String(line || '');
    if (!/\[([^\[\]]{1,12})\]/.test(str)) return false;
    return str.replace(/\[([^\[\]]{1,12})\]/g, '').trim() === '';
  }

  function formatChordLine(line) {
    var escaped = escapeHtml(line);
    // Wrap bracketed chords like [G] or [C9] in a styled tag for legibility.
    return escaped.replace(/\[([^\[\]]{1,12})\]/g, '<span class="chord">$1</span>');
  }

  // Pasted chord sheets (from tab sites, PDFs, etc.) almost never carry this
  // app's own [G]-bracket syntax — they just print the chord names on their
  // own line, plain. On save, any line made up ENTIRELY of chord-shaped
  // tokens (and nothing else — no lyric words) gets each token wrapped in
  // brackets automatically, so it's recognized as a chord line by both the
  // green chord styling and the Sour Paint Studios left-of-line layout.
  // Deliberately narrow: every single token on the line must look like a
  // chord (root note A-G, optional # or b, optional quality/number, optional
  // /bass-note) or the line is left completely untouched — no guessing at
  // mixed lines, and a line that already has [brackets] in it is skipped so
  // this never double-tags anything.
  var CHORD_TOKEN_RE = /^[A-G](?:#|b)?(?:maj|min|sus|add|dim|aug|M|m)?\d{0,2}(?:\/[A-G](?:#|b)?)?$/;
  function autoTagChordLines(text) {
    var lines = String(text || '').split(/\r?\n/);
    var taggedCount = 0;
    var out = lines.map(function (line) {
      if (line.indexOf('[') !== -1 || line.indexOf(']') !== -1) return line;
      var trimmed = line.trim();
      if (!trimmed) return line;
      var tokens = trimmed.split(/\s+/);
      if (tokens.length > 8) return line;
      var allChords = tokens.every(function (t) { return CHORD_TOKEN_RE.test(t); });
      if (!allChords) return line;
      taggedCount++;
      var leadingWs = line.match(/^\s*/)[0];
      return leadingWs + tokens.map(function (t) { return '[' + t + ']'; }).join(' ');
    });
    return { text: out.join('\n'), taggedCount: taggedCount };
  }

  /* ---- Tap tempo (single source of truth, feeds the same speed used by the fader) ---- */
  // Hold-to-ramp: press and hold to accelerate scroll speed from a slow
  // crawl; release to lock in that speed and start scrolling. The same
  // button then reads "stop" (tap to stop the scroll), then "reset" (tap
  // to zero the speed and return to the ready/hold state).
  var HOLD_RAMP_RATE = 20;   // px/second, added per second of hold
  var HOLD_MIN_SPEED = 0.5;
  var HOLD_MAX_SPEED = 80;

  function setupHoldButton() {
    var btn = byId('hold-btn');
    var fasterBtn = byId('faster-btn');
    var slowerBtn = byId('slower-btn');
    var resetBtn = byId('reset-btn');
    if (!btn) return;
    playerAnimState.holdStage = 'ready';
    paintHoldButton();

    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (playerAnimState.holdStage === 'ready') startHoldRamp(1);
      else if (playerAnimState.holdStage === 'scrolling') stopHoldScroll();
      else if (playerAnimState.holdStage === 'stopped') startHoldRamp(1);
    });
    btn.addEventListener('pointerup', function (e) {
      e.preventDefault();
      if (playerAnimState.holdRAF) finishHoldRamp();
    });
    btn.addEventListener('pointerleave', function (e) {
      if (playerAnimState.holdRAF) finishHoldRamp();
    });

    if (fasterBtn) {
      fasterBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (playerAnimState.holdStage === 'stopped') startHoldRamp(1);
      });
      fasterBtn.addEventListener('pointerup', function (e) {
        e.preventDefault();
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
      fasterBtn.addEventListener('pointerleave', function () {
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
    }
    if (slowerBtn) {
      slowerBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (playerAnimState.holdStage === 'stopped') startHoldRamp(-1);
      });
      slowerBtn.addEventListener('pointerup', function (e) {
        e.preventDefault();
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
      slowerBtn.addEventListener('pointerleave', function () {
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
    }
    if (resetBtn) {
      resetBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        resetHoldSpeed();
      });
    }
  }

  function startHoldRamp(direction) {
    playerAnimState.holdStartTime = null;
    playerAnimState.holdStartSpeed = playerAnimState.speed;
    // Scroll live while held, in either direction, so the person can see
    // (not just feel via the fader) exactly how fast/slow it's going
    // before they let go and lock it in.
    if (!playerAnimState.isPlaying) togglePlay(true);
    function step(ts) {
      if (playerAnimState.holdStartTime == null) playerAnimState.holdStartTime = ts;
      var elapsed = (ts - playerAnimState.holdStartTime) / 1000;
      var newSpeed = playerAnimState.holdStartSpeed + direction * HOLD_RAMP_RATE * elapsed;
      playerAnimState.speed = Math.max(HOLD_MIN_SPEED, Math.min(HOLD_MAX_SPEED, newSpeed));
      state.settings.lastSpeed = playerAnimState.speed;
      syncFaderVisual();
      playerAnimState.holdRAF = requestAnimationFrame(step);
    }
    playerAnimState.holdRAF = requestAnimationFrame(step);
  }

  function finishHoldRamp() {
    if (playerAnimState.holdRAF) cancelAnimationFrame(playerAnimState.holdRAF);
    playerAnimState.holdRAF = null;
    persist();
    playerAnimState.holdStage = 'scrolling';
    paintHoldButton();
    if (!playerAnimState.isPlaying) togglePlay(true);
  }

  function stopHoldScroll() {
    if (playerAnimState.isPlaying) togglePlay(false);
    playerAnimState.holdStage = 'stopped';
    paintHoldButton();
  }

  function resetHoldSpeed() {
    if (playerAnimState.isPlaying) togglePlay(false);
    playerAnimState.speed = 4;
    state.settings.lastSpeed = playerAnimState.speed;
    persist();
    syncFaderVisual();
    playerAnimState.holdStage = 'ready';
    paintHoldButton();
  }

  function paintHoldButton() {
    var btn = byId('hold-btn');
    var text = byId('hold-text');
    var icon = byId('hold-icon');
    var hint = byId('hold-hint');
    var rampRow = byId('ramp-row');
    if (!btn) return;
    btn.setAttribute('data-status', playerAnimState.holdStage);
    if (playerAnimState.holdStage === 'ready') {
      text.textContent = 'HOLD TO RAMP';
      icon.innerHTML = holdSvg();
      if (hint) hint.hidden = false;
    } else if (playerAnimState.holdStage === 'scrolling') {
      text.textContent = 'STOP';
      icon.innerHTML = stopSvg();
      if (hint) hint.hidden = true;
    } else {
      text.textContent = 'RESUME';
      icon.innerHTML = holdSvg();
      if (hint) hint.hidden = true;
    }
    if (rampRow) rampRow.hidden = playerAnimState.holdStage !== 'stopped';
  }

  function handleTap() {
    var now = Date.now();
    var taps = playerAnimState.taps;
    var last = taps[taps.length - 1];
    var gap = last ? now - last : Infinity;

    // Tap doubles as the stop control: a single tap while already scrolling
    // stops playback outright, rather than being read as a new tempo. Start
    // a fresh tempo read with the next tap after that, same as from idle.
    if (playerAnimState.isPlaying && (taps.length === 0 || gap > 3000)) {
      stopHoldScroll();
      playerAnimState.taps = [];
      setTapStatus('idle');
      return;
    }

    // Generous window: pausing briefly between taps (e.g. a rest in the song)
    // no longer wipes progress the way the old build did — only a long pause resets it.
    if (taps.length === 0 || gap > 3000) {
      playerAnimState.taps = [now];
      setTapStatus('waiting');
      clearTimeout(playerAnimState.tapTimeout);
      playerAnimState.tapTimeout = setTimeout(function () {
        playerAnimState.taps = [];
        setTapStatus('idle');
      }, 3200);
      return;
    }

    taps.push(now);
    if (taps.length > 8) taps.shift();

    var gaps = [];
    for (var i = 1; i < taps.length; i++) gaps.push(taps[i] - taps[i - 1]);
    // Clamp rather than discard — a burst tapped faster than the 200ms
    // floor should still register (as the fastest supported tempo) instead
    // of silently doing nothing, which read as the control being broken.
    gaps = gaps.map(function (g) { return Math.max(200, Math.min(2000, g)); });
    if (gaps.length === 0) { setTapStatus('waiting'); return; }

    // Weighted average — most recent gaps count more, same shape as before,
    // just applied to however many taps we actually have (2 through 7 gaps).
    var weightsAll = [0.04, 0.06, 0.10, 0.14, 0.18, 0.22, 0.26];
    var weights = weightsAll.slice(weightsAll.length - gaps.length);
    var wsum = weights.reduce(function (a, b) { return a + b; }, 0);
    weights = weights.map(function (w) { return w / wsum; });
    var avgGap = 0;
    for (var j = 0; j < gaps.length; j++) avgGap += gaps[j] * weights[j];

    var bpm = Math.round(60000 / avgGap);
    playerAnimState.tapBpm = bpm;

    var newSpeed = 16 / (avgGap / 1000);
    newSpeed = Math.max(0.5, Math.min(80, newSpeed));
    playerAnimState.speed = newSpeed;
    state.settings.lastSpeed = newSpeed;
    persist();
    syncFaderVisual();

    setTapStatus('success', bpm);
    clearTimeout(playerAnimState.tapTimeout);
    playerAnimState.tapTimeout = setTimeout(function () { setTapStatus('waiting'); }, 550);

    // First successful tempo read starts playback automatically, same
    // convenience as before, but only fires once (checked via isPlaying).
    if (!playerAnimState.isPlaying) {
      togglePlay(true);
      playerAnimState.holdStage = 'scrolling';
      paintHoldButton();
    }
  }

  function setTapStatus(statusName, bpm) {
    playerAnimState.tapStatus = statusName;
    var btn = byId('tap-btn');
    var txt = byId('tap-text');
    if (!btn || !txt) return;
    btn.setAttribute('data-status', statusName);
    if (statusName === 'idle') txt.textContent = 'TAP TEMPO';
    else if (statusName === 'waiting') txt.textContent = 'tap again\u2026';
    else if (statusName === 'success') txt.textContent = (bpm || playerAnimState.tapBpm) + ' BPM';
  }

  /* ---- Play / scroll loop (unified — no separate "fit" mode to fight with) ---- */
  function togglePlay(forceOn) {
    var turningOn = forceOn === true ? true : !playerAnimState.isPlaying;
    playerAnimState.isPlaying = turningOn;
    if (turningOn) startPlayerLoop(); else stopPlayerLoop();
  }

  function startPlayerLoop() {
    stopPlayerLoop();
    playerAnimState.lastFrameTime = null;
    playerAnimState.accum = 0;
    var viewport = byId('lyrics-viewport');
    function step(ts) {
      if (!playerAnimState.isPlaying) return;
      if (playerAnimState.lastFrameTime == null) playerAnimState.lastFrameTime = ts;
      var dt = Math.min(100, ts - playerAnimState.lastFrameTime) / 1000;
      playerAnimState.lastFrameTime = ts;
      playerAnimState.accum += playerAnimState.speed * dt;
      if (playerAnimState.accum >= 0.15 && viewport) {
        viewport.scrollTop += playerAnimState.accum;
        playerAnimState.accum = 0;
        // Reaching the bottom pauses playback rather than idling forever —
        // the old build kept "scrolling" at speed with nothing left to move.
        if (viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 2) {
          stopHoldScroll();
          return;
        }
      }
      playerRAF = requestAnimationFrame(step);
    }
    playerRAF = requestAnimationFrame(step);
  }
  function stopPlayerLoop() {
    if (playerRAF) cancelAnimationFrame(playerRAF);
    playerRAF = null;
  }

  /* ============================================================

      '<ellipse cx="13.6" cy="6.4" rx="1.15" ry="1.15" fill="#D4FF3F"/>' +
      '<ellipse cx="15.9" cy="8.9" rx="1.15" ry="1.15" fill="#E23FD6"/>',

    );
  }
  function holdSvg() { return svg('<path d="M12 3v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 9l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="16" width="14" height="5" rx="2.5" stroke="currentColor" stroke-width="1.8"/>', 22); }
  function fasterSvg() { return svg('<path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>', 18); }
  function slowerSvg() { return svg('<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>', 18); }
  function stopSvg() { return svg('<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>', 20); }
  function resetSvg() { return svg('<path d="M4 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 15a8 8 0 1 0 2-8.5L4 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>', 20); }
  function playSvg() { return svg('<path d="M7 5.5v13l11-6.5-11-6.5z" fill="currentColor"/>', 20); }
  function pauseSvg() { return svg('<rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/>', 20); }
  function dripSvg(size) {
    return svg(
      '<path d="M12 3c3 4 6.5 8.2 6.5 12A6.5 6.5 0 015 15c0-3.8 3.5-8 7-12z" fill="none" stroke="currentColor" stroke-width="1.4"/>' +
      '<circle cx="12" cy="20.5" r="1.1" fill="currentColor"/>',
      size
    );
  }

  /* ============================================================
     MAIN RENDER DISPATCH
     ============================================================ */
  function render() {
    applyTheme();
    if (view.name === 'editor') renderEditor();
    else if (view.name === 'player') renderPlayer();
    else renderLibrary();
  }

  /* ---------- Global click delegation ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (action === 'new-song') { openEditorDraft(null); goEditor(null); }
    else if (action === 'open-song') { goPlayer(id); }
    else if (action === 'edit-song') { openEditorDraft(id); goEditor(id); }
    else if (action === 'delete-song') { deleteSong(id); }
    else if (action === 'editor-cancel') { editorDraft = null; goLibrary(); }
    else if (action === 'editor-save') { saveEditor(); }
    else if (action === 'player-back') { stopPlayerLoop(); goLibrary(); }
    else if (action === 'remove-photo') { editorDraft.image = null; renderEditor(); }
    else if (action === 'shop-prompt') {
      var shopModal = byId('shop-modal');
      if (shopModal) shopModal.hidden = false;
    }
    else if (action === 'shop-prompt-close') {
      var shopModal2 = byId('shop-modal');
      if (shopModal2) shopModal2.hidden = true;
    }
    else if (action === 'open-art-wheel') { openArtWheel(); }
    else if (action === 'art-wheel-close') { closeArtWheel(); }
    else if (action === 'art-wheel-prev') { flipArtWheel(-1); }
    else if (action === 'art-wheel-next') { flipArtWheel(1); }
    else if (action === 'art-wheel-lock') { lockArtPalette(); }
    else if (action === 'art-wheel-clear') { clearArtPalette(); }
    else if (action === 'toggle-reading-picker') {
      var picker = byId('reading-picker');
      if (picker) picker.hidden = !picker.hidden;
    }
    else if (action === 'toggle-reading-invert') {
      toggleReadingInvert();
    }
    else if (action === 'dec-font-size') { adjustFontSize(-2); }
    else if (action === 'inc-font-size') { adjustFontSize(2); }
    else if (action === 'toggle-chord-layout') {
      state.settings.chordLayout = (state.settings.chordLayout === 'left') ? 'standard' : 'left';
      persist();
      refreshLyricsBody();
      paintChordLayoutButton();
    }
    else if (action === 'set-reading-mode') {
      var modeId = el.getAttribute('data-mode');
      state.settings.readingMode = modeId;
      persist();
      applyReadingMode();
      paintInvertButton();
      var pk = byId('reading-picker');
      if (pk) pk.hidden = true;
    }
  });

  /* ---------- Splash, then boot ---------- */
  function boot() {
    applyTheme();
    render();
  }

  var splash = document.getElementById('splash');
  setTimeout(function () {
    splash.classList.add('splash-out');
    setTimeout(function () { splash.remove(); }, 550);
  }, 1500);
  boot();

})();


</script>
</body>
</html>
