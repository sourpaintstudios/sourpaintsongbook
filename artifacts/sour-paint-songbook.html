  /* ---- Vertical fader: this IS the BPM. Top = 240, bottom = 30. ---- */
  var BPM_MIN = 30;
  var BPM_MAX = 240;

  function bpmToFaderPct(bpm) {
    bpm = Math.max(BPM_MIN, Math.min(BPM_MAX, Number(bpm) || BPM_MIN));
    return (bpm - BPM_MIN) / (BPM_MAX - BPM_MIN) * 100;
  }
  function faderPctToBpm(pct) {
    pct = Math.max(0, Math.min(100, Number(pct) || 0));
    return Math.round(BPM_MIN + (pct / 100) * (BPM_MAX - BPM_MIN));
  }

  function paintFaderFromBpm(bpm) {
    bpm = Math.round(Math.max(BPM_MIN, Math.min(BPM_MAX, Number(bpm) || 0)));
    var pct = bpmToFaderPct(bpm);
    var track = byId('fader-track');
    var fill = byId('fader-fill');
    var thumb = byId('fader-thumb');
    var valueEl = byId('bpm-input');
    if (fill) fill.style.height = pct + '%';
    if (thumb) thumb.style.bottom = pct + '%';
    if (track) {
      track.setAttribute('aria-valuenow', String(bpm));
      track.setAttribute('aria-valuetext', bpm + ' BPM');
    }
    if (valueEl && document.activeElement !== valueEl) valueEl.value = String(bpm);
  }

  function setupFader() {
    var track = byId('fader-track');
    var fill = byId('fader-fill');
    var thumb = byId('fader-thumb');
    if (!track || !fill || !thumb) return;

    paintFaderFromBpm(speedToBpm(playerAnimState.speed));

    function pctFromClientY(clientY) {
      var rect = track.getBoundingClientRect();
      var rel = (rect.bottom - clientY) / rect.height;
      return Math.max(0, Math.min(100, rel * 100));
    }

    function setFromClientY(clientY) {
      applyBpm(faderPctToBpm(pctFromClientY(clientY)), { fromFader: true });
    }

    var dragging = false;
    track.addEventListener('pointerdown', function (e) {
      var input = byId('bpm-input');
      if (input && document.activeElement === input) input.blur();
      dragging = true;
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
      setFromClientY(e.clientY);
    });
    track.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      setFromClientY(e.clientY);
    });
    track.addEventListener('pointerup', function () { dragging = false; });
    track.addEventListener('pointercancel', function () { dragging = false; });

    track.addEventListener('keydown', function (e) {
      var bpm = speedToBpm(playerAnimState.speed);
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') bpm = Math.min(BPM_MAX, bpm + 4);
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') bpm = Math.max(BPM_MIN, bpm - 4);
      else return;
      e.preventDefault();
      applyBpm(bpm, { fromFader: true });
    });
  }

  function syncFaderVisual() {
    paintFaderFromBpm(speedToBpm(playerAnimState.speed));
  }

  function speedToBpm(speed) {
    return Math.round(Math.max(BPM_MIN, Math.min(BPM_MAX, (Number(speed) || 0) * 60 / 16)));
  }
  function bpmToSpeed(bpm) {
    return 16 * Math.max(BPM_MIN, Math.min(BPM_MAX, Number(bpm) || 120)) / 60;
  }
  function applyBpm(bpm, opts) {
    bpm = Math.round(Math.max(BPM_MIN, Math.min(BPM_MAX, Number(bpm) || 0)));
    if (!bpm) return;
    playerAnimState.tapBpm = bpm;
    playerAnimState.speed = bpmToSpeed(bpm);
    state.settings.lastSpeed = playerAnimState.speed;
    persist();
    paintFaderFromBpm(bpm);
    setTapStatus('success', bpm);
  }
  function setupBpmInput() {
    var input = byId('bpm-input');
    if (!input) return;
    function commit() {
      var bpm = parseInt(input.value, 10);
      if (!isFinite(bpm)) {
        input.value = String(speedToBpm(playerAnimState.speed));
        return;
      }
      applyBpm(bpm);
      input.value = String(playerAnimState.tapBpm);
    }
    input.addEventListener('input', function () {
      var bpm = parseInt(input.value, 10);
      if (!isFinite(bpm)) return;
      bpm = Math.max(BPM_MIN, Math.min(BPM_MAX, bpm));
      playerAnimState.tapBpm = bpm;
      playerAnimState.speed = bpmToSpeed(bpm);
      state.settings.lastSpeed = playerAnimState.speed;
      var pct = bpmToFaderPct(bpm);
      var fill = byId('fader-fill');
      var thumb = byId('fader-thumb');
      var track = byId('fader-track');
      if (fill) fill.style.height = pct + '%';
      if (thumb) thumb.style.bottom = pct + '%';
      if (track) track.setAttribute('aria-valuenow', String(bpm));
    });
    input.addEventListener('change', commit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  }

  function applyReadingMode() {
    var viewport = byId('lyrics-viewport');
    if (!viewport) return;
    var mode = getReadingMode(state.settings.readingMode);
    viewport.style.background = mode.bg;
    viewport.style.color = mode.fg;
    var chordEls = viewport.querySelectorAll('.chord');
    for (var i = 0; i < chordEls.length; i++) chordEls[i].style.color = mode.accent;
  }

  // Text size for the lyrics reading pane — a persisted setting, adjustable
  // from the reading-colors picker with plain A-/A+ buttons.
  var LYRICS_FONT_MIN = 8;
  var LYRICS_FONT_MAX = 64;
  function applyFontSize() {
    var body = byId('lyrics-body');
    if (!body) return;
    var size = state.settings.lyricsFontSize || 21;
    size = Math.max(LYRICS_FONT_MIN, Math.min(LYRICS_FONT_MAX, size));
    body.style.fontSize = size + 'px';
    var read = byId('font-size-read');
    if (read) read.textContent = String(size);
  }
  function widestLyricLine() {
    var body = byId('lyrics-body');
    if (!body) return 0;
    var nodes = body.querySelectorAll('.lyric-line, .lyric-cue-row');
    var max = 0;
    for (var i = 0; i < nodes.length; i++) {
      if (!(nodes[i].textContent || '').trim()) continue;
      max = Math.max(max, nodes[i].scrollWidth);
    }
    return max;
  }
  function fitLinesToScreen() {
    if (!state.settings.fitScreen) return;
    var viewport = byId('lyrics-viewport');
    var body = byId('lyrics-body');
    if (!viewport || !body) return;
    var available = viewport.clientWidth - 16;
    if (available < 40) return;
    var size = state.settings.lyricsFontSize || 21;
    body.style.fontSize = size + 'px';
    var wide = widestLyricLine();
    if (!wide) return;
    var next = Math.round(size * (available / wide));
    next = Math.max(LYRICS_FONT_MIN, Math.min(LYRICS_FONT_MAX, next));
    state.settings.lyricsFontSize = next;
    body.style.fontSize = next + 'px';
    wide = widestLyricLine();
    if (wide > available + 1 && next > LYRICS_FONT_MIN) {
      next = Math.max(LYRICS_FONT_MIN, Math.floor(next * available / wide));
      state.settings.lyricsFontSize = next;
    }
    applyFontSize();
    persist();
  }
  function adjustFontSize(delta) {
    var size = state.settings.lyricsFontSize || 21;
    size = Math.max(LYRICS_FONT_MIN, Math.min(LYRICS_FONT_MAX, size + delta));
    state.settings.lyricsFontSize = size;
    persist();
    applyFontSize();
  }
  function applyPlayerModes() {
    var screen = document.querySelector('.screen-player');
    if (!screen) return;
    var glass = !!state.settings.glassChrome;
    var fit = !!state.settings.fitScreen;
    screen.classList.toggle('is-glass', glass);
    screen.classList.toggle('is-fit', fit);
    var glassBtn = byId('glass-btn');
    if (glassBtn) glassBtn.classList.toggle('is-on', glass);
    var fitBtn = byId('fit-btn');
    if (fitBtn) fitBtn.classList.toggle('is-on', fit);
  }
  function toggleGlassChrome() {
    state.settings.glassChrome = !state.settings.glassChrome;
    persistNow();
    applyPlayerModes();
  }
  function exitFitStayOnSong() {
    if (!state.settings.fitScreen) return false;
    state.settings.fitScreen = false;
    if (state.settings.fontBeforeFit) state.settings.lyricsFontSize = state.settings.fontBeforeFit;
    persistNow();
    applyPlayerModes();
    applyFontSize();
    return true;
  }
  function toggleFitScreen() {
    state.settings.fitScreen = !state.settings.fitScreen;
    if (state.settings.fitScreen) state.settings.fontBeforeFit = state.settings.lyricsFontSize || 21;
    else if (state.settings.fontBeforeFit) state.settings.lyricsFontSize = state.settings.fontBeforeFit;
    persistNow();
    applyPlayerModes();
    applyFontSize();
    if (state.settings.fitScreen) requestAnimationFrame(fitLinesToScreen);
  }

  // Re-renders just the lyrics body in place (layout mode changes the
  // markup structure itself, not just a style), then reapplies the
  // reading-color and font-size settings on top of the fresh markup.
  function refreshLyricsBody() {
    var s = findSong(view.songId);
    var bodyEl = byId('lyrics-body');
    if (!s || !bodyEl) return;
    bodyEl.innerHTML = renderLyricsBody(s.lyrics);
    applyReadingMode();
    applyFontSize();
    applySongSkin(s);
    if (state.settings.fitScreen) requestAnimationFrame(fitLinesToScreen);
  }
  function paintChordLayoutButton() {
    var left = state.settings.chordLayout === 'left';
    var label = left ? 'Switch to standard chord layout' : 'Switch to Sour Paint Studios left-chord layout';
    var btn = byId('chord-layout-btn');
    if (btn) {
      btn.textContent = left ? 'SPS Layout' : 'Standard';
      btn.setAttribute('title', label);
      btn.setAttribute('aria-label', label);
    }
    var topBtn = byId('chord-layout-btn-top');
    if (topBtn) {
      topBtn.textContent = left ? 'SPS' : 'STD';
      topBtn.setAttribute('title', label);
      topBtn.setAttribute('aria-label', label);
      topBtn.classList.toggle('btn-layout-top-active', left);
    }
  }

  // Quick one-tap invert for the reading pane only — separate from the
  // 5-swatch picker, for a plain "flip it light or dark" control.
  function isLightReadingMode(mode) {
    var hex = mode.bg.replace('#', '');
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5;
  }
  function toggleReadingInvert() {
    var goLight = !isLightReadingMode(getReadingMode(state.settings.readingMode));
    state.settings.readingMode = goLight ? 'stage-light' : 'stage-dark';
    persist();
    applyReadingMode();
    paintInvertButton();
  }
  function paintInvertButton() {
    var btn = byId('invert-btn');
    if (!btn) return;
    var light = isLightReadingMode(getReadingMode(state.settings.readingMode));
    btn.innerHTML = light ? moonSvg() : sunSvg();
    var label = light ? 'Switch to dark reading' : 'Switch to light reading';
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
  }

  function speedToFaderPct(speed) {
    var r = Math.max(0.5, Math.min(80, speed));
    var pct = Math.pow((r - 0.5) / 79.5, 0.625);
    return Math.max(0, Math.min(100, pct * 100));
  }
  function faderPctToSpeed(pct) {
    var r = pct / 100;
    return 0.5 + Math.pow(r, 1.6) * 79.5;
  }

  function renderLyricsBody(lyrics) {
    var text = prepareLyricsForLayout(String(lyrics || '')).trim();
    if (!text) {
      return '<p class="lyrics-empty">No lyrics saved for this song yet. Tap the pencil above to add them.</p>';
    }
    var leftLayout = state.settings.chordLayout === 'left';
    var blocks = text.split(/\n\s*\n/);
    return blocks.map(function (block) {
      var rawLines = block.split(/\r?\n/);
      var html = '';
      for (var i = 0; i < rawLines.length; i++) {
        var line = normalizeLyricLine(rawLines[i]);
        var next = rawLines[i + 1] != null ? normalizeLyricLine(rawLines[i + 1]) : null;
        if (leftLayout && isChordOnlyLine(line) && next != null && next.trim() !== '' && !isChordOnlyLine(next)) {
          html += '<div class="lyric-cue-row">' +
            '<span class="lyric-cue-chord">' + formatChordLine(line) + '</span>' +
            '<span class="lyric-cue-line">' + formatChordLine(next) + '</span>' +
          '</div>';
          i++;
        } else if (leftLayout) {
          var mixed = splitMixedBracketLine(line) || splitLeadingPlainChords(line);
          if (mixed) {
            html += '<div class="lyric-cue-row">' +
              '<span class="lyric-cue-chord">' + formatChordLine(mixed.chord) + '</span>' +
              '<span class="lyric-cue-line">' + formatChordLine(mixed.lyric) + '</span>' +
            '</div>';
          } else {
            html += '<span class="lyric-line">' + formatChordLine(line) + '</span>';
          }
        } else {
          html += '<span class="lyric-line">' + formatChordLine(line) + '</span>';
        }
      }
      return '<div class="lyric-section">' + html + '</div>';
    }).join('');
  }

  function normalizeLyricLine(line) {
    return String(line || '')
      .replace(/[\u200b\u200c\u200d\ufeff\u2060\u00ad]/g, '')
      .replace(/[\u00a0\u1680\u2000-\u200a\u202f\u205f\u3000]/g, ' ')
      .replace(/[\u2018\u2019]/g, "'")
      .replace(/[\u201c\u201d]/g, '"');
  }

  function chordTokensFromTagInner(inner) {
    return String(inner || '')
      .split(/[\|\/,]+/)
      .map(function (p) { return p.trim(); })
      .filter(Boolean);
  }

  function chordTagRe() {
    return /\[([^\[\]]{1,80})\]/g;
  }

  // Root + quality + optional numbers/extensions + optional /bass.
  // Deliberately wide enough for OCR (c7sus4, F#m7b5, Cadd9) without
  // swallowing lyric words.
  var CHORD_TOKEN_RE = /^[A-G](?:#|b)?(?:maj|min|dim|aug|sus|add|m|M)?(?:\d{1,2})?(?:sus\d?|add\d+|maj\d+|min\d+|m\d+|dim\d+)?(?:(?:#|b)\d{1,2})?(?:\/[A-G](?:#|b)?)?$/i;

  function normalizeChordToken(raw) {
    var t = String(raw || '').trim();
    t = t.replace(/[♯]/g, '#').replace(/[♭]/g, 'b');
    t = t.replace(/^[\[\(\{]+/, '').replace(/[\]\)\}.,;:]+$/, '');
    t = t.replace(/^[\[\(\{]+/, '').replace(/[\]\)\}]+$/, '');
    return t;
  }

  function looksLikeChord(token) {
    var t = normalizeChordToken(token);
    if (!t) return false;
    if (/^N\.?C\.?$/i.test(t)) return true;
    return CHORD_TOKEN_RE.test(t);
  }

  function splitGluedChords(token) {
    if (looksLikeChord(token)) return [normalizeChordToken(token)];
    var re = /[A-G](?:#|b)?(?:maj|min|dim|aug|sus|add|m|M)?(?:\d{1,2})?(?:sus\d?|add\d+|maj\d+|min\d+|m\d+|dim\d+)?(?:(?:#|b)\d{1,2})?(?:\/[A-G](?:#|b)?)?/gi;
    var hits = [];
    var m;
    var last = 0;
    var str = normalizeChordToken(token);
    while ((m = re.exec(str))) {
      if (m.index !== last) return [token];
      hits.push(m[0]);
      last = m.index + m[0].length;
    }
    if (hits.length > 1 && last === str.length) return hits;
    return [token];
  }

  function tokensFromChordLine(line) {
    var raw = normalizeLyricLine(line).trim().split(/\s+/);
    var merged = [];
    for (var i = 0; i < raw.length; i++) {
      var t = raw[i];
      if (/^[|│¦\-–—\/]+$/.test(t)) continue;
      if (merged.length && /^(?:\d{1,2}|sus\d?|add\d+|maj\d+|dim|aug|m)$/i.test(normalizeChordToken(t))) {
        merged[merged.length - 1] = merged[merged.length - 1] + normalizeChordToken(t);
      } else {
        merged.push(t);
      }
    }
    var expanded = [];
    for (var j = 0; j < merged.length; j++) {
      var parts = splitGluedChords(merged[j]);
      for (var k = 0; k < parts.length; k++) expanded.push(parts[k]);
    }
    return expanded;
  }

  function isChordOnlyLine(line) {
    var str = normalizeLyricLine(line).trim();
    if (!str) return false;
    var tags = [];
    str.replace(chordTagRe(), function (_, inner) {
      tags.push(inner);
      return '';
    });
    if (tags.length) {
      var leftover = str.replace(chordTagRe(), '').replace(/[\u200b\u200c\u200d\ufeff]/g, '').trim();
      if (leftover !== '') return false;
      var all = [];
      for (var i = 0; i < tags.length; i++) {
        var parts = chordTokensFromTagInner(tags[i]);
        if (!parts.length) return false;
        for (var p = 0; p < parts.length; p++) all.push(parts[p]);
      }
      return all.length > 0 && all.every(looksLikeChord);
    }
    var tokens = tokensFromChordLine(str);
    if (!tokens.length || tokens.length > 12) return false;
    return tokens.every(looksLikeChord);
  }

  function formatChordLine(line) {
    var str = normalizeLyricLine(line);
    if (isChordOnlyLine(str)) {
      var tokens = [];
      if (str.indexOf('[') !== -1) {
        str.replace(chordTagRe(), function (_, inner) {
          var parts = chordTokensFromTagInner(inner);
          for (var i = 0; i < parts.length; i++) {
            if (looksLikeChord(parts[i])) tokens.push(normalizeChordToken(parts[i]));
          }
          return '';
        });
      } else {
        tokens = tokensFromChordLine(str);
      }
      if (tokens.length) {
        return tokens.map(function (t) {
          return '<span class="chord">' + escapeHtml(t) + '</span>';
        }).join(' ');
      }
    }
    return escapeHtml(str).replace(chordTagRe(), function (_, inner) {
      var parts = chordTokensFromTagInner(inner).filter(looksLikeChord);
      if (parts.length) {
        return parts.map(function (t) {
          return '<span class="chord">' + escapeHtml(normalizeChordToken(t)) + '</span>';
        }).join(' ');
      }
      return '<span class="chord">' + escapeHtml(String(inner).trim()) + '</span>';
    });
  }

  function autoTagChordLines(text) {
    var lines = String(text || '').split(/\r?\n/);
    var taggedCount = 0;
    var out = lines.map(function (line) {
      var normalized = normalizeLyricLine(line);
      if (!normalized.trim()) return line;
      if (!isChordOnlyLine(normalized)) return line;
      if (normalized.indexOf('[') !== -1) return line;
      var leadingWs = normalized.match(/^\s*/)[0];
      taggedCount++;
      return leadingWs + tokensFromChordLine(normalized).map(function (t) { return '[' + t + ']'; }).join(' ');
    });
    return { text: out.join('\n'), taggedCount: taggedCount };
  }

  // Song B in the reference demo: "[G] I can't begin to sleep" — chord and
  // lyric share a line, so SPS has nothing to pair. Split that into Song A
  // form (chord-only line, then lyric line) so the STD/SPS toggle can move it.
  function isTrivialRoot(token) {
    return /^[A-G](?:#|b)?$/i.test(normalizeChordToken(token));
  }

  function splitLeadingPlainChords(line) {
    if (line.indexOf('[') !== -1) return null;
    var parts = String(line).split(/[ \t]{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (parts.length >= 2 && !parts.every(isChordOnlyLine)) {
      var chordParts = [];
      var lyricParts = [];
      var seenLyric = false;
      for (var p = 0; p < parts.length; p++) {
        if (!seenLyric && isChordOnlyLine(parts[p])) chordParts.push(parts[p]);
        else { seenLyric = true; lyricParts.push(parts[p]); }
      }
      if (chordParts.length && lyricParts.length && !isChordOnlyLine(lyricParts.join(' '))) {
        return { chord: chordParts.join(' '), lyric: lyricParts.join(' ') };
      }
    }
    var tokens = line.trim().split(/\s+/);
    if (tokens.length < 2) return null;
    var n = 0;
    while (n < tokens.length && looksLikeChord(tokens[n])) n++;
    if (n === 0 || n === tokens.length) return null;
    var lyric = tokens.slice(n).join(' ');
    if (!lyric || isChordOnlyLine(lyric)) return null;
    var chords = tokens.slice(0, n);
    if (n >= 2) return { chord: chords.join(' '), lyric: lyric };
    var only = normalizeChordToken(chords[0]);
    if (!isTrivialRoot(only)) return { chord: chords[0], lyric: lyric };
    if (/^[BCDEFG](?:#|b)?$/i.test(only)) return { chord: chords[0], lyric: lyric };
    return null;
  }

  function splitMixedBracketLine(line) {
    var chords = [];
    var lyric = String(line).replace(chordTagRe(), function (all, inner) {
      var parts = chordTokensFromTagInner(inner).filter(looksLikeChord);
      if (parts.length) {
        for (var i = 0; i < parts.length; i++) chords.push(parts[i]);
        return ' ';
      }
      return all;
    }).replace(/[ \t]+/g, ' ').trim();
    if (!chords.length || !lyric || isChordOnlyLine(lyric)) return null;
    return { chord: chords.map(function (c) { return '[' + c + ']'; }).join(' '), lyric: lyric };
  }

  function splitInlineChordLyrics(text) {
    var lines = String(text || '').split(/\r?\n/);
    var out = [];
    var leadingTags = /^((?:\s*\[[^\[\]]{1,80}\])+)(?:\s+|(?=[\w"']))(.+)$/;
    for (var i = 0; i < lines.length; i++) {
      var line = normalizeLyricLine(lines[i]);
      if (!line.trim() || isChordOnlyLine(line)) {
        out.push(line);
        continue;
      }
      var m = line.match(leadingTags);
      if (m && m[2] && m[2].trim() && !isChordOnlyLine(m[2])) {
        out.push(m[1].trim());
        out.push(m[2].replace(/^\s+/, ''));
        continue;
      }
      var mixed = splitMixedBracketLine(line);
      if (mixed) {
        out.push(mixed.chord);
        out.push(mixed.lyric);
        continue;
      }
      var plain = splitLeadingPlainChords(line);
      if (plain) {
        out.push(plain.chord);
        out.push(plain.lyric);
        continue;
      }
      out.push(line);
    }
    return out.join('\n');
  }

  function prepareLyricsForLayout(text) {
    return splitInlineChordLyrics(autoTagChordLines(text).text);
  }

  /* ---- Tap tempo (single source of truth, feeds the same speed used by the fader) ---- */
  // Hold-to-ramp: press and hold to accelerate scroll speed from a slow
  // crawl; release to lock in that speed and start scrolling. The same
  // button then reads "stop" (tap to stop the scroll), then "reset" (tap
  // to zero the speed and return to the ready/hold state).
  var HOLD_RAMP_RATE = 20;   // px/second, added per second of hold
  var HOLD_MIN_SPEED = 0.5;
  var HOLD_MAX_SPEED = 80;

  var lastTouchStamp = 0;
  var lastTapStamp = 0;
  var holdWindowBound = false;
  var activeHoldId = null;

  function isUsablePointer(e) {
    if (!e) return false;
    if (e.isPrimary === false) return false;
    if (e.pointerType === 'mouse' && typeof e.button === 'number' && e.button > 0) return false;
    return true;
  }

  function cancelHoldRampLoop() {
    if (playerAnimState.holdRAF) {
      cancelAnimationFrame(playerAnimState.holdRAF);
      playerAnimState.holdRAF = null;
    }
  }

  function setupHoldButton() {
    var btn = byId('hold-btn');
    var fasterBtn = byId('faster-btn');
    var slowerBtn = byId('slower-btn');
    var resetBtn = byId('reset-btn');
    var topBtn = byId('top-btn');
    if (!btn) return;
    playerAnimState.holdStage = 'ready';
    paintHoldButton();

    function bindRampHold(el, direction) {
      if (!el) return;
      var holding = false;
      function down(e) {
        if (holding) return;
        if (e && e.pointerType && !isUsablePointer(e)) return;
        holding = true;
        if (e && e.preventDefault) e.preventDefault();
        activeHoldId = e && e.pointerId != null ? e.pointerId : 'touch';
        try { if (e && e.pointerId != null) el.setPointerCapture(e.pointerId); } catch (err) {}
        startHoldRamp(direction);
      }
      function up(e) {
        if (!holding) return;
        if (e && e.pointerId != null && activeHoldId != null && e.pointerId !== activeHoldId && e.pointerId !== 'touch') return;
        holding = false;
        activeHoldId = null;
        if (playerAnimState.holdRAF) finishHoldRamp();
      }
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('touchstart', down, { passive: false });
      el.addEventListener('touchend', up);
      el.addEventListener('touchcancel', up);
    }
    bindRampHold(fasterBtn, 1);
    bindRampHold(slowerBtn, -1);

    if (!holdWindowBound) {
      holdWindowBound = true;
      window.addEventListener('pointerup', function () {
        activeHoldId = null;
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
      window.addEventListener('pointercancel', function () {
        activeHoldId = null;
        if (playerAnimState.holdRAF) finishHoldRamp();
      });
    }
  }

  function startHoldRamp(direction) {
    cancelHoldRampLoop();
    playerAnimState.holdStartTime = null;
    playerAnimState.holdStartSpeed = playerAnimState.speed;
    if (!playerAnimState.isPlaying) togglePlay(true);
    function step(ts) {
      if (playerAnimState.holdStartTime == null) playerAnimState.holdStartTime = ts;
      var elapsed = (ts - playerAnimState.holdStartTime) / 1000;
      var newSpeed = playerAnimState.holdStartSpeed + direction * HOLD_RAMP_RATE * elapsed;
      playerAnimState.speed = Math.max(HOLD_MIN_SPEED, Math.min(HOLD_MAX_SPEED, newSpeed));
      state.settings.lastSpeed = playerAnimState.speed;
      playerAnimState.tapBpm = speedToBpm(playerAnimState.speed);
      syncFaderVisual();
      playerAnimState.holdRAF = requestAnimationFrame(step);
    }
    playerAnimState.holdRAF = requestAnimationFrame(step);
  }

  function finishHoldRamp() {
    cancelHoldRampLoop();
    persist();
    playerAnimState.holdStage = 'scrolling';
    if (!playerAnimState.isPlaying) togglePlay(true);
    // Wait until the finger is fully off so we don't drop STOP under it
    // and immediately halt the scroll we just locked in.
    setTimeout(paintHoldButton, 60);
  }

  function stopHoldScroll() {
    cancelHoldRampLoop();
    if (playerAnimState.isPlaying) togglePlay(false);
    playerAnimState.holdStage = 'stopped';
    paintHoldButton();
  }

  function resumeHoldScroll() {
    cancelHoldRampLoop();
    if (!playerAnimState.speed || playerAnimState.speed < 4) {
      playerAnimState.speed = state.settings.lastSpeed && state.settings.lastSpeed >= 4 ? state.settings.lastSpeed : 22;
    }
    playerAnimState.holdStage = 'scrolling';
    if (!playerAnimState.isPlaying) togglePlay(true);
    paintHoldButton();
  }

  function scrollLyricsToTop() {
    var viewport = byId('lyrics-viewport');
    var lyricBody = byId('lyrics-body');
    playerAnimState.scrollOffset = 0;
    if (viewport) viewport.scrollTop = 0;
    if (lyricBody) lyricBody.style.transform = '';
  }

  function resetHoldSpeed() {
    cancelHoldRampLoop();
    if (playerAnimState.isPlaying) togglePlay(false);
    applyBpm(120);
    playerAnimState.holdStage = 'stopped';
    paintHoldButton();
  }

  function paintHoldButton() {
    var btn = byId('hold-btn');
    var text = byId('hold-text');
    var icon = byId('hold-icon');
    var rampRow = byId('ramp-row');
    if (!btn) return;
    var playing = !!playerAnimState.isPlaying;
    btn.setAttribute('data-status', playing ? 'scrolling' : 'ready');
    btn.setAttribute('aria-label', playing ? 'Pause scroll' : 'Start scroll');

  }

  function handleTap() {
    var now = Date.now();
    if (now - lastTapStamp < 80) return;
    lastTapStamp = now;
    var taps = playerAnimState.taps;
    var last = taps[taps.length - 1];
    var gap = last ? now - last : Infinity;

    // Tap is tempo only — Stop is the hold button. A single tap while
    // scrolling used to halt playback, which made the beat-tap unusable.
    if (taps.length === 0 || gap > 3000) {
      playerAnimState.taps = [now];
      setTapStatus('waiting');
      clearTimeout(playerAnimState.tapTimeout);
      playerAnimState.tapTimeout = setTimeout(function () {
        playerAnimState.taps = [];
        setTapStatus('idle');
      }, 3200);
      return;
    }

    taps.push(now);
    if (taps.length > 8) taps.shift();

    var gaps = [];
    for (var i = 1; i < taps.length; i++) gaps.push(taps[i] - taps[i - 1]);
    // Clamp rather than discard — a burst tapped faster than the 200ms
    // floor should still register (as the fastest supported tempo) instead
    // of silently doing nothing, which read as the control being broken.
    gaps = gaps.map(function (g) { return Math.max(200, Math.min(2000, g)); });
    if (gaps.length === 0) { setTapStatus('waiting'); return; }

    // Weighted average — most recent gaps count more, same shape as before,
    // just applied to however many taps we actually have (2 through 7 gaps).
    var weightsAll = [0.04, 0.06, 0.10, 0.14, 0.18, 0.22, 0.26];
    var weights = weightsAll.slice(weightsAll.length - gaps.length);
    var wsum = weights.reduce(function (a, b) { return a + b; }, 0);
    weights = weights.map(function (w) { return w / wsum; });
    var avgGap = 0;
    for (var j = 0; j < gaps.length; j++) avgGap += gaps[j] * weights[j];

    var bpm = Math.round(60000 / avgGap);
    bpm = Math.max(BPM_MIN, Math.min(BPM_MAX, bpm));
    applyBpm(bpm);
    clearTimeout(playerAnimState.tapTimeout);
    playerAnimState.tapTimeout = setTimeout(function () {
      playerAnimState.taps = [];
    }, 3000);

    // First successful tempo read starts playback automatically, same
    // convenience as before, but only fires once (checked via isPlaying).
    if (!playerAnimState.isPlaying) {
      togglePlay(true);
      playerAnimState.holdStage = 'scrolling';
      paintHoldButton();
    }
  }

  function setTapStatus(statusName, bpm) {
    playerAnimState.tapStatus = statusName;
    var btn = byId('tap-btn');
    var txt = byId('tap-text');
    if (!btn || !txt) return;
    btn.setAttribute('data-status', statusName);
    if (statusName === 'idle') txt.textContent = 'TAP THE BEAT';
    else if (statusName === 'waiting') txt.textContent = 'keep tapping\u2026';
    else if (statusName === 'success') txt.textContent = (bpm || playerAnimState.tapBpm) + ' BPM';

  /* ---- Play / scroll loop (unified — no separate "fit" mode to fight with) ---- */
  function togglePlay(forceOn) {

  function startPlayerLoop() {
    stopPlayerLoop();

    var mode = 'scroll';
    function maxOffset() {
      if (!viewport || !lyricBody) return 0;
      return Math.max(0, lyricBody.offsetHeight - viewport.clientHeight);

      playerAnimState.lastFrameTime = ts;

      offset = Math.min(max, offset + Math.max(0.15, playerAnimState.speed) * dt);
      playerAnimState.scrollOffset = offset;

        return;

  /* ============================================================
     IMPORT: PDF.js (text PDFs) + Tesseract.js (photos / scans)
     Libraries load on first use so the rest of the app stays
     offline-capable on stage.
     ============================================================ */
  var IMPORT_PDF_JS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var IMPORT_PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var IMPORT_TESSERACT_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  var IMPORT_MAMMOTH_JS = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js';
  var importGen = 0;
  var importOcrWorker = null;
  var importOcrBroken = false;
  var importPdfReady = null;
  var importTessReady = null;
  var importMammothReady = null;

  function loadScriptOnce(src) {
    return new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-import-src="' + src + '"]');
      if (existing) {
        if (existing.getAttribute('data-loaded') === '1') resolve();
        else existing.addEventListener('load', function () { resolve(); });
        existing.addEventListener('error', function () { reject(new Error('Could not load ' + src)); });
        return;
      }
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.setAttribute('data-import-src', src);
      s.onload = function () { s.setAttribute('data-loaded', '1'); resolve(); };
      s.onerror = function () { reject(new Error('Could not load helper. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }

  function ensurePdfJs() {
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = IMPORT_PDF_WORKER;
      return Promise.resolve(window.pdfjsLib);
    }
    if (!importPdfReady) {
      importPdfReady = loadScriptOnce(IMPORT_PDF_JS).then(function () {
        if (!window.pdfjsLib) throw new Error('PDF reader did not start.');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = IMPORT_PDF_WORKER;
        return window.pdfjsLib;
      });
    }
    return importPdfReady;
  }

  function ensureTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (!importTessReady) importTessReady = loadScriptOnce(IMPORT_TESSERACT_JS).then(function () {
      if (!window.Tesseract) throw new Error('Image reader did not start.');
      return window.Tesseract;
    });
    return importTessReady;
  }

  function ensureMammoth() {
    if (window.mammoth) return Promise.resolve(window.mammoth);
    if (!importMammothReady) {
      importMammothReady = loadScriptOnce(IMPORT_MAMMOTH_JS).then(function () {
        if (!window.mammoth) throw new Error('Word reader did not start.');
        return window.mammoth;
      });
    }
    return importMammothReady;
  }

  function setImportProgress(pct) {
    var bar = byId('import-review-progress');
    var fill = byId('import-review-progress-fill');
    if (!bar || !fill) return;
    if (pct == null) { bar.hidden = true; return; }
    bar.hidden = false;
    fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  function setImportStatus(msg) {
    var el = byId('import-review-status');
    if (el) el.textContent = msg || '';
  }

  function openImportReviewBusy() {
    var modal = byId('import-review-modal');
    var ta = byId('import-review-text');
    var actions = byId('import-review-actions');
    var busyCancel = byId('import-review-busy-cancel');
    if (ta) { ta.hidden = true; ta.value = ''; }
    if (actions) actions.hidden = true;
    if (busyCancel) busyCancel.hidden = false;
    setImportProgress(8);
    setImportStatus('Reading your file…');
    if (modal) modal.hidden = false;
  }

  function showImportReviewText(text, note) {
    var ta = byId('import-review-text');
    var actions = byId('import-review-actions');
    var busyCancel = byId('import-review-busy-cancel');
    if (ta) {
      ta.hidden = false;
      ta.value = text || '';
    }
    if (actions) actions.hidden = false;
    if (busyCancel) busyCancel.hidden = true;
    setImportProgress(null);
    setImportStatus(note || 'Check line breaks and chords, then use this text.');
  }

  function closeImportReview() {
    importGen += 1;
    var modal = byId('import-review-modal');
    if (modal) modal.hidden = true;
    setImportProgress(null);
  }

  function closeImportMenu() {
    var menu = byId('import-menu');
    if (menu) menu.hidden = true;
  }

  function toggleImportMenu() {
    var menu = byId('import-menu');
    if (!menu) return;
    menu.hidden = !menu.hidden;
  }

  function isPdfFile(file) {
    return file && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''));
  }
  function isImageFile(file) {
    return file && (/^image\//.test(file.type || '') || /\.(png|jpe?g|gif|webp|heic|heif|bmp)$/i.test(file.name || ''));
  }
  function isDocxFile(file) {
    return file && (
      file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
      /\.docx$/i.test(file.name || '')

  }
  function isOldDocFile(file) {
    return file && (file.type === 'application/msword' || /\.doc$/i.test(file.name || '')) && !isDocxFile(file);
  }
  function isTextFile(file) {
    return file && (/^text\//.test(file.type || '') || /\.(txt|rtf|md|chordpro|cho|crd)$/i.test(file.name || ''));
  }

  function extractDocxText(file) {
    setImportStatus('Opening Word document…');
    return file.arrayBuffer().then(function (buf) {
      return ensureMammoth().then(function (mammoth) {
        return mammoth.extractRawText({ arrayBuffer: buf });
      });
    }).then(function (res) {
      return (res && res.value) ? String(res.value).trim() : '';
    });
  }

  function extractPlainText(file) {
    setImportStatus('Reading text…');
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || '')); };
      reader.onerror = function () { reject(new Error('Could not read that file.')); };
      reader.readAsText(file);
    });
  }

  function pdfItemsToText(items) {
    var lines = [];
    var line = '';
    var lastY = null;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var str = item.str || '';
      var y = item.transform ? item.transform[5] : 0;
      if (lastY != null && Math.abs(y - lastY) > 3.5) {
        lines.push(line.replace(/[ \t]+$/g, ''));
        line = '';
      }
      line += str;
      if (item.hasEOL) {
        lines.push(line.replace(/[ \t]+$/g, ''));
        line = '';
        lastY = null;
      } else {
        lastY = y;
      }
    }
    if (line) lines.push(line.replace(/[ \t]+$/g, ''));
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();

  function extractPdfText(file, gen) {
    return file.arrayBuffer().then(function (buf) {
      return ensurePdfJs().then(function (pdfjsLib) {
        return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      });
    }).then(function (pdf) {
      var maxPages = Math.min(pdf.numPages, 12);
      var pageTexts = [];
      var i = 1;
      function nextPage() {
        if (gen !== importGen) return Promise.reject(new Error('cancelled'));
        if (i > maxPages) {
          return Promise.resolve({ pdf: pdf, text: pageTexts.join('\n\n').trim(), pages: maxPages });
        }
        setImportStatus('Reading PDF page ' + i + ' of ' + maxPages + '…');
        setImportProgress(10 + (i / maxPages) * 40);
        var pageNo = i++;
        return pdf.getPage(pageNo).then(function (page) {
          return page.getTextContent().then(function (tc) {
            pageTexts.push(pdfItemsToText(tc.items || []));
            return nextPage();
          });
        });
      }
      return nextPage();
    });
  }

  function renderPdfPageToDataUrl(page, scale) {
    var viewport = page.getViewport({ scale: scale || 1.6 });
    var canvas = document.createElement('canvas');
    canvas.width = Math.min(1600, viewport.width);
    canvas.height = Math.min(2200, viewport.height);
    var ctx = canvas.getContext('2d');
    var drawVp = page.getViewport({ scale: canvas.width / page.getViewport({ scale: 1 }).width });
    canvas.height = drawVp.height;
    return page.render({ canvasContext: ctx, viewport: drawVp }).promise.then(function () {
      return canvas.toDataURL('image/png');
    });
  }

  function getOcrWorker(gen) {
    return ensureTesseract().then(function (Tesseract) {
      if (importOcrBroken) {
        importOcrWorker = null;
        importOcrBroken = false;
      }
      if (importOcrWorker) return importOcrWorker;
      return Tesseract.createWorker('eng', 1, {
        logger: function (m) {
          if (gen !== importGen) return;
          if (m && m.status === 'recognizing text' && typeof m.progress === 'number') {
            setImportProgress(55 + m.progress * 40);
            setImportStatus('Reading the page… ' + Math.round(m.progress * 100) + '%');
          } else if (m && m.status) {
            setImportStatus('Preparing image reader…');
          }
        }
      }).then(function (w) {
        importOcrWorker = w;
        return w;
      });
    });
  }

  function ocrSource(src, gen) {
    return getOcrWorker(gen).then(function (worker) {
      return worker.recognize(src).then(function (res) {
        return (res && res.data && res.data.text) ? res.data.text : '';
      }).catch(function (err) {
        importOcrBroken = true;
        try { if (importOcrWorker && importOcrWorker.terminate) importOcrWorker.terminate(); } catch (e) {}
        importOcrWorker = null;
        throw err;
      });
    });
  }

  function ocrPdfPages(pdf, pageCount, gen) {
    var n = Math.min(pageCount, 6);
    var out = [];
    var i = 1;
    function next() {
      if (gen !== importGen) return Promise.reject(new Error('cancelled'));
      if (i > n) return Promise.resolve(out.join('\n\n').trim());
      var pageNo = i++;
      setImportStatus('Scanning page ' + pageNo + ' of ' + n + '…');
      setImportProgress(50 + ((pageNo - 1) / n) * 40);
      return pdf.getPage(pageNo).then(function (page) {
        return renderPdfPageToDataUrl(page, 1.6);
      }).then(function (url) {
        return ocrSource(url, gen);
      }).then(function (text) {
        out.push(text);
        return next();
      });
    }
    return next();
  }

  function recycleFileInput(el) {
    if (!el || !el.parentNode) return;
    var neu = el.cloneNode(true);
    neu.value = '';
    el.parentNode.replaceChild(neu, el);
  }

  function ensureDraftForImport() {
    if (editorDraft) return;
    openEditorDraft(null);
    view = { name: 'editor', songId: null };
    render();
  }

  function pickImportFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []).filter(Boolean);
    if (!files.length) return;
    armFilePickerGuard();
    ensureDraftForImport();
    var first = files.shift();
    importQueue = importQueue.concat(files);
    runImport(first);
  }

  function runImport(file) {
    if (!file) return;
    armFilePickerGuard();
    var gen = ++importGen;
    closeImportMenu();
    openImportReviewBusy();

    var work;
    if (isPdfFile(file)) {
      setImportStatus('Opening PDF…');
      work = extractPdfText(file, gen).then(function (result) {
        if (gen !== importGen) return;
        var text = result.text || '';
        if (text.replace(/\s+/g, '').length >= 8) return text;
        setImportStatus('No selectable text — scanning the pages…');
        return ocrPdfPages(result.pdf, result.pages, gen);

    } else if (isImageFile(file)) {

      setImportProgress(20);

    }

    work.then(function (text) {
      if (gen !== importGen) return;
      var cleaned = String(text || '').replace(/\u0000/g, '').trim();
      if (!cleaned) {
        showImportReviewText('', 'Nothing readable came through. Try a clearer photo, or paste the lyrics instead.');
        return;
      }
      showImportReviewText(cleaned, 'Check line breaks and chords, then tap Use this text.');
    }).catch(function (err) {
      if (gen !== importGen) return;
      if (err && err.message === 'cancelled') return;
      showImportReviewText('', (err && err.message) ? err.message : 'Could not read that file.');
    });
  }

  function applyImportedText() {
    if (!editorDraft) {
      closeImportReview();
      return;
    }
    var ta = byId('import-review-text');
    var text = ta ? ta.value : '';
    var prepared = prepareLyricsForLayout(text);
    if (!String(prepared || '').trim()) {
      toast('No lyrics in that file. Paste them in, or try a PDF / .docx.');
      return;
    }
    editorDraft.lyrics = prepared;
    if (!String(editorDraft.title || '').trim()) {
      var lines = String(prepared).split(/\r?\n/);
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        if (isChordOnlyLine(line)) continue;
        editorDraft.title = line.replace(/^\[|\]$/g, '').slice(0, 80);
        break;
      }
    }
    if (!String(editorDraft.title || '').trim()) editorDraft.title = 'Imported song';
    closeImportReview();
    saveEditor('import');
  }

  function wireImportDrop() {
    var drop = byId('import-drop');
    if (!drop || drop.getAttribute('data-wired') === '1') return;
    drop.setAttribute('data-wired', '1');
    drop.addEventListener('dragover', function (e) {
      e.preventDefault();
      drop.classList.add('is-over');
    });
    drop.addEventListener('dragleave', function () { drop.classList.remove('is-over'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      drop.classList.remove('is-over');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) runImport(f);
    });
  }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'import-file-input' || t.id === 'import-image-input') {
      var list = t.files;
      recycleFileInput(t);
      if (list && list.length) pickImportFiles(list);
    }
    if (t.id === 'restore-library-input') {
      var f = t.files && t.files[0];
      recycleFileInput(t);
      if (f) restoreLibraryFile(f);
    }
  });

  /* ============================================================
     MAIN RENDER DISPATCH
     ============================================================ */
  function render() {
    try {
      document.documentElement.classList.toggle('songbook-home', view.name === 'library' && !view.folder);
      applyTheme();
      if (view.name === 'editor') renderEditor();
      else if (view.name === 'player') renderPlayer();
      else renderLibrary();
    } catch (err) {
      console.error('Songbook render', err);
      if (view.name !== 'library' || view.folder) {
        view = { name: 'library', songId: null, folder: null };
        try { renderLibrary(); } catch (err2) { console.error(err2); }
      }
    }
  }

  /* ---------- Global click delegation ---------- */
  document.addEventListener('click', function (e) {
    try { clickDispatch(e); }
    catch (err) {
      console.error('Songbook click', err);
      try { dismissColorSheet(); } catch (e2) {}
      try {
        stopPlayerLoop();
        view = { name: 'library', songId: null, folder: null };
        render();
      } catch (e3) {}
    }
  });
  function clickDispatch(e) {
    if (!e.target || !e.target.closest) return;
    if (!e.target.closest('#import-menu') && !e.target.closest('[data-action="toggle-import-menu"]')) {
      closeImportMenu();
    }
    if (!e.target.closest('#more-menu') && !e.target.closest('[data-action="toggle-more-menu"]')) {
      var more = byId('more-menu');
      if (more) more.hidden = true;
    }
    if (e.target.closest('.folder-grip')) return;
    var el = e.target.closest('[data-action]');
    if (e.target.id === 'color-picker-modal') { closeColorPicker(); return; }
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (action === 'new-song') { openEditorDraft(null); goEditor(null); }
    else if (action === 'open-folder') { goFolder(el.getAttribute('data-folder')); }
    else if (action === 'library-home') { goLibrary(); }
    else if (action === 'open-studio-site') {
      if (window.confirm('Go visit SourPaintStudios.com?')) {
        window.open('https://sourpaintstudios.com', '_blank', 'noopener');
      }
    }
    else if (action === 'move-song') { openMoveSheet(id); }
    else if (action === 'move-to') { moveSongToCategory(el.getAttribute('data-folder')); }
    else if (action === 'move-cancel') { closeMoveSheet(); }
    else if (action === 'color-song') { openSongColorPicker(id); }
    else if (action === 'color-category') { openCategoryColorPicker(el.getAttribute('data-folder')); }
    else if (action === 'color-stage') {
      colorPicker.stagedId = el.getAttribute('data-palette') || null;
      paintColorPicker();
      if (view.name === 'player' && colorPicker.mode === 'song') {
        applySongSkin({ colorId: colorPicker.stagedId || null });
      }
    }
    else if (action === 'color-set') { applyColorPicker(); }
    else if (action === 'color-cancel') { closeColorPicker(); }
    else if (action === 'open-song') { goPlayer(id); }
    else if (action === 'tap-beat') { handleTap(); }
    else if (action === 'toggle-scroll') {
      if (playerAnimState.isPlaying) stopHoldScroll();
      else resumeHoldScroll();
    }
    else if (action === 'reset-scroll') { resetHoldSpeed(); }
    else if (action === 'scroll-top') { scrollLyricsToTop(); }
    else if (action === 'edit-song') { openEditorDraft(id); goEditor(id); }
    else if (action === 'delete-song') { deleteSong(id); }
    else if (action === 'editor-cancel') { editorDraft = null; if (view.folder) goFolder(view.folder); else goLibrary(); }
    else if (action === 'editor-save') { saveEditor(); }
    else if (action === 'export-library') {
      var moreOpen = byId('more-menu');
      if (moreOpen) moreOpen.hidden = true;
      exportLibrary();
    }
    else if (action === 'player-back') {
      if (exitFitStayOnSong()) return;
      stopPlayerLoop();
      if (view.folder) goFolder(view.folder);
      else goLibrary();
    }
    else if (action === 'remove-photo') { editorDraft.image = null; renderEditor(); }
    else if (action === 'toggle-import-menu') { toggleImportMenu(); }
    else if (action === 'toggle-more-menu') {
      var moreMenu = byId('more-menu');
      if (moreMenu) moreMenu.hidden = !moreMenu.hidden;
    }
    else if (action === 'import-file') {
      closeImportMenu();
      var fileInput = byId('import-file-input');
      if (fileInput) fileInput.click();
    }
    else if (action === 'import-image') {
      closeImportMenu();
      var imgInput = byId('import-image-input');
      if (imgInput) imgInput.click();
    }
    else if (action === 'import-review-cancel') { closeImportReview(); }
    else if (action === 'import-review-use') { applyImportedText(); }
    else if (action === 'shop-prompt') {
      var shopModal = byId('shop-modal');
      if (shopModal) shopModal.hidden = false;
    }
    else if (action === 'shop-prompt-close') {
      var shopModal2 = byId('shop-modal');
      if (shopModal2) shopModal2.hidden = true;
    }
    else if (action === 'open-art-wheel') { openArtWheel(); }
    else if (action === 'art-wheel-close') { closeArtWheel(); }
    else if (action === 'art-wheel-prev') { flipArtWheel(-1); }
    else if (action === 'art-wheel-next') { flipArtWheel(1); }
    else if (action === 'art-wheel-lock') { lockArtPalette(); }
    else if (action === 'art-wheel-clear') { clearArtPalette(); }
    else if (action === 'toggle-reading-picker') {
      var picker = byId('reading-picker');
      if (picker) picker.hidden = !picker.hidden;
    }
    else if (action === 'toggle-reading-invert') {
      toggleReadingInvert();
    }
    else if (action === 'dec-font-size') { adjustFontSize(-2); }
    else if (action === 'inc-font-size') { adjustFontSize(2); }
    else if (action === 'toggle-fit') { toggleFitScreen(); }
    else if (action === 'toggle-glass') { toggleGlassChrome(); }
    else if (action === 'toggle-chord-layout') {
      state.settings.chordLayout = (state.settings.chordLayout === 'left') ? 'standard' : 'left';
      persist();
      refreshLyricsBody();
      paintChordLayoutButton();
    }
    else if (action === 'set-reading-mode') {
      var modeId = el.getAttribute('data-mode');
      state.settings.readingMode = modeId;
      persist();
      applyReadingMode();
      paintInvertButton();
      var pk = byId('reading-picker');
      if (pk) pk.hidden = true;
    }
  }

  /* A pull on the lyrics must never become a page refresh. */
  var lyricDrag = null;
  var lyricPinch = null;
  var lastTouchY = 0;
  function touchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy) || 1;
  }
  function nearestScroller(node) {
    while (node && node !== document.body && node !== document.documentElement) {
      if (node.scrollHeight > node.clientHeight + 2) {
        var oy = window.getComputedStyle(node).overflowY;
        if (oy === 'auto' || oy === 'scroll' || oy === 'overlay') return node;
      }
      node = node.parentElement;
    }
    return null;
  }
  document.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches[0]) lastTouchY = e.touches[0].clientY;
    var viewport = document.getElementById('lyrics-viewport');
    var onLyrics = viewport && e.target && viewport.contains(e.target);
    if (onLyrics && e.touches && e.touches.length >= 2) {
      var wasPlaying = lyricDrag ? lyricDrag.wasPlaying : !!playerAnimState.isPlaying;
      lyricDrag = null;
      if (playerAnimState.isPlaying) stopPlayerLoop();
      lyricPinch = {
        dist: touchDistance(e.touches),
        size: state.settings.lyricsFontSize || 21,
        wasPlaying: wasPlaying
      };
      return;
    }
    if (!onLyrics || !e.touches || !e.touches[0]) return;
    var lyricBody = document.getElementById('lyrics-body');
    if (lyricBody && lyricBody.style.transform) {
      lyricBody.style.transform = '';
      viewport.scrollTop = playerAnimState.scrollOffset || 0;
    }
    playerAnimState.scrollOffset = viewport.scrollTop || 0;
    var playing = !!playerAnimState.isPlaying;
    if (playing) stopPlayerLoop();
    lyricDrag = { y: e.touches[0].clientY, wasPlaying: playing };
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!e.touches || !e.touches[0]) return;
    var viewport = document.getElementById('lyrics-viewport');
    if (lyricPinch && e.touches.length >= 2) {
      var next = Math.round(lyricPinch.size * (touchDistance(e.touches) / lyricPinch.dist));
      next = Math.max(LYRICS_FONT_MIN, Math.min(LYRICS_FONT_MAX, next));
      state.settings.lyricsFontSize = next;
      applyFontSize();
      e.preventDefault();
      return;
    }
    if (e.touches.length >= 2) {
      e.preventDefault();
      return;
    }
    var y = e.touches[0].clientY;
    var dy = y - lastTouchY;
    lastTouchY = y;
    if (lyricDrag && viewport && e.target && viewport.contains(e.target)) {
      var max = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
      var next = viewport.scrollTop - dy;
      if (next < 0) next = 0;
      if (next > max) next = max;
      viewport.scrollTop = next;
      playerAnimState.scrollOffset = next;
      e.preventDefault();
      return;
    }
    var scroller = nearestScroller(e.target);
    if (!scroller) {
      if (dy > 0) e.preventDefault();
      return;
    }
    var atTop = scroller.scrollTop <= 0;
    var atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;
    if ((atTop && dy > 0) || (atBottom && dy < 0)) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (lyricPinch && (!e.touches || e.touches.length < 2)) {
      var resumePinch = lyricPinch.wasPlaying;
      lyricPinch = null;
      persist();
      if (resumePinch && view && view.name === 'player') startPlayerLoop();
      return;
    }
    if (!lyricDrag) return;
    var resume = lyricDrag.wasPlaying;
    lyricDrag = null;
    if (resume && view && view.name === 'player') startPlayerLoop();
  }, { passive: true });
  document.addEventListener('touchcancel', function () {
    if (lyricPinch) {
      var resumePinch = lyricPinch.wasPlaying;
      lyricPinch = null;
      persist();
      if (resumePinch && view && view.name === 'player') startPlayerLoop();
      return;
    }
    if (!lyricDrag) return;
    var resume = lyricDrag.wasPlaying;
    lyricDrag = null;
    if (resume && view && view.name === 'player') startPlayerLoop();
  }, { passive: true });

  /* ---------- Splash, then boot ---------- */
  function boot() {
    try {
      applyTheme();
      render();
    } catch (err) {
      console.error('Songbook boot', err);
      try {
        view = { name: 'library', songId: null, folder: null };
        renderLibrary();
      } catch (err2) {}
    }
    try { pullLibraryFromServer(); } catch (err3) {}
  }

  var splash = document.getElementById('splash');
  if (splash) {
    var verEl = splash.querySelector('.splash-version');
    if (verEl) verEl.textContent = 'Version ' + APP_VERSION;
  }
  boot();
  (function runIntro() {
    if (!splash) return;
    var dismissed = false;
    var coverTimer = null;
    function dismissSplash() {
      if (dismissed) return;
      dismissed = true;
      if (coverTimer) clearTimeout(coverTimer);
      splash.classList.add('splash-out');
      var vid = splash.querySelector('video');
      if (vid) { try { vid.pause(); } catch (e) {} }
      setTimeout(function () { if (splash && splash.parentNode) splash.remove(); }, 500);
    }
    function showCoverThenGo() {
      if (dismissed) return;
      splash.classList.add('is-cover');
      var vid = splash.querySelector('video');
      if (vid) { try { vid.pause(); } catch (e) {} }
      coverTimer = setTimeout(dismissSplash, 1800);
    }
    var vid = splash.querySelector('video');
    var soundBtn = document.getElementById('splash-sound');
    var soundOn = false;
    function hideSoundPrompt() { if (soundBtn) soundBtn.hidden = true; }
    function showSoundPrompt() { if (soundBtn) soundBtn.hidden = false; }
    function startWithSound(fromStart) {
      if (!vid) return;
      vid.muted = false;
      vid.volume = 1;
      if (fromStart) { try { vid.currentTime = 0; } catch (e) {} }
      var p = vid.play();
      if (p && p.then) {
        p.then(function () {
          if (!vid.muted) { soundOn = true; hideSoundPrompt(); }
          else showSoundPrompt();
        }).catch(function () {
          vid.muted = true;
          showSoundPrompt();
          vid.play().catch(function () { showCoverThenGo(); });
        });
      }
    }
    if (vid) {
      vid.muted = false;
      vid.volume = 1;
      vid.playsInline = true;
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      vid.removeAttribute('muted');
      vid.addEventListener('ended', showCoverThenGo);
      vid.addEventListener('error', showCoverThenGo);
      showSoundPrompt();
      startWithSound(false);
    } else {
      showCoverThenGo();
    }
    splash.addEventListener('click', function (e) {
      if (e.target.closest('.splash-skip')) {
        dismissSplash();
        return;
      }
      if (!soundOn) {
        startWithSound(false);
        return;
      }
      dismissSplash();
    });
    setTimeout(function () { if (!dismissed) dismissSplash(); }, 8000);
  })();

})();


</script>
</body>
